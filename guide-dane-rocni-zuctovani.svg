<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">Roční zúčtování daně u zaměstnavatele</title>
<desc id="desc">Moderní ilustrace checklistu dokladů, kalendáře a výplatní pásky pro roční zúčtování daně.</desc>
<defs>
  <linearGradient id="bg" x1="40" y1="30" x2="680" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#EEF7FF"/><stop offset="0.55" stop-color="#F4FFF8"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
  <linearGradient id="card" x1="140" y1="90" x2="560" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F7FBFF"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34D399"/><stop offset="1" stop-color="#0EA5A4"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".13"/></filter>
</defs>
<rect width="720" height="520" rx="34" fill="url(#bg)"/>
<circle cx="610" cy="92" r="78" fill="#DDFBEA" opacity=".75"/>
<circle cx="104" cy="422" r="92" fill="#DBEAFE" opacity=".65"/>
