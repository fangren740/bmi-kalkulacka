<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>CMP diagnostika V2 | RychléVýpočty.cz</title>

  <script>
    window.__rvDiagQueue = [];
    window.googlefc = window.googlefc || {};
    window.googlefc.callbackQueue = window.googlefc.callbackQueue || [];

    function rvNow() {
      return new Date().toISOString();
    }

    function rvSafe(value) {
      try {
        return JSON.parse(JSON.stringify(value));
      } catch (error) {
        return String(value);
      }
    }

    function rvWrite(label, value) {
      var item = { time: rvNow(), label: label, value: rvSafe(value) };
      window.__rvDiagQueue.push(item);

      var log = document.getElementById('log');
      if (!log) return;

      var block = document.createElement('pre');
      block.textContent =
        '[' + item.time + '] ' + item.label + '\n' +
        JSON.stringify(item.value, null, 2);
      log.appendChild(block);
    }

    function rvFlush() {
      var log = document.getElementById('log');
      if (!log || log.dataset.flushed === 'true') return;
      log.dataset.flushed = 'true';

      window.__rvDiagQueue.forEach(function (item) {
        var block = document.createElement('pre');
        block.textContent =
          '[' + item.time + '] ' + item.label + '\n' +
          JSON.stringify(item.value, null, 2);
        log.appendChild(block);
      });
    }

    function rvSnapshot(label) {
      var googleResources = performance.getEntriesByType('resource')
        .map(function (entry) { return entry.name; })
        .filter(function (url) {
          return /googlesyndication|fundingchoices|doubleclick|googlefc/i.test(url);
        });

      var frames = Array.from(document.querySelectorAll('iframe')).map(function (frame) {
        return {
          src: frame.src || '',
          title: frame.title || '',
          display: getComputedStyle(frame).display,
          visibility: getComputedStyle(frame).visibility,
          width: frame.getBoundingClientRect().width,
          height: frame.getBoundingClientRect().height
        };
      });

      rvWrite(label, {
        href: location.href,
        readyState: document.readyState,
        googlefcType: typeof window.googlefc,
        googlefcKeys: Object.keys(window.googlefc || {}),
        callbackQueueLength: window.googlefc &&
          window.googlefc.callbackQueue &&
          window.googlefc.callbackQueue.length,
        controlledMessagingFunction:
          typeof window.googlefc?.controlledMessagingFunction,
        tcfApi: typeof window.__tcfapi,
        consentModeApi:
          typeof window.googlefc?.getGoogleConsentModeValues,
        iframeCount: frames.length,
        frames: frames,
        googleResources: googleResources
      });
    }

    window.googlefc.callbackQueue.push({
      CONSENT_API_READY: function () {
        rvWrite('CONSENT_API_READY', {
          googlefcKeys: Object.keys(window.googlefc || {}),
          tcfApi: typeof window.__tcfapi,
          consentModeApi: typeof window.googlefc?.getGoogleConsentModeValues
        });

        if (typeof window.__tcfapi === 'function') {
          window.__tcfapi('ping', 2, function (data, success) {
            rvWrite('TCF_PING', { success: success, data: data });
          });

          window.__tcfapi('addEventListener', 2, function (data, success) {
            rvWrite('TCF_EVENT', { success: success, data: data });
          });
        }
      }
    });

    window.googlefc.callbackQueue.push({
      CONSENT_DATA_READY: function () {
        rvWrite('CONSENT_DATA_READY', {
          tcfApi: typeof window.__tcfapi
        });
      }
    });

    window.googlefc.callbackQueue.push({
      CONSENT_MODE_DATA_READY: function () {
        var values;
        try {
          values = typeof window.googlefc.getGoogleConsentModeValues === 'function'
            ? window.googlefc.getGoogleConsentModeValues()
            : 'API NENÍ DOSTUPNÉ';
        } catch (error) {
          values = String(error);
        }
        rvWrite('CONSENT_MODE_DATA_READY', values);
      }
    });

    rvWrite('INLINE_INIT', {
      href: location.href,
      readyState: document.readyState,
      queuedCallbacks: window.googlefc.callbackQueue.length
    });
  </script>

  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7745758285259522"
    crossorigin="anonymous"></script>

  <style>
    body{font-family:Arial,sans-serif;max-width:1040px;margin:32px auto;padding:0 18px;line-height:1.55;color:#10243d}
    h1{font-size:2rem;margin-bottom:8px}
    .box{border:1px solid #ccd7e2;border-radius:12px;padding:18px;margin:18px 0;background:#f7f9fb}
    .actions{display:flex;flex-wrap:wrap;gap:10px}
    button,a.button{display:inline-block;padding:12px 16px;border:0;border-radius:8px;background:#0b5ed7;color:white;font-weight:700;cursor:pointer;text-decoration:none}
    button.secondary,a.secondary{background:#44546a}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #d9e2eb;border-radius:8px;padding:12px;background:white;font-size:13px}
    code{background:#e8eef5;padding:2px 5px;border-radius:4px}
  </style>
</head>
<body>
  <h1>Google CMP diagnostika V2</h1>
  <p>Čistý test bez GA4, kalkulaček a dalších skriptů projektu.</p>

  <div class="box">
    <strong>Aktuální URL:</strong>
    <p id="currentUrl"></p>
    <div class="actions">
      <button type="button" id="showAgain">Zkusit zobrazit zprávu</button>
      <button type="button" class="secondary" id="snapshot">Přidat okamžitý snímek stavu</button>
      <a class="button secondary" href="/cmp-diagnostika.html?fc=alwaysshow">Test bez fctype</a>
      <a class="button secondary" href="/cmp-diagnostika.html?fc=alwaysshow&fctype=gdpr">Test GDPR</a>
    </div>
  </div>

  <div class="box">
    <strong>Diagnostický výstup</strong>
    <div id="log"></div>
  </div>

  <script>
    document.getElementById('currentUrl').textContent = location.href;
    rvFlush();
    rvSnapshot('DOM_READY');

    document.getElementById('snapshot').addEventListener('click', function () {
      rvSnapshot('MANUAL_SNAPSHOT');
    });

    document.getElementById('showAgain').addEventListener('click', function () {
      window.googlefc.callbackQueue.push({
        CONSENT_API_READY: function () {
          rvWrite('MANUAL_SHOW_REVOCATION', {
            method: typeof window.googlefc.showRevocationMessage
          });

          if (typeof window.googlefc.showRevocationMessage === 'function') {
            window.googlefc.showRevocationMessage();
          }
        }
      });
    });

    setTimeout(function () { rvSnapshot('AFTER_1_SECOND'); }, 1000);
    setTimeout(function () { rvSnapshot('AFTER_3_SECONDS'); }, 3000);
    setTimeout(function () { rvSnapshot('AFTER_8_SECONDS'); }, 8000);
  </script>
</body>
</html>
