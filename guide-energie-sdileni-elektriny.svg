  <text x="569" y="414" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#64748B">odběrné místo</text>
</g>

<!-- apartment building -->
<g filter="url(#shadow)">
  <rect x="286" y="234" width="148" height="156" rx="24" fill="#FFFFFF"/>
  <rect x="312" y="262" width="28" height="28" rx="7" fill="#DBEAFE"/>
  <rect x="348" y="262" width="28" height="28" rx="7" fill="#DCFCE7"/>
  <rect x="384" y="262" width="28" height="28" rx="7" fill="#DBEAFE"/>
  <rect x="312" y="306" width="28" height="28" rx="7" fill="#DCFCE7"/>
  <rect x="348" y="306" width="28" height="28" rx="7" fill="#DBEAFE"/>
  <rect x="384" y="306" width="28" height="28" rx="7" fill="#DCFCE7"/>
  <rect x="340" y="346" width="42" height="44" rx="10" fill="#F1F5F9"/>
  <text x="360" y="414" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0F172A" font-weight="800">bytový dům</text>
  <text x="360" y="438" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#64748B">alokace v domě</text>
</g>

