  <rect x="64" y="440" width="150" height="52" rx="18" fill="#FFFFFF"/>
  <rect x="84" y="456" width="38" height="10" rx="5" fill="#DCFCE7"/>
  <rect x="84" y="474" width="86" height="8" rx="4" fill="#E2E8F0"/>
  <circle cx="184" cy="466" r="13" fill="#22C55E" opacity=".18"/>
  <path d="M177 466l5 5 10-12" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g filter="url(#shadow)">
  <rect x="246" y="440" width="212" height="52" rx="18" fill="#FFFFFF"/>
  <rect x="266" y="456" width="58" height="10" rx="5" fill="#DBEAFE"/>
