<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">Sdílení elektřiny mezi domem, chalupou a bytovým domem</title>
<desc id="desc">Moderní ilustrace fotovoltaiky, sdílené elektřiny a energetického dashboardu.</desc>
<defs>
  <linearGradient id="bg" x1="70" y1="20" x2="650" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#F2FBFF"/><stop offset="0.55" stop-color="#ECFDF5"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
  <linearGradient id="line" x1="90" y1="250" x2="630" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#16A34A"/><stop offset="0.5" stop-color="#0EA5E9"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity=".12"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="720" height="520" rx="42" fill="url(#bg)"/>
<circle cx="120" cy="105" r="54" fill="#BBF7D0" opacity=".55" filter="url(#soft)"/>
<circle cx="612" cy="98" r="70" fill="#BFDBFE" opacity=".65" filter="url(#soft)"/>
<circle cx="585" cy="418" r="78" fill="#A7F3D0" opacity=".55" filter="url(#soft)"/>
<g opacity=".45" stroke="#CBD5E1" stroke-width="1">
  <path d="M40 390H680"/><path d="M62 340H642"/><path d="M96 291H630"/>
</g>

<!-- main dashboard -->
<g filter="url(#shadow)">
  <rect x="236" y="46" width="248" height="132" rx="26" fill="#FFFFFF"/>
  <rect x="256" y="68" width="92" height="12" rx="6" fill="#DCFCE7"/>
  <rect x="256" y="92" width="170" height="16" rx="8" fill="#0F172A" opacity=".9"/>
  <rect x="256" y="126" width="52" height="30" rx="12" fill="#ECFDF5"/>
  <rect x="322" y="126" width="52" height="30" rx="12" fill="#EFF6FF"/>
  <rect x="388" y="126" width="64" height="30" rx="12" fill="#F8FAFC"/>
  <text x="282" y="145" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#16A34A" font-weight="700">výroba</text>
  <text x="348" y="145" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#2563EB" font-weight="700">sdílení</text>
  <text x="420" y="145" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#475569" font-weight="700">faktura</text>
</g>

<!-- energy lines -->
<path d="M165 244C230 190 279 194 340 236" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity=".95"/>
<path d="M382 236C450 186 514 192 570 244" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity=".95"/>
<path d="M175 312C280 380 440 382 560 314" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity=".35"/>
<g fill="#16A34A"><circle cx="209" cy="213" r="8"/><circle cx="294" cy="210" r="6"/><circle cx="470" cy="205" r="7"/><circle cx="535" cy="224" r="6"/></g>
<g fill="#2563EB"><circle cx="245" cy="350" r="6"/><circle cx="365" cy="372" r="8"/><circle cx="500" cy="350" r="6"/></g>

<!-- house with FVE -->
<g filter="url(#shadow)">
  <rect x="64" y="236" width="170" height="132" rx="22" fill="#FFFFFF"/>
  <path d="M78 245L149 190L220 245Z" fill="#0F172A"/>
  <path d="M112 221L150 194L188 221H112Z" fill="#1D4ED8"/>
  <path d="M117 219L154 193" stroke="#93C5FD" stroke-width="3"/><path d="M136 221L172 200" stroke="#93C5FD" stroke-width="3"/>
  <rect x="92" y="278" width="42" height="70" rx="10" fill="#E0F2FE"/>
  <rect x="154" y="276" width="52" height="38" rx="10" fill="#DCFCE7"/>
  <rect x="154" y="326" width="52" height="14" rx="7" fill="#BBF7D0"/>
  <text x="149" y="392" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0F172A" font-weight="800">dům s FVE</text>
  <text x="149" y="416" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#64748B">výroba + přetoky</text>
</g>

<!-- chalet -->
<g filter="url(#shadow)">
  <rect x="495" y="246" width="148" height="118" rx="22" fill="#FFFFFF"/>
  <path d="M510 254L569 206L628 254Z" fill="#334155"/>
  <rect x="533" y="283" width="38" height="62" rx="10" fill="#FEF3C7"/>
  <rect x="586" y="284" width="32" height="30" rx="8" fill="#DBEAFE"/>
