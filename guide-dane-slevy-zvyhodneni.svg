<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Slevy na dani a daňové zvýhodnění</title>
  <desc id="desc">Moderní ilustrace daňového přehledu se slevou na poplatníka, daňovým zvýhodněním na dítě a odpočty.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="20" x2="660" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#f5f1ff"/><stop offset="0.55" stop-color="#ffffff"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <linearGradient id="dark" x1="180" y1="88" x2="542" y2="150" gradientUnits="userSpaceOnUse"><stop stop-color="#0b2447"/><stop offset="1" stop-color="#1f3d72"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="720" height="520" rx="34" fill="url(#bg)"/><circle cx="110" cy="118" r="56" fill="#7c5cff" opacity=".12"/><circle cx="612" cy="405" r="72" fill="#16a34a" opacity=".12"/><circle cx="626" cy="98" r="34" fill="#dbeafe"/>
  <g filter="url(#shadow)"><rect x="156" y="74" width="408" height="310" rx="28" fill="#fff"/><rect x="156" y="74" width="408" height="76" rx="28" fill="url(#dark)"/><text x="190" y="122" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="900" fill="#fff">Slevy a zvýhodnění</text><rect x="438" y="101" width="82" height="28" rx="14" fill="#dcfce7"/><text x="455" y="121" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="900" fill="#16724a">úspora</text>
    <g transform="translate(190 181)"><rect width="340" height="48" rx="16" fill="#f6f9ff" stroke="#d9e6f3"/><circle cx="25" cy="24" r="12" fill="#22c55e" opacity=".16"/><path d="M19 24l5 5 9-12" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="21" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="900" fill="#0b2447">Sleva na poplatníka</text><text x="52" y="38" font-family="Inter,Arial,sans-serif" font-size="12" fill="#587089">30 840 Kč ročně</text><text x="255" y="31" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="900" fill="#5b3db8">− daň</text></g>
    <g transform="translate(190 244)"><rect width="340" height="48" rx="16" fill="#f8f5ff" stroke="#ddd9f7"/><circle cx="25" cy="24" r="12" fill="#7c5cff" opacity=".16"/><path d="M18 26c8-13 15-13 22 0" fill="none" stroke="#7c5cff" stroke-width="4" stroke-linecap="round"/><text x="52" y="21" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="900" fill="#0b2447">Daňové zvýhodnění na děti</text><text x="52" y="38" font-family="Inter,Arial,sans-serif" font-size="12" fill="#587089">sleva, bonus nebo kombinace</text><text x="252" y="31" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="900" fill="#16a34a">bonus</text></g>
    <g transform="translate(190 307)"><rect width="340" height="48" rx="16" fill="#fffaf0" stroke="#f1dfb8"/><circle cx="25" cy="24" r="12" fill="#f59e0b" opacity=".18"/><path d="M18 26h14M18 19h19M18 33h10" fill="none" stroke="#b77900" stroke-width="4" stroke-linecap="round"/><text x="52" y="21" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="900" fill="#0b2447">Nezdanitelné části</text><text x="52" y="38" font-family="Inter,Arial,sans-serif" font-size="12" fill="#587089">dary, úroky, spoření na stáří</text><text x="247" y="31" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="900" fill="#b77900">základ</text></g>
  </g>
  <g filter="url(#shadow)"><rect x="84" y="322" width="154" height="92" rx="24" fill="#ffffff"/><text x="108" y="356" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="900" fill="#0b2447">Doklady</text><text x="108" y="380" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587089">potvrzení</text><text x="108" y="400" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587089">prohlášení</text></g>
  <g filter="url(#shadow)"><rect x="488" y="334" width="150" height="86" rx="24" fill="#ffffff"/><text x="514" y="368" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="900" fill="#0b2447">Kontrola</text><text x="514" y="392" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587089">měsíčně vs.</text><text x="514" y="411" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587089">ročně</text></g>
</svg>
