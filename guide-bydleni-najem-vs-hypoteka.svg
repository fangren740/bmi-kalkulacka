    <text x="88" y="304" fill="#4F6985" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">nižší vstupní hotovost</text>
    <text x="88" y="340" fill="#4F6985" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">bez rizika oprav nemovitosti</text>
    <text x="88" y="394" fill="#081A33" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900">24 000 Kč / měs.</text>
