<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Příjmy z nájmu a daně</title>
  <desc id="desc">Moderní ilustrace nájemního bytu, daňového přiznání, výdajů a čistého výsledku z pronájmu.</desc>
  <defs>
    <linearGradient id="bg" x1="62" y1="22" x2="660" y2="502" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f3ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="purple" x1="148" y1="76" x2="560" y2="428" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="green" x1="260" y1="124" x2="580" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="720" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="620" cy="86" r="64" fill="#7c3aed" opacity=".09"/>
  <circle cx="116" cy="430" r="86" fill="#14b8a6" opacity=".09"/>
  <path d="M118 374c70-34 113-18 160 0s96 25 166-12 118-38 171-5" fill="none" stroke="#c4b5fd" stroke-width="18" stroke-linecap="round" opacity=".32"/>

  <g filter="url(#shadow)">
    <rect x="82" y="88" width="286" height="318" rx="28" fill="#fff" stroke="#ddd6fe"/>
    <rect x="112" y="216" width="226" height="148" rx="18" fill="#f8fafc" stroke="#e2e8f0"/>
    <path d="M100 225l125-94 126 94" fill="none" stroke="url(#purple)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="155" y="250" width="52" height="114" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
    <rect x="230" y="250" width="72" height="56" rx="10" fill="#ecfeff" stroke="#99f6e4"/>
    <rect x="230" y="320" width="72" height="44" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="195" cy="322" r="5" fill="#7c3aed"/>
    <text x="122" y="124" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#4c1d95">Pronájem bytu</text>
    <text x="122" y="393" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#64748b">nájemné • služby • evidence</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="392" y="96" width="246" height="322" rx="28" fill="#fff" stroke="#ddd6fe"/>
    <text x="424" y="139" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="900" fill="#111827">Daňový přehled</text>
    <rect x="424" y="164" width="182" height="14" rx="7" fill="#e0e7ff"/>
    <rect x="424" y="192" width="150" height="14" rx="7" fill="#ede9fe"/>
    <rect x="424" y="228" width="156" height="42" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="442" y="254" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="900" fill="#5b21b6">Příjmy z nájmu</text>
    <rect x="424" y="286" width="156" height="42" rx="14" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="442" y="312" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="900" fill="#047857">Výdaje 30 %</text>
    <rect x="424" y="344" width="182" height="42" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="442" y="370" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="900" fill="#9a3412">Základ daně</text>
  </g>

  <g>
    <rect x="238" y="56" width="182" height="60" rx="20" fill="#0f172a" opacity=".95"/>
    <text x="262" y="82" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#fff">paušál vs. skutečné</text>
    <text x="284" y="104" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="900" fill="#a7f3d0">30 % výdajů</text>
  </g>
  <g>
    <circle cx="600" cy="432" r="42" fill="url(#green)"/>
    <path d="M580 432l14 14 28-32" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
