<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">DPP, DPČ a daně</title>
  <desc id="desc">Moderní ilustrace daňového rozhodování u dohod DPP a DPČ s kartami srážkové daně, zálohové daně a pojistného.</desc>
  <defs>
