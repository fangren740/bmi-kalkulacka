    <rect x="148" y="190" width="186" height="88" rx="22" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="168" y="222" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#4c1d95">Prohlášení</text>
    <text x="168" y="250" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6472">sleva jen u jednoho</text>
    <rect x="386" y="190" width="186" height="88" rx="22" fill="#eff6ff" stroke="#bfdbfe"/>
