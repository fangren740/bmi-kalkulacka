      <stop stop-color="#faf5ff"/>
      <stop offset=".55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="120" y1="80" x2="610" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#312e81" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="720" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="622" cy="84" r="72" fill="#7c3aed" opacity=".10"/>
  <circle cx="112" cy="430" r="86" fill="#2563eb" opacity=".10"/>
  <path d="M96 160C156 82 270 70 348 117c58 35 116 35 183 12 82-28 142 18 151 92 12 96-72 178-179 177-87-1-116 53-202 53-102 0-198-66-218-159-10-45-4-92 13-132Z" fill="#fff" opacity=".78"/>
