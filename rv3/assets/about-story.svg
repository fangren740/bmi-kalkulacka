<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" role="img" aria-labelledby="title desc">
<title id="title">Od otázky k pochopitelnému výpočtu</title>
<desc id="desc">Ilustrace otevřeného zápisníku, kalkulačky, ověřených podkladů a zeleného pera v kresleném stylu RychléVýpočty V3.</desc>
<defs>
 <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fffef7"/><stop offset="1" stop-color="#e9f0e5"/></linearGradient>
 <linearGradient id="dark" x1="0" x2=".8" y1="0" y2="1"><stop stop-color="#306d66"/><stop offset=".55" stop-color="#164c50"/><stop offset="1" stop-color="#092e3c"/></linearGradient>
 <linearGradient id="mint" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#c5f5c8"/><stop offset="1" stop-color="#85d5af"/></linearGradient>
 <linearGradient id="gold" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#fff0c5"/><stop offset="1" stop-color="#e3b86f"/></linearGradient>
 <linearGradient id="green" x1="0" x2=".95" y1="0" y2="1"><stop stop-color="#4bc97a"/><stop offset="1" stop-color="#08733f"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#185c44" flood-opacity=".22"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<ellipse cx="297" cy="420" rx="232" ry="19" fill="#32895b" opacity=".14" filter="url(#soft)"/>
<circle cx="295" cy="220" r="190" fill="#d0f0d7" opacity=".44"/>
<circle cx="405" cy="85" r="50" fill="#e0f5df" opacity=".8"/>
<!-- pale chart sheet behind -->
<g transform="translate(340 40) rotate(12 95 122)" filter="url(#shadow)">
 <rect width="190" height="245" rx="13" fill="#fbfdf7" stroke="#d4e4d8" stroke-width="2"/>
 <rect x="16" y="18" width="158" height="25" rx="6" fill="#e7f4e8"/>
 <text x="28" y="35" font-size="11" fill="#1f6b52" font-family="Arial,sans-serif" font-weight="700">PODKLADY</text>
 <path d="M28 73h94M28 90h114M28 107h80" stroke="#b4d3c4" stroke-width="6" stroke-linecap="round"/>
 <path d="M28 177h131" stroke="#c9ddcf" stroke-width="2"/>
 <path d="m36 163 29-25 26 10 28-36 28 8" stroke="#198b5b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="119" cy="112" r="5" fill="#239e5e"/>
 <rect x="28" y="192" width="117" height="11" rx="5" fill="#d9eadf"/>
 <rect x="28" y="211" width="87" height="8" rx="4" fill="#e7f0e6"/>
</g>
<!-- notebook: more detailed, tactile instead of generic UI cards -->
<g transform="translate(61 116) rotate(-9 155 155)" filter="url(#shadow)">
 <rect x="1" y="6" width="315" height="307" rx="20" fill="#154b4b"/>
 <rect x="0" y="0" width="312" height="301" rx="18" fill="url(#paper)" stroke="#c3dbce" stroke-width="2"/>
 <rect x="14" y="15" width="284" height="272" rx="10" fill="#fffef8" stroke="#e0e7d9"/>
 <g fill="#386f61"><circle cx="35" cy="39" r="4"/><circle cx="35" cy="78" r="4"/><circle cx="35" cy="117" r="4"/><circle cx="35" cy="156" r="4"/><circle cx="35" cy="195" r="4"/><circle cx="35" cy="234" r="4"/><circle cx="35" cy="273" r="4"/></g>
 <path d="M56 19v267" stroke="#b8d6c4" stroke-width="2"/>
 <text x="74" y="55" font-size="12" font-family="Arial,sans-serif" fill="#1a7a50" font-weight="700" letter-spacing="1.5">POČÍTÁME S VÁMI</text>
 <text x="73" y="92" font-size="26" font-family="Georgia,serif" fill="#153c47" font-weight="700">Od otázky</text>
 <text x="73" y="121" font-size="26" font-family="Georgia,serif" fill="#117d48" font-style="italic">k rozhodnutí.</text>
 <path d="M73 137h194" stroke="#c8ddcf" stroke-width="2"/>
 <circle cx="81" cy="164" r="9" fill="#e1f5e6" stroke="#26a96a" stroke-width="2"/>
 <path d="m76 164 4 4 7-9" stroke="#0c8653" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <text x="100" y="169" font-size="13" font-family="Arial,sans-serif" fill="#315a5c">Co opravdu řešíte</text>
 <circle cx="81" cy="198" r="9" fill="#e1f5e6" stroke="#26a96a" stroke-width="2"/>
 <path d="m76 198 4 4 7-9" stroke="#0c8653" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <text x="100" y="203" font-size="13" font-family="Arial,sans-serif" fill="#315a5c">Z čeho výsledek vychází</text>
 <circle cx="81" cy="232" r="9" fill="#e1f5e6" stroke="#26a96a" stroke-width="2"/>
 <path d="m76 232 4 4 7-9" stroke="#0c8653" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <text x="100" y="237" font-size="13" font-family="Arial,sans-serif" fill="#315a5c">Co číslo znamená</text>
 <path d="M74 261h146" stroke="#d2e3d6" stroke-width="3" stroke-linecap="round"/>
</g>
<!-- compact calculator visual; not a fabricated financial result -->
<g transform="translate(351 267) rotate(9 95 72)" filter="url(#shadow)">
 <rect x="0" y="0" width="181" height="150" rx="22" fill="url(#dark)"/>
 <rect x="13" y="13" width="155" height="124" rx="14" fill="none" stroke="#83c5a6" stroke-opacity=".5"/>
 <rect x="22" y="20" width="137" height="47" rx="8" fill="url(#mint)"/>
 <text x="149" y="51" text-anchor="end" font-size="23" font-family="Arial,sans-serif" fill="#134c4b" font-weight="700">= ?</text>
 <g fill="#4f8c7e"><rect x="22" y="79" width="35" height="23" rx="5"/><rect x="65" y="79" width="35" height="23" rx="5"/><rect x="108" y="79" width="51" height="23" rx="5"/><rect x="22" y="110" width="35" height="21" rx="5"/><rect x="65" y="110" width="35" height="21" rx="5"/></g>
 <rect x="108" y="110" width="51" height="21" rx="5" fill="url(#green)"/>
 <g fill="#eaf9ef" font-family="Arial,sans-serif" font-weight="700" font-size="15" text-anchor="middle"><text x="39" y="96">7</text><text x="82" y="96">8</text><text x="134" y="96">9</text><text x="39" y="126">4</text><text x="82" y="126">5</text><text x="134" y="126">=</text></g>
</g>
<!-- floating pencil -->
<g transform="translate(275 346) rotate(-32 0 0)" filter="url(#shadow)">
 <rect x="-10" y="-12" width="176" height="23" rx="9" fill="url(#green)"/>
 <rect x="-10" y="-12" width="176" height="5" rx="2" fill="#83e3a0" opacity=".8"/>
 <rect x="131" y="-12" width="20" height="23" fill="url(#gold)"/>
 <path d="m166-12 29 12-29 11Z" fill="#dec49a"/>
 <path d="m193-1 7 1-7 1Z" fill="#28404a"/>
</g>
<!-- small warm sparkle accents, matching catalogue illustration style -->
<g fill="#dba949" opacity=".9"><path d="m88 70 6 12 13 5-13 5-6 12-5-12-12-5 12-5Z"/><circle cx="497" cy="217" r="5"/><circle cx="458" cy="447" r="4"/></g>
</svg>