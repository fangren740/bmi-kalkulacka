<g transform="translate(239 361) rotate(-38)" filter="url(#shadow)">
 <rect x="-10" y="-10" width="168" height="20" rx="9" fill="url(#leaf)"/>
 <path d="M-9-9h153" stroke="#8be8a6" stroke-width="4" stroke-linecap="round"/>
 <rect x="134" y="-10" width="19" height="20" fill="url(#honey)"/>
 <path d="m153-10 28 10-28 10Z" fill="#ddc398"/>
 <path d="m178-1 8 1-8 1Z" fill="#25404a"/>
</g>
<g fill="#e6b969"><path d="m96 64 6 13 13 5-13 5-6 13-5-13-13-5 13-5Z"/><circle cx="500" cy="215" r="5"/><circle cx="455" cy="448" r="4"/></g>
