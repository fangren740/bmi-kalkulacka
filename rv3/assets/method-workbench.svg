 <text x="27" y="35" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#17834d" letter-spacing="1">ZDROJE</text>
 <path d="M24 71h111M24 87h129M24 103h87" stroke="#b7d5c2" stroke-linecap="round" stroke-width="5"/>
 <rect x="23" y="129" width="138" height="88" rx="8" fill="#f3faf2" stroke="#d5e7d7"/>
 <path d="M37 194v-38M68 194v-28M99 194v-52M130 194v-37" stroke="#d4e4d6" stroke-width="2"/>
 <path d="M35 183 67 165 99 175 132 150" stroke="#16a15b" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" fill="none"/>
 <circle cx="132" cy="150" r="6" fill="#e9bc69" stroke="#fff" stroke-width="2"/>
