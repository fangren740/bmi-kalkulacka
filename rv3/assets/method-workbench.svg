 <path d="M56 16v266" stroke="#b8d9c3" stroke-width="2"/>
 <g fill="#28715d"><circle cx="36" cy="38" r="4"/><circle cx="36" cy="77" r="4"/><circle cx="36" cy="116" r="4"/><circle cx="36" cy="155" r="4"/><circle cx="36" cy="194" r="4"/><circle cx="36" cy="233" r="4"/><circle cx="36" cy="271" r="4"/></g>
 <text x="74" y="48" font-family="Arial,sans-serif" font-weight="800" fill="#14844c" font-size="11" letter-spacing="1.3">KONTROLNÍ PŘÍKLAD</text>
 <text x="73" y="80" font-family="Georgia,serif" fill="#103b4a" font-size="25" font-weight="bold">Od zadání</text>
 <text x="73" y="109" font-family="Georgia,serif" fill="#118148" font-size="25" font-style="italic">k výsledku.</text>
 <path d="M74 126h192" stroke="#d2e1d1" stroke-width="2"/>
 <text x="74" y="154" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#456f67">CENA</text>
 <text x="265" y="154" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#214c54">1 000 Kč</text>
 <path d="M74 163h193" stroke="#cde2d5" stroke-dasharray="3 4"/>
 <text x="74" y="183" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#456f67">NÁKLAD / KS</text>
 <text x="265" y="183" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#214c54">600 Kč</text>
 <path d="M74 192h193" stroke="#cde2d5" stroke-dasharray="3 4"/>
 <rect x="72" y="207" width="202" height="48" rx="8" fill="#e1f6e4" stroke="#b6e0c4"/>
 <text x="86" y="226" font-family="Arial,sans-serif" font-weight="800" font-size="10" fill="#147a49">PŘÍSPĚVEK / KS</text>
 <text x="260" y="243" text-anchor="end" font-family="Arial,sans-serif" font-size="21" font-weight="800" fill="#0a693d">400 Kč</text>
</g>
<!-- calculator overlay -->
<g transform="translate(353 276) rotate(8 86 68)" filter="url(#shadow)">
 <rect width="176" height="144" rx="21" fill="url(#navy)"/>
 <rect x="13" y="13" width="150" height="119" rx="13" stroke="#75bda5" stroke-opacity=".5" fill="none"/>
 <rect x="22" y="21" width="132" height="43" rx="7" fill="url(#mint)"/>
 <text x="145" y="49" text-anchor="end" font-family="Arial,sans-serif" font-size="21" font-weight="800" fill="#135351">400</text>
 <g fill="#579185"><rect x="21" y="77" width="33" height="21" rx="5"/><rect x="62" y="77" width="33" height="21" rx="5"/><rect x="103" y="77" width="51" height="21" rx="5"/><rect x="21" y="108" width="33" height="21" rx="5"/><rect x="62" y="108" width="33" height="21" rx="5"/></g>
 <rect x="103" y="108" width="51" height="21" rx="5" fill="url(#leaf)"/>
