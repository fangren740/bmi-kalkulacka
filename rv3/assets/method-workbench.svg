<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" role="img" aria-labelledby="title desc">
<title id="title">Pracovní stůl s ověřeným výpočtem</title>
<desc id="desc">Originální vektorová ilustrace v barvách RychléVýpočty: otevřený sešit, podklady, zelená kalkulačka, graf, tužka a lupa ověřující model.</desc>
<defs>
 <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffef7"/><stop offset="1" stop-color="#e8efe5"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#377268"/><stop offset=".55" stop-color="#15505b"/><stop offset="1" stop-color="#0a3043"/></linearGradient>
 <linearGradient id="mint" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#d8fbdd"/><stop offset="1" stop-color="#8ddab1"/></linearGradient>
 <linearGradient id="leaf" x1="0" x2=".8" y1="0" y2="1"><stop stop-color="#55d68b"/><stop offset="1" stop-color="#087e47"/></linearGradient>
 <linearGradient id="honey" x1="0" x2=".8" y1="0" y2="1"><stop stop-color="#ffefd0"/><stop offset="1" stop-color="#e1b96f"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0e4d3a" flood-opacity=".22"/></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="17"/></filter>
</defs>
<ellipse cx="295" cy="426" rx="226" ry="25" fill="#2f8758" opacity=".15" filter="url(#blur)"/>
<circle cx="296" cy="220" r="184" fill="#d5f3d9" opacity=".55"/>
<circle cx="444" cy="96" r="44" fill="#d9f4d3" opacity=".65"/>
