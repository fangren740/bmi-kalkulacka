<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" role="img" aria-labelledby="title desc">
<title id="title">Mapa ochrany osobních údajů</title>
<desc id="desc">Autorská ilustrace pro RychléVýpočty: prohlížeč, zelený bezpečnostní štít, ikona zámku, papírová obálka, datový dokument a přehledně naznačené oddělené cesty údajů.</desc>
<defs>
 <linearGradient id="navy" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#40817b"/><stop offset=".45" stop-color="#185e64"/><stop offset="1" stop-color="#092e47"/></linearGradient>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffff9"/><stop offset="1" stop-color="#e9f7e9"/></linearGradient>
 <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7be7a0"/><stop offset=".5" stop-color="#25a75f"/><stop offset="1" stop-color="#047c42"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9ffed"/><stop offset="1" stop-color="#b4e4ca"/></linearGradient>
 <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2d2"/><stop offset="1" stop-color="#dcb875"/></linearGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="13" stdDeviation="11" flood-color="#0c553e" flood-opacity=".24"/></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<ellipse cx="294" cy="425" rx="230" ry="25" fill="#27724b" opacity=".13" filter="url(#blur)"/>
<circle cx="289" cy="226" r="178" fill="#d3f1d8" opacity=".7"/>
<circle cx="478" cy="102" r="43" fill="#ceebc8" opacity=".67"/>
