<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" role="img" aria-labelledby="title desc">
<title id="title">Napište RychlýmVýpočtům</title>
<desc id="desc">Autorská ilustrace dopisní obálky, zelené poštovní schránky s kontrolní značkou, papírové zprávy a drobných grafických akcentů.</desc>
<defs>
 <linearGradient id="letter" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffffa"/><stop offset="1" stop-color="#eaf8eb"/></linearGradient>
 <linearGradient id="forest" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#347f6b"/><stop offset=".48" stop-color="#125b57"/><stop offset="1" stop-color="#0b3347"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8ffeb"/><stop offset="1" stop-color="#a7e3bd"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66d58d"/><stop offset="1" stop-color="#078549"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4cf"/><stop offset="1" stop-color="#e1c47e"/></linearGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#0b5742" flood-opacity=".21"/></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="17"/></filter>
</defs>
<ellipse cx="290" cy="418" rx="224" ry="25" fill="#1b734d" opacity=".13" filter="url(#blur)"/>
<circle cx="297" cy="217" r="180" fill="#d4f1d8" opacity=".62"/>
<circle cx="490" cy="136" r="49" fill="#c4eacb" opacity=".56"/>
<!-- Decorative outgoing message wing -->
<path d="M66 195c-34-10-55-32-41-54 14-21 55-16 87 7" stroke="#5cbf85" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="8 15" opacity=".52"/>
<!-- Rear letter with actual meaningful content -->
<g transform="translate(87 46) rotate(-9 124 149)" filter="url(#shadow)">
 <rect width="248" height="302" rx="18" fill="url(#letter)" stroke="#c3dfcd" stroke-width="2"/>
 <rect x="17" y="18" width="214" height="44" rx="9" fill="url(#mint)"/>
 <text x="32" y="37" font-family="Arial,sans-serif" font-size="10" font-weight="900" letter-spacing="1.1" fill="#17844c">ZPRÁVA PRO PROJEKT</text>
 <text x="32" y="53" font-family="Georgia,serif" font-size="17" font-style="italic" fill="#165449">Máte dobrý podnět?</text>
 <g stroke="#c3ddc9" stroke-linecap="round" stroke-width="5"><path d="M30 91h168"/><path d="M30 108h191"/><path d="M30 125h171"/><path d="M30 158h182"/><path d="M30 175h157"/><path d="M30 192h187"/></g>
 <rect x="27" y="223" width="193" height="53" rx="9" fill="#e4f6e6" stroke="#c3e4cb"/>
 <circle cx="53" cy="249" r="15" fill="url(#green)"/>
 <path d="m45 249 6 6 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
 <text x="77" y="247" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#237251">Konkrétní popis</text>
 <text x="77" y="262" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#47886e">pomůže s ověřením</text>
</g>
<!-- Front postal envelope -->
<g transform="translate(128 186) rotate(8 151 97)" filter="url(#shadow)">
 <rect width="304" height="196" rx="18" fill="#e5efe4" stroke="#c4dac6" stroke-width="3"/>
 <path d="M3 13 152 125 301 13" fill="none" stroke="#92b4a2" stroke-width="3"/>
 <path d="m2 178 110-93M303 178 192 85" stroke="#a8cdb5" stroke-width="2.5" fill="none"/>
 <path d="M11 189 138 103q14-10 28 0l128 86" fill="url(#mint)" stroke="#8fbd9f" stroke-width="2.5"/>
 <rect x="10" y="10" width="284" height="176" rx="11" fill="none" stroke="#fafff8" stroke-width="3" opacity=".9"/>
 <rect x="20" y="18" width="62" height="49" rx="9" fill="#fff" opacity=".88"/>
 <circle cx="51" cy="43" r="17" fill="#e1f4e4" stroke="#8acbaa"/>
 <path d="m43 44 6 6 13-16" stroke="#0c8750" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</g>
<!-- Main branded mailbox signal -->
<g transform="translate(391 91) rotate(8 66 73)" filter="url(#shadow)">
 <rect x="1" y="29" width="132" height="139" rx="22" fill="url(#forest)" stroke="#2b6d64" stroke-width="3"/>
 <path d="M24 29Q66-27 110 29" fill="url(#forest)" stroke="#2b6d64" stroke-width="3"/>
 <rect x="22" y="61" width="90" height="17" rx="8" fill="#071f30" stroke="#6fb49b" stroke-width="2"/>
 <path d="M43 69h48" stroke="#91d9b7" stroke-width="2" stroke-linecap="round"/>
 <rect x="28" y="101" width="78" height="37" rx="9" fill="#e4f7e8"/>
 <text x="67" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="900" letter-spacing=".5" fill="#12864a">NAPIŠTE NÁM</text>
 <path d="M43 126h46" stroke="#a5cdb6" stroke-width="3" stroke-linecap="round"/>
 <rect x="58" y="160" width="16" height="48" rx="5" fill="#27566a"/>
 <rect x="30" y="198" width="72" height="15" rx="7" fill="url(#forest)"/>
</g>
<!-- Warm floating check stamp -->
<g transform="translate(46 311) rotate(-10 47 47)" filter="url(#shadow)">
 <circle cx="47" cy="47" r="45" fill="url(#gold)" stroke="#ddbd80" stroke-width="3"/>
 <circle cx="47" cy="47" r="34" fill="#fff9e7" stroke="#e0ca98" stroke-width="2" stroke-dasharray="3 4"/>
 <path d="m28 49 12 12 26-30" stroke="#10854c" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g fill="#e8bc6d"><path d="m90 71 7 17 17 6-17 7-7 17-7-17-17-7 17-6Z"/><circle cx="495" cy="262" r="5"/></g>
<path d="M499 392q16 11 29-2" stroke="#55b77e" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>