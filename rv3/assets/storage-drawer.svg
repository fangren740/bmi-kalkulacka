<g transform="translate(94 54) rotate(-5 161 129)" filter="url(#shadow)">
 <rect width="320" height="265" rx="19" fill="url(#navy)" stroke="#397a6c" stroke-width="2"/>
 <rect x="12" y="13" width="296" height="240" rx="11" fill="url(#paper)"/>
 <path d="M12 51h296" stroke="#d3e5d6" stroke-width="2"/>
 <g fill="#a7c7b7"><circle cx="29" cy="32" r="6"/><circle cx="47" cy="32" r="6"/><circle cx="65" cy="32" r="6"/></g>
 <rect x="87" y="22" width="201" height="20" rx="10" fill="#e2f3e5" stroke="#c8e2d0"/>
 <path d="M100 32h112" stroke="#b5d6c3" stroke-width="4" stroke-linecap="round"/>
 <text x="30" y="82" font-family="Arial,sans-serif" font-size="10" font-weight="900" letter-spacing="1.1" fill="#1a8150">TENTO PROHLÍŽEČ</text>
 <text x="30" y="113" font-family="Georgia,serif" font-size="24" font-style="italic" fill="#164b51">Moje nastavení</text>
 <path d="M29 133h260" stroke="#c9e3cf" stroke-width="2"/>
 <g stroke="#d0e2d2" stroke-width="5" stroke-linecap="round"><path d="M33 156h106"/><path d="M33 181h131"/><path d="M33 207h91"/></g>
 <g transform="translate(198 148)">
  <rect width="89" height="41" rx="20" fill="url(#mint)" stroke="#91cfaa" stroke-width="2"/>
