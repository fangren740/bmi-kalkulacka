 <text x="18" y="30" font-family="Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="1" fill="#715829">SMAZÁNÍ DAT</text>
 <rect x="15" y="46" width="105" height="70" rx="9" fill="#fffdf6" stroke="#e1cc98"/>
 <rect x="47" y="70" width="39" height="30" rx="5" fill="none" stroke="#11814b" stroke-width="3"/>
 <path d="M43 63h47M57 59h18M60 79v13M73 79v13" stroke="#11814b" stroke-width="3.2" stroke-linecap="round" fill="none"/>
</g>
