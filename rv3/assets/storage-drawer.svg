  <path d="m60 21 5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
</g>
<!-- Local drawer; iconographic database, not a cloud -->
<g transform="translate(185 216) rotate(5 121 88)" filter="url(#shadow)">
 <rect x="0" y="32" width="241" height="157" rx="16" fill="url(#navy)" stroke="#245f62" stroke-width="2.5"/>
 <rect x="13" y="52" width="215" height="118" rx="9" fill="#edfbef" stroke="#a4d2b5" stroke-width="3"/>
 <!-- nine tabs, visually meaningful without microscopic text -->
 <g>
  <rect x="28" y="26" width="174" height="125" rx="10" fill="#e3f2e6" stroke="#b6d7bf"/>
  <rect x="34" y="19" width="174" height="125" rx="10" fill="#f8fff7" stroke="#b6d7bf"/>
