<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 430" role="img" aria-labelledby="title desc">
<title id="title">Přehled lokálně uložených údajů</title>
<desc id="desc">Ilustrace okna prohlížeče, otevřeného šuplíku s uloženými nastaveními a lístku s postupem odstranění uložených dat.</desc>
<defs>
 <linearGradient id="navy" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#377d72"/><stop offset=".52" stop-color="#185c61"/><stop offset="1" stop-color="#113649"/></linearGradient>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffef9"/><stop offset="1" stop-color="#ecf8e9"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0fff0"/><stop offset="1" stop-color="#b9e7c7"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#71dfa0"/><stop offset="1" stop-color="#08854c"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0c4"/><stop offset="1" stop-color="#e6c585"/></linearGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="11" stdDeviation="9" flood-color="#1b5839" flood-opacity=".22"/></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<ellipse cx="296" cy="395" rx="224" ry="21" fill="#185b44" opacity=".15" filter="url(#blur)"/>
<circle cx="288" cy="201" r="167" fill="#d9f2dc" opacity=".68"/>
<circle cx="493" cy="76" r="37" fill="#b8e7c6" opacity=".65"/>
