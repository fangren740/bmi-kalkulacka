<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" role="img" aria-labelledby="title desc">
<title id="title">Redakční stůl a kontrola obsahu RychléVýpočty</title>
<desc id="desc">Autorská vektorová ilustrace: vrstvené redakční dokumenty, otevřené poznámky, kontrolní značky, lupa, zelené pero a nalepovací lístky se zdroji a platností.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#f0f8ee"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34786e"/><stop offset=".53" stop-color="#155364"/><stop offset="1" stop-color="#0b3045"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaffea"/><stop offset="1" stop-color="#b9e8c9"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65d998"/><stop offset="1" stop-color="#098349"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffecc6"/><stop offset="1" stop-color="#dcb773"/></linearGradient>
 <filter id="shadow" x="-45%" y="-50%" width="190%" height="200%"><feDropShadow dx="0" dy="11" stdDeviation="10" flood-color="#184938" flood-opacity=".23"/></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
