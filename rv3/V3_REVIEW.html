onerDiscount):0;const socialEmployee=Math.max(0,socialEmployeeBeforeDiscount-pensionerDiscountAmount);const socialEmployer=ceil(socialBase*CONFIG.socialEmployer);\nconst healthAssessment=v.healthMinimum?Math.max(gross,CONFIG.minimumWage):gross;const healthTotal=ceil(healthAssessment*CONFIG.healthTotal);let healthEmployee,healthEmployer;if(v.healthMinimum&&healthAssessment>gross){healthEmployer=ceil(gross*CONFIG.healthEmployer);healthEmployee=Math.max(0,healthTotal-healthEmployer)}else{healthEmployee=ceil(healthTotal/3);healthEmployer=Math.max(0,healthTotal-healthEmployee)}const healthSupplementBase=Math.max(0,healthAssessment-gross);\nconst baseForTax=taxBase(gross);const taxBeforeDiscounts=progressiveTax(baseForTax);const taxpayerDiscount=v.taxDeclaration?CONFIG.taxpayerDiscount:0;const disabilityDiscount=v.taxDeclaration?v.disabilityDiscount:0;const ztpDiscount=v.taxDeclaration&&v.ztpDiscount?CONFIG.ztpDiscount:0;const personalDiscounts=taxpayerDiscount+disabilityDiscount+ztpDiscount;const taxAfterPersonal=Math.max(0,taxBeforeDiscounts-personalDiscounts);const childrenCredit=v.taxDeclaration?childCredit(v.children):0;const afterChildrenRaw=taxAfterPersonal-childrenCredit;const taxAfterDiscounts=Math.max(0,afterChildrenRaw);const possibleTaxBonus=Math.max(0,-afterChildrenRaw);const taxBonusEligible=gross>=CONFIG.monthlyBonusIncomeThreshold&&possibleTaxBonus>=CONFIG.monthlyBonusMinimum;const taxBonus=taxBonusEligible?possibleTaxBonus:0;\nconst employeeInsurance=socialEmployee+healthEmployee;const netSalary=Math.max(0,Math.round(gross-employeeInsurance-taxAfterDiscounts+taxBonus));const afterOther=Math.max(0,Math.round(netSalary-v.otherDeductions));const employerContributions=socialEmployer+healthEmployer;const totalCost=Math.round(gross+employerContributions);const mandatoryDeductions=gross-netSalary;const highTaxBase=Math.max(0,baseForTax-CONFIG.highTaxMonthlyThreshold);const netGrossRatio=gross>0?netSalary/gross*100:0;return{...v,gross,socialBase,socialCapUsed,soc ndex.html\">Domů\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"./mzdy-a-prace.html\">Mzdy a práce\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003cspan>Čistá mzda\u003c/span>\u003c/nav>\u003c/div>\n\u003cheader class=\"page-head\">\u003cdiv class=\"wrap\">\u003cspan class=\"eyebrow\">Výpočet pro zaměstnance · 2026\u003c/span>\u003ch1>Čistá mzda 2026.\u003cbr>Kolik vám zůstane?\u003c/h1>\u003cp>Zadejte hrubou mzdu a uvidíte částku na účet, pojistné, daň i náklad firmy. Pro běžný pracovní poměr a celý odpracovaný měsíc.\u003c/p>\u003c/div>\u003c/header>\n\u003csection class=\"wrap calc-layout\" aria-label=\"Kalkulačka čisté mzdy 2026\">\n\u003cform id=\"rv3-salary-form\" class=\"card calc-form\" novalidate>\u003cspan class=\"eyebrow\">01 · Vaše zadání\u003c/span>\u003ch2 style=\"font-size:1.7rem;margin:9px 0 24px\">Základní údaje\u003c/h2>\n\u003cdiv class=\"field\">\u003clabel for=\"rv3-gross\">Hrubá měsíční mzda\u003c/label>\u003cdiv class=\"control with-unit\">\u003cinput id=\"rv3-gross\" value=\"45000\" inputmode=\"decimal\" autocomplete=\"off\" aria-describedby=\"gross-hint\">\u003cspan class=\"unit\">Kč\u003c/span>\u003c/div>\u003csmall id=\"gross-hint\">Zdanitelná hrubá mzda bez jiných příjmů.\u003c/small>\u003cdiv class=\"preset-row\" aria-label=\"Rychlé příklady\">\u003cbutton type=\"button\" data-rv3-gross=\"22400\" data-rv3-kids=\"0\">22 400 Kč\u003c/button>\u003cbutton type=\"button\" data-rv3-gross=\"45000\" data-rv3-kids=\"0\">45 000 Kč\u003c/button>\u003cbutton type=\"button\" data-rv3-gross=\"60000\" data-rv3-kids=\"2\">60 000 + 2 děti\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv class=\"field\">\u003clabel class=\"check\" for=\"rv3-declaration\">\u003cinput id=\"rv3-declaration\" type=\"checkbox\" checked>\u003cspan>\u003cstrong>Podepsané prohlášení poplatníka\u003c/strong>\u003cbr>\u003csmall>Uplatní se měsíční sleva na poplatníka 2 570 Kč.\u003c/small>\u003c/span>\u003c/label>\u003c/div>\n\u003cdiv class=\"field\">\u003clabel for=\"rv3-children\">Počet uplatňovaných dětí\u003c/label>\u003cdiv class=\"control\">\u003cselect id=\"rv3-children\">\u003coption value=\"0\">Žádné\u003c/option>\u003coption value=\"1\">1 dítě\u003c/option>\u003coption value=\"2\">2 děti\u003c/option>\u003coption value=\"3\">3 děti\u003c/option>\u003c/select>\u003c/div>\u003csmall>Pořadí dětí můžete upřesnit v pokročilém modelu.\u003c/small>\u003c/div>\n\u003cdetails id=\"rv3-advanced\" class=\"calc-advanced\">\u003csummary>Pokročilý model · prémie, slevy a výjimky\u003c/summary>\u003cdiv class=\"advanced-inner\">\n\u003cdiv class=\"form-2\">\u003cdiv class=\"field\">\u003clabel for=\"rv3-bonus\">Prémie a odměny\u003c/label>\u003cdiv class=\"control with-unit\">\u003cinput id=\"rv3-bonus\" value=\"0\" inputmode=\"decimal\">\u003cspan class=\"unit\">Kč\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"field\">\u003clabel for=\"rv3-other\">Další známé srážky\u003c/label>\u003cdiv class=\"control with-unit\">\u003cinput id=\"rv3-other\" value=\"0\" inputmode=\"decimal\">\u003cspan class=\"unit\">Kč\u003c/span>\u003c/div>\u003csmall>Odečtou se až po čisté mzdě.\u003c/small>\u003c/div>\u003c/div>\n\u003cdiv class=\"field\">\u003cspan class=\"label\">Přesné pořadí uplatňovaných dětí\u003c/span>\u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"rv3-child-first\">1. dítě (1 267 Kč/měs.)\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\" id=\"rv3-child-second\">2. dítě (1 860 Kč/měs.)\u003c/label>\u003cdiv class=\"field\" style=\"margin-top:14px\">\u003clabel for=\"rv3-child-third\">Počet 3. a dalších dětí (2 320 Kč každé)\u003c/label>\u003cdiv class=\"control\">\u003cinput id=\"rv3-child-third\" inputmode=\"numeric\" type=\"number\" min=\"0\" max=\"10\" step=\"1\" value=\"0\">\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"field\">\u003clabel for=\"rv3-disability\">Invalidita\u003c/label>\u003cdiv class=\"control\">\u003cselect id=\"rv3-disability\">\u003coption value=\"0\">Neuplatňuji\u003c/option>\u003coption value=\"210\">I. nebo II. stupeň · sleva 210 Kč\u003c/option>\u003coption value=\"420\">III. stupeň · sleva 420 Kč\u003c/option>\u003c/select>\u003c/div>\u003c/div>\n\u003clabel class=\"check\">\u003cinput id=\"rv3-ztp\" type=\"checkbox\">Průkaz ZTP/P · sleva 1 345 Kč měsíčně\u003c/label>\n\u003clabel class=\"check\">\u003cinput id=\"rv3-pensioner\" type=\"checkbox\">Pracující starobní důchodce · sleva na sociálním\u003c/label>\n\u003clabel class=\"check\">\u003cinput id=\"rv3-health-minimum\" type=\"checkbox\">Uplatnit dopočet zdravotního minima\u003c/label>\n\u003chr class=\"form-divider\">\u003clabel class=\"check\">\u003cinput id=\"rv3-social-cap\" type=\"checkbox\" checked>Uplatnit roční maximum sociálního pojištění\u003c/label>\n\u003cdiv class=\"field\">\u003clabel for=\"rv3-year-base\">Dosavadní roční základ sociálního pojištění\u003c/label>\u003cdiv class=\"control with-unit\">\u003cinput id=\"rv3-year-base\" inputmode=\"decimal\" value=\"0\">\u003cspan class=\"unit\">Kč\u003c/span>\u003c/div>\u003csmall>Od ledna před tímto měsícem; pro kontrolu stropu 2 350 416 Kč.\u003c/small>\u003c/div>\n\u003c/div>\u003c/details>\n\u003cp id=\"rv3-error\" class=\"form-error\" role=\"alert\" hidden>\u003c/p>\u003cdiv style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:20px\">\u003cbutton class=\"btn btn-dark\" type=\"submit\">Přepočítat mzdu →\u003c/button>\u003cbutton class=\"btn btn-outline\" id=\"rv3-reset\" type=\"button\">Obnovit model\u003c/button>\u003c/div>\u003cp class=\"form-note\">Výsledek se přepočítává při změně zadání. Pokročilé výjimky se použijí jen při otevřeném pokročilém modelu.\u003c/p>\n\u003c/form>\n\u003caside class=\"card calc-result\" id=\"rv3-result\" aria-label=\"Výsledek výpočtu\">\u003cdiv class=\"result-overline\">\u003cspan>02 · Výsledek\u003c/span>\u003cb>Orientační čistá mzda\u003c/b>\u003c/div>\u003cdiv id=\"rv3-result-content\">\u003cdiv class=\"net-hero\" aria-live=\"polite\" aria-atomic=\"true\">\u003csmall>Na účet po povinných odvodech\u003c/small>\u003cstrong class=\"amount\" id=\"rv3-net\">35 600 Kč\u003c/strong>\u003cp id=\"rv3-ratio\">79,1 % hrubé mzdy\u003c/p>\u003c/div>\n\u003cdiv class=\"result-rows\">\u003cdiv class=\"result-row\">\u003cspan>Hrubá mzda celkem\u003c/span>\u003cstrong id=\"rv3-gross-out\">45 000 Kč\u003c/strong>\u003c/div>\u003cdiv class=\"result-row\">\u003cspan>Sociální pojištění zaměstnance\u003c/span>\u003cstrong id=\"rv3-social-out\">−3 195 Kč\u003c/strong>\u003c/div>\u003cdiv class=\"result-row\">\u003cspan>Zdravotní pojištění zaměstnance\u003c/span>\u003cstrong id=\"rv3-health-out\">−2 025 Kč\u003c/strong>\u003c/div>\u003cdiv class=\"result-row\">\u003cspan>Daň po slevách\u003c/span>\u003cstrong id=\"rv3-tax-out\">−4 180 Kč\u003c/strong>\u003c/div>\u003cdiv class=\"result-row\" id=\"rv3-bonus-row\" hidden>\u003cspan>Daňový bonus\u003c/span>\u003cstrong id=\"rv3-bonus-out\">\u003c/strong>\u003c/div>\u003cdiv class=\"result-row strong\">\u003cspan>Celkové náklady zaměstnavatele\u003c/span>\u003cstrong id=\"rv3-cost\">60 210 Kč\u003c/strong>\u003c/div>\u003cdiv class=\"result-row\" id=\"rv3-after-row\" hidden>\u003cspan>Po dalších vámi zadaných srážkách\u003c/span>\u003cstrong id=\"rv3-after\">\u003c/strong>\u003c/div>\u003c/div>\n\u003cdiv class=\"result-context\">\u003cp id=\"rv3-context\">Model běžného pracovního poměru za celý měsíc.\u003c/p>\u003c/div>\n\u003cdetails class=\"result-details\">\u003csummary>Zobrazit podrobný rozpis výpočtu\u003c/summary>\u003cdiv class=\"result-rows\">\u003cdiv class=\"result-row\">\u003cspan>Daňový základ\u003c/span>\u003cstrong id=\"rv3-tax-base\">\u003c/strong>\u003c/div>\u003cdiv class=\"result-row\">\u003cspan>Daň před slevami\u003c/span>\u003cstrong id=\"rv3-tax-before\">\u003c/strong>\u003c/div>\u003cdiv class=\"result-row\">\u003cspan>Osobní daňové slevy\u003c/span>\u003cstrong id=\"rv3-tax-discount\">\u003c/strong>\u003c/div>\u003cdiv class=\"result-row\">\u003cspan>Zvýhodnění na děti\u003c/span>\u003cstrong id=\"rv3-child-credit\">\u003c/strong>\u003c/div>\u003cdiv class=\"result-row\">\u003cspan>Sociální základ\u003c/span>\u003cstrong id=\"rv3-social-base\">\u003c/strong>\u003c/div>\u003cdiv class=\"result-row\">\u003cspan>Sociální odvody firmy\u003c/span>\u003cstrong id=\"rv3-employer-social\">\u003c/strong>\u003c/div>\u003cdiv class=\"result-row\">\u003cspan>Zdravotní odvody firmy\u003c/span>\u003cstrong id=\"rv3-employer-health\">\u003c/strong>\u003c/div>\u003c/div>\u003cp>Výpočet vychází ze sazeb a pravidel roku 2026. Oproti výplatní pásce mohou vzniknout rozdíly v nestandardních situacích.\u003c/p>\u003c/details>\n\u003c/div>\u003cp id=\"rv3-result-empty\" class=\"result-placeholder\" hidden>Opravte zadané hodnoty. Neplatný výsledek nezobrazujeme.\u003c/p>\u003c/aside>\u003c/section>\n\u003csection class=\"wrap method\" id=\"metodika\">\u003ch2>Co kalkulačka započítává a co ne\u003c/h2>\u003cp>Model HPP za celý odpracovaný měsíc používá sazby sociálního a zdravotního pojištění, daňové pásmo 15/23 %, měsíční slevy a daňová zvýhodnění pro rok 2026. Podrobné varianty umožňují řešit důchodce, invaliditu, ZTP/P, zdravotní minimum a roční sociální strop. Neřeší DPP/DPČ, nemocenskou, neplacené volno ani zvláštní daňové režimy.\u003c/p>\u003cp>Výpočtové jádro V3 bylo převzato beze změny vzorců ze stávající kalkulačky. \u003ca href=\"https://rychlevypocty.cz/jak-se-pocita-cista-mzda-v-roce-2026.html\">Podrobná metodika čisté mzdy 2026 →\u003c/a>\u003c/p>\u003c/section>\u003c/main>\n\u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">\u003cdiv class=\"footer-inner\">\u003cdiv>\u003ca class=\"logo\" href=\"./index.html\">\u003cspan class=\"logo-mark\" aria-hidden=\"true\">↗\u003c/span> Rychlé\u003cspan>Výpočty\u003c/span>\u003c/a>\u003cdiv class=\"footer-note\">Praktické výpočty pro lepší rozhodnutí.\u003c/div>\u003c/div>\u003cnav class=\"footer-links\" aria-label=\"Informace o webu\">\u003ca href=\"https://rychlevypocty.cz/o-nas.html\">O projektu\u003c/a>\u003ca href=\"https://rychlevypocty.cz/jak-pocitame.html\">Metodika\u003c/a>\u003ca href=\"https://rychlevypocty.cz/ochrana-osobnich-udaju.html\">Soukromí\u003c/a>\u003ca href=\"https://rychlevypocty.cz/kontakt.html\">Kontakt\u003c/a>\u003c/nav>\u003c/div>\u003cdiv class=\"footer-note\">© 2026 RychléVýpočty.cz · Výpočty jsou orientační a nenahrazují individuální odborné posouzení.\u003c/div>\u003c/div>\u003c/footer>\n\u003cscript>/* RV3 salary engine — calculation logic verbatim from cista-mzda-vnext.js, production main 2041e3ea. */\n(function(root){'use strict';\nconst ceil=v=>Math.ceil(Math.max(0,Number(v)||0)-1e-7);const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));\n\nconst CONFIG=Object.freeze({socialEmployee:.071,pensionerDiscount:.065,socialEmployer:.248,healthTotal:.135,healthEmployer:.09,taxBasic:.15,taxHigh:.23,highTaxMonthlyThreshold:146901,taxpayerDiscount:2570,invalidity12:210,invalidity3:420,ztpDiscount:1345,child1:1267,child2:1860,child3Plus:2320,annualSocialCap:2350416,minimumWage:22400,monthlyBonusIncomeThreshold:11200,monthlyBonusMinimum:50});\n\nfunction childCredit(children){return(children.first?CONFIG.child1:0)+(children.second?CONFIG.child2:0)+children.thirdPlus*CONFIG.child3Plus}\nfunction taxBase(gross){if(gross\u003c=0)return 0;return gross\u003c=100?Math.ceil(gross):Math.ceil(gross/100)*100}\nfunction progressiveTax(base){const low=Math.min(base,CONFIG.highTaxMonthlyThreshold),high=Math.max(0,base-CONFIG.highTaxMonthlyThreshold);return ceil(low*CONFIG.taxBasic+high*CONFIG.taxHigh)}\nfunction calculate(v){const gross=v.grossBase+v.bonus;const remainingSocial=v.applySocialCap?Math.max(0,CONFIG.annualSocialCap-v.yearSocialBase):gross;const socialBase=v.applySocialCap?Math.min(gross,remainingSocial):gross;const socialCapUsed=v.applySocialCap&&socialBase\u003cgross;const socialEmployeeBeforeDiscount=ceil(socialBase*CONFIG.socialEmployee);const pensionerDiscountAmount=v.pensionerDiscount?ceil(socialBase*CONFIG.pensionerDiscount):0;const socialEmployee=Math.max(0,socialEmployeeBeforeDiscount-pensionerDiscountAmount);const socialEmployer=ceil(socialBase*CONFIG.socialEmployer);\nconst healthAssessment=v.healthMinimum?Math.max(gross,CONFIG.minimumWage):gross;const healthTotal=ceil(healthAssessment*CONFIG.healthTotal);let healthEmployee,healthEmployer;if(v.healthMinimum&&healthAssessment>gross){healthEmployer=ceil(gross*CONFIG.healthEmployer);healthEmployee=Math.max(0,healthTotal-healthEmployer)}else{healthEmployee=ceil(healthTotal/3);healthEmployer=Math.max(0,healthTotal-healthEmployee)}const healthSupplementBase=Math.max(0,healthAssessment-gross);\nconst baseForTax=taxBase(gross);const taxBeforeDiscounts=progressiveTax(baseForTax);const taxpayerDiscount=v.taxDeclaration?CONFIG.taxpayerDiscount:0;const disabilityDiscount=v.taxDeclaration?v.disabilityDiscount:0;const ztpDiscount=v.taxDeclaration&&v.ztpDiscount?CONFIG.ztpDiscount:0;const personalDiscounts=taxpayerDiscount+disabilityDiscount+ztpDiscount;const taxAfterPersonal=Math.max(0,taxBeforeDiscounts-personalDiscounts);const childrenCredit=v.taxDeclaration?childCredit(v.children):0;const afterChildrenRaw=taxAfterPersonal-childrenCredit;const taxAfterDiscounts=Math.max(0,afterChildrenRaw);const possibleTaxBonus=Math.max(0,-afterChildrenRaw);const taxBonusEligible=gross>=CONFIG.monthlyBonusIncomeThreshold&&possibleTaxBonus>=CONFIG.monthlyBonusMinimum;const taxBonus=taxBonusEligible?possibleTaxBonus:0;\nconst employeeInsurance=socialEmployee+healthEmployee;const netSalary=Math.max(0,Math.round(gross-employeeInsurance-taxAfterDiscounts+taxBonus));const afterOther=Math.max(0,Math.round(netSalary-v.otherDeductions));const employerContributions=socialEmployer+healthEmployer;const totalCost=Math.round(gross+employerContributions);const mandatoryDeductions=gross-netSalary;const highTaxBase=Math.max(0,baseForTax-CONFIG.highTaxMonthlyThreshold);const netGrossRatio=gross>0?netSalary/gross*100:0;return{...v,gross,socialBase,socialCapUsed,socialEmployeeBeforeDiscount,pensionerDiscountAmount,socialEmployee,socialEmployer,healthAssessment,healthSupplementBase,healthTotal,healthEmployee,healthEmployer,baseForTax,taxBeforeDiscounts,taxpayerDiscount,disabilityDiscount,ztpDiscount,personalDiscounts,childrenCredit,taxAfterDiscounts,possibleTaxBonus,taxBonusEligible,taxBonus,employeeInsurance,netSalary,afterOther,employerContributions,totalCost,mandatoryDeductions,highTaxBase,netGrossRatio}}\n\nfunction standardScenario(gross,declaration,firstChild){const v={mode:\"basic\",grossBase:gross,bonus:0,otherDeductions:0,taxDeclaration:declaration,disabilityDiscount:0,ztpDiscount:false,pensionerDiscount:false,healthMinimum:false,applySocialCap:true,yearSocialBase:0,children:{first:firstChild,second:false,thirdPlus:0}};return calculate(v)}\n\nroot.RV3Salary=Object.freeze({CONFIG,calculate,standardScenario});\n})(typeof window!=='undefined'?window:globalThis);\n\u003c/script>\u003cscript>/* RV3 calculator UI. Pure math stays in salary-engine.js (verbatim 2026 formulas). */\n(()=>{'use strict';const form=document.getElementById('rv3-salary-form');if(!form)return;\nconst engine=window.RV3Salary;if(!engine){document.getElementById('rv3-error').textContent='Výpočetní modul se nenačetl.';document.getElementById('rv3-error').hidden=false;return}\nconst el=id=>document.getElementById('rv3-'+id),money=n=>new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:0}).format(Math.round(n))+' Kč',sign=n=>(n\u003c0?'−':n>0?'+':'')+money(Math.abs(n)),fmt=n=>new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:1}).format(n);\nconst parse=s=>{const x=String(s??'').trim().replace(/[\\s\\u00a0]/g,'').replace(',','.');return x===''?NaN:Number(x)};\nconst toNumber=id=>parse(el(id).value),bool=id=>el(id).checked;\nconst advanced=el('advanced'),count=el('children');\nfunction syncChildren(){const n=Number(count.value);el('child-first').checked=n>=1;el('child-second').checked=n>=2;el('child-third').value=Math.max(0,n-2)}\nfunction clearError(){el('error').hidden=true;el('error').textContent='';form.querySelectorAll('[aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'))}\nfunction invalid(id,msg){el(id)?.setAttribute('aria-invalid','true');el('error').hidden=false;el('error').textContent=msg;el('result-content').hidden=true;el('result-empty').hidden=false;return false}\nfunction read(){\n const adv=advanced.open;\n return {mode:adv?'advanced':'basic',grossBase:toNumber('gross'),bonus:adv?toNumber('bonus'):0,otherDeductions:adv?toNumber('other'):0,\n taxDeclaration:bool('declaration'),disabilityDiscount:adv?toNumber('disability'):0,ztpDiscount:adv&&bool('ztp'),pensionerDiscount:adv&&bool('pensioner'),healthMinimum:adv&&bool('health-minimum'),\n applySocialCap:!adv||bool('social-cap'),yearSocialBase:adv?toNumber('year-base'):0,\n children:adv?{first:bool('child-first'),second:bool('child-second'),thirdPlus:Math.min(10,Math.max(0,Math.round(toNumber('child-third')||0)))}:{first:Number(count.value)>=1,second:Number(count.value)>=2,thirdPlus:Math.max(0,Number(count.value)-2)}\n }\n}\nfunction valid(v){\n if(!Number.isFinite(v.grossBase)||v.grossBase\u003c=0||v.grossBase>1e8)return invalid('gross','Zadejte hrubou mzdu od 1 Kč do 100 milionů Kč.');\n if(!Number.isFinite(v.bonus)||v.bonus\u003c0||v.bonus>1e8)return invalid('bonus','Prémie musí být od 0 do 100 milionů Kč.');\n if(!Number.isFinite(v.otherDeductions)||v.otherDeductions\u003c0||v.otherDeductions>1e8)return invalid('other','Další srážky musí být od 0 do 100 milionů Kč.');\n if(!Number.isFinite(v.yearSocialBase)||v.yearSocialBase\u003c0||v.yearSocialBase>1e9)return invalid('year-base','Zadejte dosavadní roční základ od 0 do 1 miliardy Kč.');\n if(advanced.open&&(!Number.isFinite(toNumber('child-third'))||toNumber('child-third')\u003c0||toNumber('child-third')>10))return invalid('child-third','Počet třetích a dalších dětí musí být celé číslo 0 až 10.');\n return true\n}\nfunction put(id,s){el(id).textContent=s}\nfunction draw(r){\n put('net',money(r.netSalary));put('gross-out',money(r.gross));put('social-out',sign(-r.socialEmployee));put('health-out',sign(-r.healthEmployee));put('tax-out',sign(-r.taxAfterDiscounts));\n put('bonus-out',sign(r.taxBonus));el('bonus-row').hidden=r.taxBonus===0;put('cost',money(r.totalCost));put('ratio',fmt(r.netGrossRatio)+' % hrubé mzdy');\n el('after-row').hidden=r.otherDeductions===0;put('after',money(r.afterOther));put('employer-social',money(r.socialEmployer));put('employer-health',money(r.healthEmployer));\n put('tax-before',money(r.taxBeforeDiscounts));put('tax-discount',money(r.personalDiscounts));put('child-credit',money(r.childrenCredit));\n put('tax-base',money(r.baseForTax));put('social-base',money(r.socialBase));\n let note='Model běžného pracovního poměru za celý měsíc.';\n if(!r.taxDeclaration)note+=' Bez měsíčních daňových slev.';\n if(r.taxBonus>0)note+=' Výsledek zahrnuje daňový bonus '+money(r.taxBonus)+'.';\n if(r.gross\u003cengine.CONFIG.minimumWage&&!r.healthMinimum)note+=' U nízké mzdy ověřte, zda se vás týká povinný dopočet zdravotního minima.';\n if(r.socialCapUsed)note+=' Vypočteno se zbývající částí ročního sociálního maxima.';\n if(r.highTaxBase>0)note+=' Část základu spadá do 23% pásma.';\n put('context',note);el('result-content').hidden=false;el('result-empty').hidden=true\n}\nfunction update(){clearError();const v=read();if(valid(v))draw(engine.calculate(v))}\nform.addEventListener('input',e=>{if(e.target===count)syncChildren();update()});\nform.addEventListener('change',e=>{if(e.target===count)syncChildren();update()});\nform.addEventListener('submit',e=>{e.preventDefault();update();if(!el('error').hidden)el('error').scrollIntoView({block:'center'});else if(matchMedia('(max-width:950px)').matches)el('result').scrollIntoView({block:'start',behavior:'smooth'})});\nadvanced.addEventListener('toggle',()=>{if(advanced.open)syncChildren();update()});\ndocument.querySelectorAll('[data-rv3-gross]').forEach(b=>b.addEventListener('click',()=>{el('gross').value=b.dataset.rv3Gross;count.value=b.dataset.rv3Kids||'0';syncChildren();update()}));\nel('reset').addEventListener('click',()=>{form.reset();advanced.open=false;el('gross').value='45000';count.value='0';syncChildren();update()});\nsyncChildren();update()\n})();\n\u003c/script>\u003c/body>\u003c/html>"};
