name: Odstupne Gold V7 final gate
on:
  push:
    branches: [upgrade/odstupne-v7]
    paths: [.github/workflows/odstupne-gold-fix.yml]
permissions:
  contents: write
jobs:
  final-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odstupne-v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize candidate and repair Gold CSS payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/odstupne-gold-build.yml').read_text()
          marker="          python - <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY\n", start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          Path('/tmp/materialize.py').write_text(code)
          PY
          python /tmp/materialize.py
          python - <<'PY'
          from pathlib import Path
          p=Path('odstupne-kalkulacka.css'); s=p.read_text(); marker='\\n\\n/* Gold V7 hardening'
          if marker not in s: raise SystemExit('Gold CSS escaped marker missing')
          i=s.index(marker); tail=s[i:].replace('\\n','\n'); p.write_text(s[:i]+tail)
          PY
          node --check odstupne.js
          grep -q '§ 67 odst. 1 písm. d)' odstupne-kalkulacka.html
          grep -q 'Metodika znovu ověřena 15. 9. 2026' odstupne-kalkulacka.html
          grep -q 'logo-rv-v32.svg' odstupne-kalkulacka.html
          ! grep -q 'basis: "§ 67 odst. 2"' odstupne.js
      - name: Install QA
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/rvqa" puppeteer-core@24.16.0 lighthouse@13.4.1
      - name: Deep browser correctness mobile and UX gate
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 & sleep 1
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');
          (async()=>{const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const errs=[];
          for(const width of [1440,1280,1024,768,430,390,360,320]){const p=await b.newPage();p.on('pageerror',e=>errs.push(String(e)));p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});await p.setViewport({width,height:1000});await p.goto('http://127.0.0.1:8765/odstupne-kalkulacka.html',{waitUntil:'networkidle0'});const base=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,total:document.querySelector('#resultTotal').textContent.trim(),logo:document.querySelector('header img').getAttribute('src'),toolTop:Math.round(document.querySelector('#kalkulacka').getBoundingClientRect().top+scrollY),heroHeight:Math.round(document.querySelector('.stp-hero').getBoundingClientRect().height)}));console.log('WIDTH',width,base);if(base.overflow)throw new Error('overflow '+width);if(base.total.replace(/\s/g,'')!=='84000Kč')throw new Error('default '+width+' '+base.total);if(!base.logo.includes('logo-rv-v32.svg'))throw new Error('logo '+width);if(width<=390&&base.toolTop>820)throw new Error('mobile first-use tool too low '+width+' '+base.toolTop);
            if(width===390){await p.click('[data-mode-button="pro"]');await p.waitForFunction(()=>document.body.dataset.mode==='pro');await p.$eval('#proWorkTimeAccount',e=>{e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'')==='210000Kč');if(!(await p.$eval('#decisionType',e=>e.textContent)).includes('písm. d'))throw new Error('konto legal basis');await p.$eval('#proWorkTimeAccount',e=>{e.checked=false;e.dispatchEvent(new Event('change',{bubbles:true}))});await p.$eval('#proReason',e=>{e.value='exposure';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'')==='504000Kč');if((await p.$eval('#decisionType',e=>e.textContent.trim()))!=='§ 67 odst. 3')throw new Error('exposure paragraph');await p.$eval('#proReturnEnabled',e=>{e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForFunction(()=>!document.querySelector('#repaymentBox').hidden);await p.$eval('#proReason',e=>{e.value='workHealth';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#proReturnEnabled').disabled===true);if(!(await p.$eval('#repaymentBox',e=>e.hidden)))throw new Error('271ca repayment');if(!(await p.$eval('#returnEligibilityNote',e=>e.textContent)).includes('§ 271ca'))throw new Error('271ca explanation');await p.$eval('#proReason',e=>{e.value='other';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.$eval('#proExtraMultiplier',e=>{e.value='2';e.dispatchEvent(new Event('input',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#proReturnEnabled').disabled===true);if(!(await p.$eval('#repaymentBox',e=>e.hidden)))throw new Error('contractual repayment');const bad=await p.$$eval('.stp-btn,.stp-mode__button,.stp-choice-grid label,.stp-toggle',els=>els.filter(e=>e.offsetParent!==null).map(e=>({t:e.textContent.trim().slice(0,30),w:e.getBoundingClientRect().width,h:e.getBoundingClientRect().height})).filter(x=>x.h<44||x.w<44));if(bad.length)throw new Error('small targets '+JSON.stringify(bad.slice(0,5)));}
            await p.close();}await b.close();if(errs.length)throw new Error(errs.join('\n'));console.log('ODSTUPNE_GOLD_BROWSER_QA_PASS');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Lighthouse Gold gate mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');for(const n of ['mobile','desktop']){const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+n+'.json'));const s=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));console.log(n.toUpperCase(),s);if(s.performance<98||s.accessibility<100||s['best-practices']<100||s.seo<100)process.exit(1);}
          NODE
      - name: Build exact preview and screenshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,base64
          h=Path('odstupne-kalkulacka.html').read_text();css='\n'.join(Path(p).read_text() for p in ['rv-brand-v32.css','rv-social-links.css','odstupne-kalkulacka.css']);js=Path('odstupne.js').read_text();h=re.sub(r'<link rel="stylesheet" href="/rv-brand-v32.css[^>]*>\s*','',h);h=re.sub(r'<link rel="stylesheet" href="/rv-social-links.css[^>]*>\s*','',h);h=re.sub(r'<link rel="stylesheet" href="/odstupne-kalkulacka.css[^>]*>',lambda m:'<style>'+css+'</style>',h);h=re.sub(r'<script src="/odstupne.js[^>]*></script>',lambda m:'<script>'+js+'</script>',h)
          for name in ['logo-rv-v32.svg','logo-rv-v32-inverse.svg','favicon-rv-v32.svg']:
            data=base64.b64encode(Path(name).read_bytes()).decode();h=re.sub(r'/'+re.escape(name)+r'(?:\?v=1)?',lambda m:'data:image/svg+xml;base64,'+data,h)
          Path('RV_ODSTUPNE_GOLD_LIVE_PREVIEW.html').write_text(h)
          PY
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');(async()=>{const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});for(const [n,w,h] of [['desktop',1440,1100],['mobile390',390,844],['mobile320',320,780]]){const p=await b.newPage();await p.setViewport({width:w,height:h});await p.goto('http://127.0.0.1:8765/odstupne-kalkulacka.html',{waitUntil:'networkidle0'});await p.screenshot({path:'candidate-'+n+'-top.png'});await p.evaluate(()=>document.querySelector('#kalkulacka').scrollIntoView());await new Promise(r=>setTimeout(r,250));await p.screenshot({path:'candidate-'+n+'-tool.png'});await p.close();}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: odstupne-gold-final-candidate
          path: |
            RV_ODSTUPNE_GOLD_LIVE_PREVIEW.html
            candidate-*.png
            ${{ runner.temp }}/mobile.json
            ${{ runner.temp }}/desktop.json
          retention-days: 30
      - name: Commit only verified production files and clean QA scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/odstupne-gold-fix.yml .github/workflows/odstupne-gold-build.yml .github/workflows/odstupne-baseline.yml .github/workflows/odstupne-diagnostic.yml
          git add odstupne-kalkulacka.html odstupne-kalkulacka.css odstupne.js
          git commit -m 'Upgrade severance calculator to Gold V7'
          git push origin HEAD:upgrade/odstupne-v7
