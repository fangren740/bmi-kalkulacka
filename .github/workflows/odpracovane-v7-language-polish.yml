name: RV worked-hours V7 language polish gate
on:
  push:
    branches: ['upgrade/odpracovane-hodiny-v7']
    paths: ['.github/workflows/odpracovane-v7-language-polish.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'upgrade/odpracovane-hodiny-v7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Polish result grammar without changing calculation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('odpracovane-hodiny.js')
          s=p.read_text(encoding='utf-8')
          repl={
            'const basicLabel = result.sourceMode === "basic" ? `${result.count} stejných směn` : `${result.blocks.length} typy směn`;':'const basicLabel = result.sourceMode === "basic" ? `Počet směn: ${result.count}` : `Typy směn: ${result.blocks.length}`;',
            'setText(out.heroNote, result.sourceMode === "basic" ? `Jedna směna má ${formatHours(first.netPerShift)} čistého času. Celkem je započteno ${result.count} směn.` : `Pokročilý režim sečetl ${result.blocks.length} směnové bloky a ${result.count} směn.`);':'setText(out.heroNote, result.sourceMode === "basic" ? `Čistý čas jedné směny: ${formatHours(first.netPerShift)}. Celkem směn: ${result.count}.` : `Pokročilý režim kombinuje zadané směnové bloky. Celkem směn: ${result.count}.`);',
            'setText(out.resultSummary, result.sourceMode === "basic" ? `${result.count} směn po ${formatHours(first.netPerShift)} po odečtení ${first.breakPerShift}minutové pauzy.` : `${result.blocks.length} typy směn, celkem ${result.count} směn a průměr ${formatHours(result.average)} čistého času.`);':'setText(out.resultSummary, result.sourceMode === "basic" ? `Počet směn: ${result.count}. Čistý čas jedné směny: ${formatHours(first.netPerShift)} po odečtení ${first.breakPerShift}minutové pauzy.` : `Typy směn: ${result.blocks.length}. Celkem směn: ${result.count}. Průměr: ${formatHours(result.average)} čistého času.`);'
          }
          for old,new in repl.items():
              if s.count(old) != 1:
                  raise SystemExit(f'Expected JS phrase once: {old[:80]} / got {s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check odpracovane-hodiny.js
      - name: Functional browser regression QA
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/rvqa" puppeteer-core@24.16.0 lighthouse@13.4.1
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 1
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const errors=[];
            for(const width of [1440,1024,768,390,320]){
              const page=await browser.newPage();
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
              await page.setViewport({width,height:900});
              await page.goto('http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html',{waitUntil:'networkidle0'});
              if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2)) throw new Error('Horizontal overflow '+width);
              const base=await page.$eval('#resultTotal',e=>e.textContent.trim());
              if(base!=='160 h') throw new Error('Default result '+base);
              if(width===390){
                await page.click('.mode-switch [data-mode="advanced"]');
                await page.waitForFunction(()=>document.body.dataset.mode==='advanced');
                const mode=await page.$eval('#heroMode',e=>e.textContent.trim());
                if(!/^Typy směn: \d+$/.test(mode)) throw new Error('Advanced label '+mode);
                const summary=await page.$eval('#resultSummary',e=>e.textContent.trim());
                if(!summary.includes('Typy směn:') || summary.includes(' typy směn')) throw new Error('Advanced summary '+summary);
              }
              await page.close();
            }
            await browser.close();
            if(errors.length) throw new Error(errors.join('\n'));
            console.log('WORKED_HOURS_LANGUAGE_BROWSER_QA_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Lighthouse regression gate
        shell: bash
        run: |
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$LH" 'http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');
          for (const name of ['mobile','desktop']) {
            const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+name+'.json','utf8'));
            const scores=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));
            console.log(name.toUpperCase(),scores);
            if(Object.values(scores).some(v=>v<100)) process.exit(1);
          }
          NODE
      - name: Build exact self-contained live preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re
          h=Path('kalkulacka-odpracovanych-hodin.html').read_text(encoding='utf-8')
          css='\n'.join(Path(p).read_text(encoding='utf-8') for p in ['rv-brand-v32.css','rv-social-links.css','odpracovane-hodiny.css'])
          js=Path('odpracovane-hodiny.js').read_text(encoding='utf-8')
          h=re.sub(r'<link rel="stylesheet" href="/rv-brand-v32.css[^>]*>\s*','',h)
          h=re.sub(r'<link rel="stylesheet" href="/rv-social-links.css[^>]*>\s*','',h)
          h=re.sub(r'<link rel="stylesheet" href="/odpracovane-hodiny.css[^>]*>',lambda m:'<style>'+css+'</style>',h)
          h=re.sub(r'<script src="/odpracovane-hodiny.js[^>]*></script>',lambda m:'<script>'+js+'</script>',h)
          for name in ['logo-rv-v32.svg','logo-rv-v32-inverse.svg','favicon-rv-v32.svg']:
            data=base64.b64encode(Path(name).read_bytes()).decode('ascii')
            h=re.sub(r'/'+re.escape(name)+r'(?:\?v=1)?',lambda m:'data:image/svg+xml;base64,'+data,h)
          Path('RV_ODPRACOVANE_HODINY_V7_LIVE_PREVIEW.html').write_text(h,encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: worked-hours-v7-live-preview-approved-candidate
          path: RV_ODPRACOVANE_HODINY_V7_LIVE_PREVIEW.html
          retention-days: 30
      - name: Commit verified candidate and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/odpracovane-v7-language-polish.yml
          git add odpracovane-hodiny.js
          git commit -m 'Polish worked-hours result language'
          git push origin HEAD:upgrade/odpracovane-hodiny-v7
