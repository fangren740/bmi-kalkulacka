name: RV Promote 91

on:
  push:
    paths:
      - '.github/workflows/rv-promote-91.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Release V-next 91
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path

          root = Path('.')
          payload = (root / '.github/rv_payload_91.txt').read_text(encoding='utf-8').strip()
          bundle = json.loads(gzip.decompress(base64.b64decode(payload)).decode('utf-8'))

          target = 'kolik-stoji-umele-mleko-kalkulacka.html'
          dataset = 'umele-mleko-tin-runway-2026-regression.csv'
          (root / target).write_text(bundle['html'], encoding='utf-8')
          (root / dataset).write_text(bundle['csv'], encoding='utf-8')

          pp = root / 'RV_VNEXT_PROGRESS.json'
          data = json.loads(pp.read_text(encoding='utf-8'))
          completed = [x for x in data.get('completedPages', []) if x.get('file') != target and x.get('sequence') != 91]
          completed.append({
            'file': target,
            'url': 'https://rychlevypocty.cz/kolik-stoji-umele-mleko-kalkulacka.html',
            'status': 'DONE',
            'decision': 'KEEP + FULL CLEAN REBUILD',
            'majorChangeDate': '2026-08-29',
            'archetype': 'Tin Runway / whole-tin purchase planner',
            'researchVerifiedAt': '2026-08-29',
            'qaStatus': 'PASS',
            'benchmarkDataset': {'enabled': True, 'file': dataset, 'rows': 25, 'verifiedAt': '2026-08-29', 'mode': 'REGRESSION_SCENARIOS_NOT_PRICE_BENCHMARK'},
            'structuredData': ['BreadcrumbList','WebApplication','Dataset'],
            'minimumHoldUntil': '2026-09-12',
            'holdUntil': '2026-09-26',
            'manualProductionVisualGate': 'PASS',
            'manualProductionVisualGateAt': '2026-08-29',
            'notes': 'Full V-next rebuild approved by user on 2026-08-29. Replaces fractional monthly tins and unsupported ±15% pseudo-scenarios with a deterministic Tin Runway based on user-entered powder consumption, pack weight, price and time horizon. Output separates consumed grams from whole tins actually purchased and leftover stock. Optional ml-to-grams helper requires the user to copy grams per 100 ml from the specific product label; the calculator never recommends dose, product suitability or feeding quantity.',
            'sequence': 91
          })
          data['completedPages'] = sorted(completed, key=lambda x: x.get('sequence',9999))
          data['inProgressPages'] = [x for x in data.get('inProgressPages', []) if x.get('file') != target and x.get('sequence') != 91]
          data['currentCandidate'] = None
          data['nextCandidate'] = None
          data['updatedAt'] = '2026-08-29'
          data['lastUpdated'] = '2026-08-29'
          ti = data.setdefault('trackingIntegrity', {})
          ti['lastReconciledAt'] = '2026-08-29'
          ti['reconciledAgainst'] = 'GitHub main + user-approved #91 preview + deterministic release QA'
          ti['trackedSequenceRange'] = '1-91 completed'
          ti['nextSequence'] = 92
          ti['guard'] = 'python rv-vnext-progress-audit.py --root .'
          pp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          rp = root / 'calculators-registry.json'
          reg = json.loads(rp.read_text(encoding='utf-8'))
          reg['source'] = 'RychléVýpočty.cz V7 registry – reconciled V-next state through sequence 91'
          found = False
          for item in reg.get('items', []):
            if item.get('id') == 'kolik-stoji-umele-mleko-kalkulacka' or item.get('file') == target:
              item['name'] = 'Kolik stojí umělé mléko?'
              item['shortDescription'] = 'Spočítejte skutečný nákup kojenecké výživy z vlastní spotřeby: celé balení, výdaj, cenu za 100 g a zbylou zásobu. Bez doporučení dávkování.'
              item['methodologyCheckedAt'] = '2026-08-29'
              item['referenceYear'] = 2026
              item['status'] = 'published'
              item['indexable'] = True
              item['inSitemap'] = True
              found = True
              break
          assert found, 'Registry item not found'
          rp.write_text(json.dumps(reg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sp = root / 'sitemap.xml'
          sm = sp.read_text(encoding='utf-8')
          loc = 'https://rychlevypocty.cz/kolik-stoji-umele-mleko-kalkulacka.html'
          pat = re.compile(r'(<url>\s*<loc>' + re.escape(loc) + r'</loc>)(.*?)(</url>)', re.S)
          def repl(m):
              mid = re.sub(r'<lastmod>[^<]+</lastmod>', '<lastmod>2026-08-29</lastmod>', m.group(2))
              if '<lastmod>' not in mid:
                  mid = '\n<lastmod>2026-08-29</lastmod>' + mid
              return m.group(1) + mid + m.group(3)
          sm2, count = pat.subn(repl, sm, count=1)
          assert count == 1, 'Sitemap URL not found'
          sp.write_text(sm2, encoding='utf-8')

          h = (root / target).read_text(encoding='utf-8')
          assert '<!-- RV-VNEXT: status=DONE | major=2026-08-29 | qa=PASS | seq=91 -->' in h
          assert 'noindex' not in h.lower()
          assert 'logo-rv-v32.svg' in h and 'logo-rv-v32-inverse.svg' in h
          assert 'facebook.com/rychlevypocty' in h and 'instagram.com/rychlevypocty' in h
          assert h.count('id="') > 20
          assert len(bundle['csv'].splitlines()) == 26
          PY
          python rv-vnext-progress-audit.py --root .
      - name: Commit release and clean staging
        shell: bash
        run: |
          git config user.name 'rv-github-native-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/rv_payload_91.txt .github/workflows/rv-promote-91.yml
          git add kolik-stoji-umele-mleko-kalkulacka.html umele-mleko-tin-runway-2026-regression.csv RV_VNEXT_PROGRESS.json calculators-registry.json sitemap.xml
          git commit -m 'Release V-next #91 Tin Runway calculator'
          git push origin HEAD:main
