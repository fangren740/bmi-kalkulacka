name: Sklon a spad release integration

on:
  push:
    branches:
      - release/sklon-spad-20260910

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate approved release candidate
        run: python .tmp-sklon/integrate.py

      - name: Candidate syntax and registry JSON
        run: |
          node --check sklon-spad-core.js
          node --check sklon-spad-page.js
          python -m json.tool calculators-registry.json >/dev/null

      - name: Static site audit
        run: python .github/scripts/audit_static_site.py --root . --config audits/audit-config.json --check-js --json-out /tmp/rv-static.json

      - name: V-next tracking audit
        run: python rv-vnext-progress-audit.py --root . --json-out /tmp/rv-tracking.json

      - name: V-next accessibility lint
        run: python rv-vnext-a11y-lint.py --all-vnext

      - name: Regenerate and verify inventory
        run: |
          python .github/scripts/vnext_inventory.py
          python .github/scripts/vnext_inventory.py --check

      - name: Commit integrated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Release calculator: slope, grade and elevation"
          git push origin HEAD:${GITHUB_REF_NAME}
