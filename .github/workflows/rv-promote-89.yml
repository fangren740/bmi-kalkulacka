name: RV Promote 89

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rv-promote-89.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install approved #89 and reconcile tracking
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path

          root = Path('.')
          parts = []
          for i in range(1, 6):
              parts.append((root / f'.github/rv_payload_89_{i}.txt').read_text(encoding='utf-8').strip())
          html = gzip.decompress(base64.b64decode(''.join(parts))).decode('utf-8')
          csv_text = gzip.decompress(base64.b64decode((root / '.github/rv_payload_89_csv.txt').read_text(encoding='utf-8').strip())).decode('utf-8')
          target = 'kolik-stoji-prvni-rok-ditete-kalkulacka.html'
          (root / target).write_text(html, encoding='utf-8')
          (root / 'prvni-rok-ditete-2026-benchmark.csv').write_text(csv_text, encoding='utf-8')

          progress_path = root / 'RV_VNEXT_PROGRESS.json'
          data = json.loads(progress_path.read_text(encoding='utf-8'))
          completed = [x for x in data.get('completedPages', []) if x.get('file') != target]
          inprog = [x for x in data.get('inProgressPages', []) if x.get('file') != target]
          item = {
            'file': target,
            'url': 'https://rychlevypocty.cz/kolik-stoji-prvni-rok-ditete-kalkulacka.html',
            'status': 'DONE',
            'decision': 'KEEP + FULL CLEAN REBUILD',
            'majorChangeDate': '2026-08-29',
            'archetype': '12-Month Baby Cash-Flow Planner / start → run → later',
            'researchVerifiedAt': '2026-08-29',
            'qaStatus': 'PASS',
            'benchmarkDataset': {
              'enabled': True,
              'file': 'prvni-rok-ditete-2026-benchmark.csv',
              'rows': 25,
              'verifiedAt': '2026-08-29',
              'mode': 'REGRESSION_SCENARIOS_NOT_PRICE_BENCHMARK'
            },
            'structuredData': ['BreadcrumbList', 'WebApplication', 'Dataset'],
            'minimumHoldUntil': '2026-09-12',
            'holdUntil': '2026-09-26',
            'manualProductionVisualGate': 'PASS',
            'manualProductionVisualGateAt': '2026-08-29',
            'notes': 'Full V-next rebuild approved by user on 2026-08-29. Replaced unsupported 90–115% working interval and 78%/128% pseudo-scenarios with a deterministic 12-month cash-flow planner based only on user-entered amounts. Product separates start equipment, recurring run cost and later purchases; detailed mode uses 0–3 / 4–6 / 7–12 month planning windows. Income benefits remain outside the expense model. 25-row regression dataset verifies arithmetic and is explicitly not a market price benchmark.',
            'sequence': 89
          }
          completed.append(item)
          completed.sort(key=lambda x: int(x.get('sequence', 10**9)))
          data['completedPages'] = completed
          data['inProgressPages'] = inprog
          data['currentCandidate'] = None
          data['nextCandidate'] = None
          data['updatedAt'] = '2026-08-29'
          data['lastUpdated'] = '2026-08-29'
          ti = data.setdefault('trackingIntegrity', {})
          ti['lastReconciledAt'] = '2026-08-29'
          ti['reconciledAgainst'] = 'GitHub main + user-approved #89 preview + deterministic release QA'
          ti['trackedSequenceRange'] = '1-89 completed'
          ti['nextSequence'] = 90
          ti['guard'] = 'python rv-vnext-progress-audit.py --root .'
          progress_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          registry_path = root / 'calculators-registry.json'
          reg = json.loads(registry_path.read_text(encoding='utf-8'))
          reg['source'] = 'RychléVýpočty.cz V7 registry – reconciled V-next state through sequence 89'
          found = False
          for x in reg.get('items', []):
              if x.get('file') == target:
                  found = True
                  x['name'] = 'Kolik stojí první rok dítěte?'
                  x['shortDescription'] = 'Naplánujte první rok dítěte jako cash-flow: startovní výbava, běžný měsíční provoz a větší nákupy později. Výpočet používá pouze vaše částky.'
                  x['methodologyCheckedAt'] = '2026-08-29'
                  x['referenceYear'] = 2026
                  x['status'] = 'published'
                  x['indexable'] = True
                  x['inSitemap'] = True
                  terms = x.setdefault('searchTerms', [])
                  for t in ['kolik stojí první rok dítěte','náklady první rok dítěte','výbava pro miminko rozpočet','první rok dítěte cash flow']:
                      if t not in terms:
                          terms.append(t)
                  break
          if not found:
              raise SystemExit('target missing from calculators-registry.json')
          registry_path.write_text(json.dumps(reg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sitemap_path = root / 'sitemap.xml'
          sm = sitemap_path.read_text(encoding='utf-8')
          loc = 'https://rychlevypocty.cz/kolik-stoji-prvni-rok-ditete-kalkulacka.html'
          pattern = re.compile(r'(<url>\s*<loc>' + re.escape(loc) + r'</loc>)(.*?)(</url>)', re.S)
          def repl(m):
              mid = re.sub(r'<lastmod>[^<]+</lastmod>', '<lastmod>2026-08-29</lastmod>', m.group(2))
              if '<lastmod>' not in mid:
                  mid = '\n    <lastmod>2026-08-29</lastmod>' + mid
              return m.group(1) + mid + m.group(3)
          sm, n = pattern.subn(repl, sm, count=1)
          if not n:
              raise SystemExit('target URL missing from sitemap.xml')
          sitemap_path.write_text(sm, encoding='utf-8')

          for i in range(1, 6):
              (root / f'.github/rv_payload_89_{i}.txt').unlink(missing_ok=True)
          (root / '.github/rv_payload_89_csv.txt').unlink(missing_ok=True)
          (root / '.github/workflows/rv-promote-89.yml').unlink(missing_ok=True)
          PY

      - name: Run release gates
        shell: bash
        run: |
          python rv-vnext-progress-audit.py --root .
          python .github/scripts/audit_static_site.py --root . --config audits/audit-config.json --check-js

      - name: Commit release
        shell: bash
        run: |
          git config user.name 'rv-github-native-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'Release V-next #89 first-year baby cash-flow planner'
          git push origin HEAD:main
