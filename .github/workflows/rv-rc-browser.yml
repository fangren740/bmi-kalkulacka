name: RV RC live browser evidence
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/scripts/rc-browser-qa.cjs'
      - '.github/workflows/rv-rc-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated QA dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/rv-browser" playwright@1.62.1
          "$RUNNER_TEMP/rv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Inspect live calculator pages
        env:
          NODE_PATH: ${{ runner.temp }}/rv-browser/node_modules
          RV_QA_OUTPUT: ${{ runner.temp }}/rv-rc-browser
        run: node .github/scripts/rc-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv-rc-live-browser
          path: ${{ runner.temp }}/rv-rc-browser
          retention-days: 30
