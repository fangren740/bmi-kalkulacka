name: Recovery approved integration

on:
  push:
    branches:
      - recovery-approved-75-93-2026-09-06

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: recovery-approved-75-93-2026-09-06
          fetch-depth: 0

      - name: Verify and unpack approved recovery archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .recovery-payloads -maxdepth 1 -type f -name 'part-*.b64' | wc -l | tr -d ' ')" = "13"
          cat .recovery-payloads/part-*.b64 > /tmp/recovery.b64
          test "$(wc -c < /tmp/recovery.b64 | tr -d ' ')" = "169488"
          base64 -d /tmp/recovery.b64 > /tmp/recovery_prod_15.tar.xz
          echo "ef2a2a60b1b7486dffe1feeaa061a6b30e9a824db43fb9c085a350b33cf58d83  /tmp/recovery_prod_15.tar.xz" | sha256sum -c -
          test "$(tar -tJf /tmp/recovery_prod_15.tar.xz | wc -l | tr -d ' ')" = "15"
          tar -xJf /tmp/recovery_prod_15.tar.xz -C .

          targets=(
            cena-za-km-kalkulacka.html
            dpp-dpc-kalkulacka.html
            duchodovy-vek-kalkulacka.html
            kalkulacka-hrube-mzdy-z-ciste.html
            kolik-me-stoji-pleny-kalkulacka.html
            kolik-stoji-prvni-rok-ditete-kalkulacka.html
            kolik-stoji-umele-mleko-kalkulacka.html
            materska-kalkulacka.html
            naklady-zamestnavatele-kalkulacka.html
            nemocenska-kalkulacka.html
            ocr-kalkulacka.html
            podpora-v-nezamestnanosti-kalkulacka.html
            pribirani-v-tehotenstvi-kalkulacka.html
            rodicovsky-prispevek-kalkulacka.html
            vyzivne-kalkulacka.html
          )
          for f in "${targets[@]}"; do
            test -s "$f"
            grep -q 'status=RECOVERY_APPROVED' "$f"
            grep -q '<link rel="canonical"' "$f"
            grep -q 'application/ld+json' "$f"
          done

      - name: Commit unpacked production candidates and remove staging payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery-payloads
          rm -f .github/workflows/recovery-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: integrate approved recovery pages 75-93"
          git push origin HEAD:recovery-approved-75-93-2026-09-06
