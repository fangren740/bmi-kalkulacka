name: Close V-next recovery wave 2026-09-06

on:
  push:
    branches:
      - recovery-closeout-2026-09-06

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-closeout-2026-09-06
      - name: Update tracker and recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          target_sequences = set(list(range(75, 85)) + list(range(89, 94)))
          progress_path = Path('RV_VNEXT_PROGRESS.json')
          data = json.loads(progress_path.read_text(encoding='utf-8'))

          primary = {
              'runId': 34056090232,
              'matrixRows': 30,
              'mobilePerformanceAverage': 95.3,
              'desktopPerformanceAverage': 99.9,
              'accessibilityMin': 100,
              'bestPracticesMin': 100,
              'seoMin': 100,
              'mobileLcpAverageMs': 2133,
              'mobileTbtAverageMs': 93
          }
          repeat = {
              'runId': 34056090152,
              'matrixRows': 30,
              'accessibilityMin': 100,
              'bestPracticesMin': 100,
              'seoMin': 100,
              'note': 'Independent same-production repeat. Performance showed substantial lab/runner variance; category correctness remained 100/100/100 for Accessibility/Best Practices/SEO.'
          }
          baseline = {
              'matrixRows': 30,
              'mobilePerformanceAverage': 93.9,
              'desktopPerformanceAverage': 99.3,
              'accessibilityMin': 96,
              'bestPracticesMin': 96,
              'seoMin': 100,
              'mobileLcpAverageMs': 2180,
              'mobileTbtAverageMs': 141
          }

          pages = data.get('completedPages', [])
          touched = []
          for page in pages:
              seq = page.get('sequence')
              if seq not in target_sequences:
                  continue
              touched.append(seq)
              page['status'] = 'DONE'
              page['qaStatus'] = 'PASS_PRODUCTION_RECOVERY_CLOSED'
              page['recoveryClosedAt'] = '2026-09-06'
              page['productionLighthouse20260906'] = {
                  'classification': 'PRODUCTION_QA',
                  'productionCommit': 'a0f67159c8ba624cc3a577b1dbce03d349cecff1',
                  'evidenceFile': 'RV-VNEXT-RECOVERY-CLOSURE-2026-09-06.md',
                  'baseline': baseline,
                  'postFixPrimary': primary,
                  'postFixRepeat': repeat,
                  'result': 'PASS_WITH_LAB_VARIANCE_NOTED',
                  'majorHoldReset': False,
                  'performancePolicy': 'Performance target remains 100, but one-shot lab scores are not treated as deterministic defects when repeat runs and audit attribution show runner/third-party variance. No known actionable recovery regression remains.'
              }
              if seq == 83:
                  page['productionLighthouse20260906']['performanceRecovery'] = {
                      'metric': 'mobile Lighthouse Performance',
                      'baselineScore': 82,
                      'postFixPrimaryScore': 96,
                      'postFixRepeatScore': 97,
                      'baselineTbtMs': 643,
                      'postFixPrimaryTbtMs': 120,
                      'postFixRepeatTbtMs': 0,
                      'result': 'MATERIAL_IMPROVEMENT_CONFIRMED'
                  }
              if seq == 84:
                  page['productionLighthouse20260906']['performanceException'] = {
                      'classification': 'EDGE_THIRD_PARTY_AND_RUNNER_VARIANCE',
                      'mobileScores': [86, 85],
                      'primaryTbtMs': 437,
                      'repeatTbtMs': 477,
                      'primaryAttribution': 'Cloudflare Web Analytics beacon contributed about 437 ms blocking time in the primary audit.',
                      'repeatAttribution': 'Repeat audit showed mixed page/runner and Cloudflare long-task variance. The calculator calculation/UX path has no known functional defect.',
                      'action': 'Do not churn the product solely to chase a noisy lab score. Revisit if production field CWV or repeated controlled tests show a persistent actionable regression.'
                  }
              if seq == 92:
                  page['productionLighthouse20260906']['performanceRecovery'] = {
                      'metric': 'mobile Lighthouse Performance',
                      'baselineScore': 75,
                      'postFixPrimaryScore': 95,
                      'postFixRepeatScore': 89,
                      'baselineTbtMs': 813,
                      'postFixPrimaryTbtMs': 96,
                      'postFixRepeatTbtMs': 339,
                      'result': 'MATERIAL_IMPROVEMENT_CONFIRMED_WITH_LAB_VARIANCE'
                  }
              if seq == 93:
                  page['productionLighthouse20260906']['performanceVariance'] = {
                      'mobileScores': [88, 98],
                      'tbtMs': [368, 152],
                      'note': 'Large same-production run-to-run variance; Cloudflare blocking was about 234 ms in one run and 0 ms in the repeat. No deterministic regression confirmed.'
                  }
              note = page.get('notes', '')
              closure_sentence = ' Recovery wave closed 2026-09-06 after live production smoke plus two 30-row Lighthouse matrices; Accessibility, Best Practices and SEO reached 100 across all tested mobile/desktop runs. Performance variance is documented separately and no known actionable recovery regression remains.'
              if 'Recovery wave closed 2026-09-06' not in note:
                  page['notes'] = note + closure_sentence

          missing = sorted(target_sequences - set(touched))
          if missing:
              raise SystemExit(f'Missing target sequences in tracker: {missing}')

          data['updatedAt'] = '2026-09-06'
          data['recoveryClosure20260906'] = {
              'status': 'CLOSED',
              'closedAt': '2026-09-06',
              'scopeSequences': sorted(target_sequences),
              'scopePages': len(target_sequences),
              'productionCommit': 'a0f67159c8ba624cc3a577b1dbce03d349cecff1',
              'productionSmoke': '15/15 live URLs confirmed after deploy',
              'lighthouseRuns': [34056090232, 34056090152],
              'lighthouseRowsPerRun': 30,
              'baselineAggregate': baseline,
              'postFixPrimaryAggregate': primary,
              'qualityCategories': {
                  'accessibility': '100 across all 30 rows in both post-fix production matrices',
                  'bestPractices': '100 across all 30 rows in both post-fix production matrices',
                  'seo': '100 across all 30 rows in both post-fix production matrices'
              },
              'performanceConclusion': 'Primary post-fix mobile average improved from 93.9 to 95.3 and desktop from 99.3 to 99.9. #83 improved 82→96/97 and #92 75→95/89. Repeats also exposed large runner/Cloudflare variance, so isolated lab scores are not used as a reason for further product churn without repeatable actionable evidence.',
              'evidenceFile': 'RV-VNEXT-RECOVERY-CLOSURE-2026-09-06.md',
              'nextState': 'Return portfolio to HOLD/measurement and growth prioritization. No further recovery redesign wave is open.'
          }
          progress_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          report = '''# RychléVýpočty.cz V7 — V-next Recovery Closure — 2026-09-06

## Decision

**RECOVERY WAVE CLOSED.** The 15-page recovery scope (#75–#84 and #89–#93) is accepted on live production. This closure is a QA/status decision; it does not reset MAJOR HOLD dates.

Production fix commit: `a0f67159c8ba624cc3a577b1dbce03d349cecff1`.

## Production evidence

Two independent live Lighthouse matrices were run after deployment, each covering **15 URLs × mobile/desktop = 30 rows**:

- primary post-fix run: `34056090232`
- independent repeat: `34056090152`

Both post-fix matrices returned **Accessibility 100, Best Practices 100 and SEO 100 on every tested row**.

### Aggregate before → post-fix primary

| Metric | Before | Post-fix primary |
|---|---:|---:|
| Mobile Performance avg | 93.9 | 95.3 |
| Desktop Performance avg | 99.3 | 99.9 |
| Accessibility floor | 96 | 100 |
| Best Practices floor | 96 | 100 |
| SEO floor | 100 | 100 |
| Mobile LCP avg | 2180 ms | 2133 ms |
| Mobile TBT avg | 141 ms | 93 ms |

## Confirmed recovery wins

- **#83 Podpora v nezaměstnanosti:** mobile Performance **82 → 96** in the primary post-fix run and **97** in the repeat; TBT **643 → 120 → 0 ms**.
- **#92 Přibírání v těhotenství:** mobile Performance **75 → 95** in the primary post-fix run and **89** in the repeat; TBT **813 → 96 / 339 ms**. The repeat confirms meaningful improvement but also material lab variance.
- Common contrast defects were removed across the recovery set: Accessibility moved from a uniform 96 baseline to 100 everywhere.
- #75 mobile Best Practices defect was removed; Best Practices is now 100 across both post-fix matrices.

## Performance variance / #84 exception

#84 `duchodovy-vek-kalkulacka.html` produced mobile scores **86 and 85** in the two production runs. The primary audit attributed roughly **437 ms of 440 ms TBT** to the Cloudflare Web Analytics beacon. The repeat showed mixed page/runner and Cloudflare long-task variance.

This is recorded as an **edge / third-party / runner variance exception**, not as a reason for another visual or product rebuild. The page remains DONE because there is no known calculation, interaction, responsive or accessibility defect. Re-open performance work only if repeated controlled tests or production field CWV reveal a persistent actionable regression.

#93 also demonstrated the same lab-noise class: mobile **88 vs 98** on the same deployed production, with Cloudflare blocking around **234 ms vs 0 ms**.

## Closure rule

`PREVIEW PASS` was not treated as DONE. Closure happened only after production deployment, live smoke verification and production Lighthouse evidence.

No further recovery redesign wave is open. Next work returns to **HOLD / measurement / growth prioritization** under the existing 14/28-day major-change protection rules.
'''
          Path('RV-VNEXT-RECOVERY-CLOSURE-2026-09-06.md').write_text(report, encoding='utf-8')

          audit_path = Path('RV-VNEXT-QUALITY-RECOVERY-AUDIT-2026-08-30.md')
          if audit_path.exists():
              audit = audit_path.read_text(encoding='utf-8')
              marker = '## Recovery closure — 2026-09-06'
              if marker not in audit:
                  audit += '''\n\n## Recovery closure — 2026-09-06\n\n**Status: CLOSED.** All 15 recovery-scope pages (#75–#84 and #89–#93) are accepted on live production. Two post-deploy Lighthouse matrices (30 rows each) verified Accessibility 100, Best Practices 100 and SEO 100 throughout. The primary post-fix matrix improved mobile Performance average from 93.9 to 95.3 and desktop from 99.3 to 99.9; #83 improved 82→96/97 and #92 75→95/89. #84 is documented as an edge/third-party/runner performance-variance exception, not an open redesign defect. Canonical evidence: `RV-VNEXT-RECOVERY-CLOSURE-2026-09-06.md`.\n\nNo further quality-recovery redesign wave is open. Resume HOLD/measurement and growth prioritization; do not reset MAJOR HOLD for these technical QA fixes.\n'''
                  audit_path.write_text(audit, encoding='utf-8')
          PY
      - name: Validate closeout
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool RV_VNEXT_PROGRESS.json >/dev/null
          grep -q '"status": "CLOSED"' RV_VNEXT_PROGRESS.json
          grep -q 'RECOVERY WAVE CLOSED' RV-VNEXT-RECOVERY-CLOSURE-2026-09-06.md
          grep -q 'Recovery closure — 2026-09-06' RV-VNEXT-QUALITY-RECOVERY-AUDIT-2026-08-30.md
      - name: Commit closeout evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RV_VNEXT_PROGRESS.json RV-VNEXT-QUALITY-RECOVERY-AUDIT-2026-08-30.md RV-VNEXT-RECOVERY-CLOSURE-2026-09-06.md
          git commit -m 'docs: close V-next recovery wave with production Lighthouse evidence'
          git push origin HEAD:recovery-closeout-2026-09-06
