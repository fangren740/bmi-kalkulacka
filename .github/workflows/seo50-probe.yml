name: SEO50 evidence probe
on:
  push:
    branches: ['codex/seo50-evidence']
  pull_request:
    paths:
      - '.github/scripts/seo50-probe.py'
      - '.github/workflows/seo50-probe.yml'
      - 'CNAME'
      - 'robots.txt'
      - 'sitemap.xml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/seo50-probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: seo50-evidence
          path: seo50-output
