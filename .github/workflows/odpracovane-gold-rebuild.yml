name: RV worked-hours Gold rebuild gate

on:
  push:
    branches:
      - upgrade/odpracovane-hodiny-v7
    paths:
      - .github/workflows/odpracovane-gold-rebuild.yml

permissions:
  contents: write

jobs:
  gold-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odpracovane-hodiny-v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize exact Gold candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          mapping={
            '.rv_tmp/wh_html.gz.b64':'kalkulacka-odpracovanych-hodin.html',
            '.rv_tmp/wh_css.gz.b64':'odpracovane-hodiny.css',
            '.rv_tmp/wh_js.gz.b64':'odpracovane-hodiny.js',
          }
          for src,dst in mapping.items():
              s=''.join(Path(src).read_text(encoding='utf-8').split())
              s += '=' * ((4-len(s)%4)%4)
              raw=base64.b64decode(s,validate=False)
              Path(dst).write_bytes(gzip.decompress(raw))
          PY
          node --check odpracovane-hodiny.js
          grep -q 'MPSV ověřeno 15. 9. 2026' kalkulacka-odpracovanych-hodin.html
          grep -q 'logo-rv-v32.svg' kalkulacka-odpracovanych-hodin.html
          grep -q 'logo-rv-v32-inverse.svg' kalkulacka-odpracovanych-hodin.html
          grep -q 'DOCHÁZKOVÁ KARTA' kalkulacka-odpracovanych-hodin.html

      - name: Install browser QA
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/rvqa" puppeteer-core@24.16.0 lighthouse@13.4.1

      - name: Functional browser regression QA
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 1
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const errors=[];
            for(const width of [1440,1280,1024,768,390,320]){
              const page=await browser.newPage();
              page.on('pageerror',e=>errors.push(width+': '+String(e)));
              page.on('console',m=>{if(m.type()==='error') errors.push(width+': '+m.text())});
              await page.setViewport({width,height:1000});
              await page.goto('http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html',{waitUntil:'networkidle0'});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
              if(overflow) throw new Error('Horizontal overflow '+width);
              const initial=await page.$eval('#resultTotal',e=>e.textContent.trim());
              if(initial!=='160 h') throw new Error('Default total '+width+' '+initial);
              const shift=await page.$eval('#heroShift',e=>e.textContent.trim());
              if(shift!=='8 h') throw new Error('Default shift '+width+' '+shift);
              if(width===390){
                await page.click('[data-preset="22:00|06:30|30"]');
                await page.$eval('#shiftCount',e=>{e.value='1';e.dispatchEvent(new Event('input',{bubbles:true}))});
                await page.$eval('#targetFund',e=>{e.value='';e.dispatchEvent(new Event('input',{bubbles:true}))});
                await page.waitForFunction(()=>document.querySelector('#resultTotal').textContent.trim()==='8 h');
                const night=await page.$eval('#resultNight',e=>e.textContent.trim());
                if(!night.includes('7 h 30 min') || !night.includes('8 h')) throw new Error('Night range '+night);
                await page.$eval('#endTime',e=>{e.value='22:00';e.dispatchEvent(new Event('input',{bubbles:true}))});
                await page.waitForFunction(()=>document.querySelector('#resultTotal').textContent.trim()==='—');
                await page.$eval('#endTime',e=>{e.value='11:00';e.dispatchEvent(new Event('input',{bubbles:true}))});
                await page.$eval('#startTime',e=>{e.value='22:00';e.dispatchEvent(new Event('input',{bubbles:true}))});
                await page.waitForFunction(()=>document.querySelector('#resultTotal').textContent.trim()!=='—');
                const status=await page.$eval('#statusBadge',e=>e.textContent.trim());
                if(!status.includes('délku směny')) throw new Error('Long shift guard '+status);
                await page.click('.wh-mode [data-mode="advanced"]');
                await page.waitForFunction(()=>document.body.dataset.mode==='advanced');
                await page.click('#loadShiftExample');
                const advanced=await page.$eval('#resultTotal',e=>e.textContent.trim());
                if(advanced==='—') throw new Error('Advanced result invalid');
                await page.click('#addShiftBlock');
                const blocks=await page.$$eval('.shift-block',els=>els.length);
                if(blocks<4) throw new Error('Add block failed '+blocks);
                await page.click('.shift-block:last-child .remove-block');
              }
              await page.close();
            }
            await browser.close();
            if(errors.length) throw new Error(errors.join('\n'));
            console.log('WORKED_HOURS_GOLD_BROWSER_QA_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Lighthouse quality gate
        shell: bash
        run: |
          set -euo pipefail
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$LH" 'http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');
          for(const name of ['mobile','desktop']){
            const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+name+'.json','utf8'));
            const scores=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));
            console.log(name.toUpperCase(),scores);
            if(scores.performance<98 || scores.accessibility<100 || scores['best-practices']<100 || scores.seo<100) process.exit(1);
          }
          NODE

      - name: Build exact self-contained live preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re
          h=Path('kalkulacka-odpracovanych-hodin.html').read_text(encoding='utf-8')
          css='\n'.join(Path(p).read_text(encoding='utf-8') for p in ['rv-brand-v32.css','rv-social-links.css','odpracovane-hodiny.css'])
          js=Path('odpracovane-hodiny.js').read_text(encoding='utf-8')
          h=re.sub(r'<link rel="stylesheet" href="/rv-brand-v32.css[^>]*>\s*','',h)
          h=re.sub(r'<link rel="stylesheet" href="/rv-social-links.css[^>]*>\s*','',h)
          h=re.sub(r'<link rel="stylesheet" href="/odpracovane-hodiny.css[^>]*>',lambda m:'<style>'+css+'</style>',h)
          h=re.sub(r'<script src="/odpracovane-hodiny.js[^>]*></script>',lambda m:'<script>'+js+'</script>',h)
          for name in ['logo-rv-v32.svg','logo-rv-v32-inverse.svg','favicon-rv-v32.svg']:
              data=base64.b64encode(Path(name).read_bytes()).decode('ascii')
              h=re.sub(r'/'+re.escape(name)+r'(?:\?v=1)?',lambda m:'data:image/svg+xml;base64,'+data,h)
          Path('RV_ODPRACOVANE_HODINY_GOLD_LIVE_PREVIEW.html').write_text(h,encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: worked-hours-gold-rebuild-preview
          path: RV_ODPRACOVANE_HODINY_GOLD_LIVE_PREVIEW.html
          retention-days: 30

      - name: Commit verified candidate and clean staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/odpracovane-gold-rebuild.yml .rv_tmp/wh_html.gz.b64 .rv_tmp/wh_css.gz.b64 .rv_tmp/wh_js.gz.b64
          git add kalkulacka-odpracovanych-hodin.html odpracovane-hodiny.css odpracovane-hodiny.js
          git commit -m 'Rebuild worked-hours calculator as Gold V7 product'
          git push origin HEAD:upgrade/odpracovane-hodiny-v7
