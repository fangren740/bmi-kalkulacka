name: RV monthly Gold production Lighthouse
on:
  push:
    branches: [upgrade/mesicni-mzda-gold-v4]
    paths: ['.github/workflows/rv-monthly-gold-production-check.yml']
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Lighthouse
        run: npm install --prefix "$RUNNER_TEMP/rv-lh" lighthouse@13.4.1
      - name: Lighthouse mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/rv-lh/node_modules/lighthouse/cli/index.js" 'https://rychlevypocty.cz/mesicni-mzda-z-hodinove-sazby-kalkulacka.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$RUNNER_TEMP/rv-lh/node_modules/lighthouse/cli/index.js" 'https://rychlevypocty.cz/mesicni-mzda-z-hodinove-sazby-kalkulacka.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
      - name: Diagnose failed audits
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const device of ['mobile','desktop']){
            const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+device+'.json'));
            const scores=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));
            const cats=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,new Set(v.auditRefs.map(a=>a.id))]));
            console.log('\n### '+device.toUpperCase(),scores);
            const failed=Object.values(x.audits).filter(a=>a.score!==null&&a.score<1).map(a=>({
              id:a.id,title:a.title,score:a.score,displayValue:a.displayValue,
              categories:Object.entries(cats).filter(([,s])=>s.has(a.id)).map(([k])=>k),
              items:(a.details?.items||[]).slice(0,8).map(i=>({node:i.node?.snippet||i.node?.selector,url:i.url,duration:i.duration,totalBlockingTime:i.totalBlockingTime,wastedMs:i.wastedMs,wastedBytes:i.wastedBytes}))
            }));
            console.log(JSON.stringify(failed,null,2));
            for(const id of ['total-blocking-time','mainthread-work-breakdown','bootup-time','long-tasks','unused-javascript','render-blocking-insight','third-parties-insight','largest-contentful-paint-element','color-contrast','label','aria-allowed-attr','aria-valid-attr-value','link-name','button-name','heading-order']){
              const a=x.audits[id]; if(a) console.log('AUDIT',id,JSON.stringify({score:a.score,displayValue:a.displayValue,details:(a.details?.items||[]).slice(0,10)},null,2));
            }
          }
          NODE
