name: Clean temporary recovery Lighthouse evidence

on:
  push:
    branches:
      - recovery-performance-a11y-2026-09-06

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery-performance-a11y-2026-09-06
          fetch-depth: 0
      - name: Remove temporary QA files and commit clean branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lh-local
          rm -f .github/workflows/cleanup-recovery-lh-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary Lighthouse evidence"
          git push origin HEAD:recovery-performance-a11y-2026-09-06
