name: RV příplatky za směny
on:
  pull_request:
    paths:
      - 'kalkulacka-priplatku-za-smeny.html'
      - 'priplatky-smeny.js'
      - 'priplatky-smeny.css'
      - '.github/scripts/shift51-browser.py'
      - '.github/workflows/rv-shift51.yml'
permissions:
  contents: read
jobs:
  payroll-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      # Ubuntu runner already provides browser system libraries; avoid slow apt font downloads.
      - run: playwright install --only-shell chromium
      - run: python .github/scripts/shift51-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv-shift51-browser
          path: /tmp/rv-shift51
