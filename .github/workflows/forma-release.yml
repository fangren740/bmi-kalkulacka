name: Form recipe release integration

on:
  push:
    branches:
      - release/prepocet-formy-20260911

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate approved release candidate
        run: python .tmp-forma/integrate.py

      - name: Core correctness tests
        run: |
          node --check prepocet-formy-core.js
          node --check prepocet-formy-page.js
          node - <<'NODE'
          const assert=require('assert');
          const c=require('./prepocet-formy-core.js');
          const close=(a,b,t=1e-9)=>assert.ok(Math.abs(a-b)<=t,`${a} != ${b}`);
          assert.strictEqual(c.parseCz('1,44'),1.44);
          assert.ok(Number.isNaN(c.parseCz('')));
          close(c.area({shape:'circle',diameter:20}),Math.PI*100);
          close(c.area({shape:'square',width:20}),400);
          close(c.area({shape:'rect',width:20,length:30}),600);
          assert.ok(Number.isNaN(c.area({shape:'circle',diameter:0})));
          close(c.factor({shape:'circle',diameter:20},{shape:'circle',diameter:24},false),1.44);
          close(c.factor({shape:'circle',diameter:24},{shape:'circle',diameter:20},false),25/36);
          close(c.factor({shape:'circle',diameter:20},{shape:'rect',width:20,length:30},false),600/(Math.PI*100));
          close(c.factor({shape:'square',width:20,height:5},{shape:'square',width:20,height:7.5},true),1.5);
          close(c.scaleAmount(250,1.44),360);
          close(c.scaleAmount(3,1.44),4.32);
          assert.ok(Number.isNaN(c.scaleAmount(-1,1.44)));
          console.log('13/13 independent release vectors PASS');
          NODE
          python -m json.tool calculators-registry.json >/dev/null

      - name: Static site audit
        run: python .github/scripts/audit_static_site.py --root . --config audits/audit-config.json --check-js --json-out /tmp/rv-static.json

      - name: V-next tracking audit
        run: python rv-vnext-progress-audit.py --root . --json-out /tmp/rv-tracking.json

      - name: V-next accessibility lint
        run: python rv-vnext-a11y-lint.py --all-vnext

      - name: Regenerate and verify inventory
        run: |
          python .github/scripts/vnext_inventory.py
          python .github/scripts/vnext_inventory.py --check

      - name: Commit integrated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Release calculator: recipe pan size converter"
          git push origin HEAD:${GITHUB_REF_NAME}
