name: RV Block 1 RC 68-74 repair QA
on:
  push:
    branches:
      - astra/block-1-rc-repairs-68-74-2026-09-07
    paths:
      - '.github/workflows/rv-block1-rc-68-74-baseline.yml'
      - '.github/scripts/block1-rc-71-74-repairs.py'
permissions:
  contents: write
jobs:
  repair-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RV_SEQUENCES: '68,69,70,71,72,73,74'
      RV_TARGET_BASE: http://127.0.0.1:8765
      RV_QA_DEPS: /tmp/rv-qa
      NODE_PATH: /tmp/rv-qa/node_modules
      RV_QA_OUTPUT: /tmp/rv-block1-68-74
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted RC repairs
        run: python .github/scripts/block1-rc-71-74-repairs.py
      - name: Static diff guard
        run: |
          if git diff --name-only | grep -E '\.js$'; then
            echo 'Unexpected JavaScript change in RC 71-74 repair batch.' >&2
            exit 1
          fi
          git diff --check
      - name: Commit repair candidate
        run: |
          if git diff --quiet; then
            echo 'No product changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add kalkulacka-slozeneho-uroku.html slozeny-urok-vnext.css navratnost-investice-kalkulacka.html navratnost-investice-vnext.css inflace-kalkulacka.html inflace-vnext.css cista-mzda-kalkulacka.html cista-mzda-vnext.css
            git commit -m 'fix: repair RC 71-74 accessibility'
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated audit tools
        run: |
          npm install --prefix "$RV_QA_DEPS" playwright@1.62.1 lighthouse@13.4.1
          "$RV_QA_DEPS/node_modules/.bin/playwright" install --with-deps chromium
      - name: Serve candidate
        run: python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/rv-server.log" 2>&1 &
      - name: Responsive and visual QA for RC 68-74
        run: node .github/scripts/rc-browser-qa.cjs
      - name: Lighthouse accessibility and best-practices retest
        run: |
          node .github/scripts/rc-production-audit.cjs
          node - <<'NODE'
          const fs = require('fs');
          const p = process.env.RV_QA_OUTPUT + '/summary.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (!Array.isArray(data.rows) || data.rows.length !== 14) throw new Error(`Expected 14 rows, got ${data.rows?.length}`);
          const bad = data.rows.filter(r => r.status !== 'AUTOMATED_PASS_REQUIRES_REVIEW' || r.scores?.accessibility !== 100 || r.scores?.['best-practices'] !== 100 || (r.findings||[]).length);
          if (bad.length) {
            console.error(JSON.stringify(bad, null, 2));
            process.exit(1);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv-block1-rc-68-74-repair-qa
          path: /tmp/rv-block1-68-74
          retention-days: 30
