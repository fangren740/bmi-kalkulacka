name: Recovery production Lighthouse gate

on:
  push:
    branches:
      - recovery-psi-2026-09-06

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify recovery pages are live
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            kalkulacka-hrube-mzdy-z-ciste.html
            naklady-zamestnavatele-kalkulacka.html
            dpp-dpc-kalkulacka.html
            nemocenska-kalkulacka.html
            ocr-kalkulacka.html
            materska-kalkulacka.html
            rodicovsky-prispevek-kalkulacka.html
            vyzivne-kalkulacka.html
            podpora-v-nezamestnanosti-kalkulacka.html
            duchodovy-vek-kalkulacka.html
            kolik-stoji-prvni-rok-ditete-kalkulacka.html
            kolik-me-stoji-pleny-kalkulacka.html
            kolik-stoji-umele-mleko-kalkulacka.html
            pribirani-v-tehotenstvi-kalkulacka.html
            cena-za-km-kalkulacka.html
          )
          mkdir -p live-html
          failures=0
          for path in "${urls[@]}"; do
            target="https://rychlevypocty.cz/${path}"
            echo "Smoke: ${target}"
            code=$(curl -L -sS --retry 4 --retry-delay 3 -w '%{http_code}' -o "live-html/${path}" "$target")
            if [ "$code" != "200" ]; then
              echo "HTTP ${code}: ${target}"
              failures=$((failures+1))
              continue
            fi
            if ! grep -q 'status=RECOVERY_APPROVED' "live-html/${path}"; then
              echo "Recovery marker missing: ${target}"
              failures=$((failures+1))
            fi
          done
          test "$failures" -eq 0

      - name: Install Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          npm install --global lighthouse@12.8.2
          lighthouse --version
          google-chrome --version

      - name: Run Lighthouse against production
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            kalkulacka-hrube-mzdy-z-ciste.html
            naklady-zamestnavatele-kalkulacka.html
            dpp-dpc-kalkulacka.html
            nemocenska-kalkulacka.html
            ocr-kalkulacka.html
            materska-kalkulacka.html
            rodicovsky-prispevek-kalkulacka.html
            vyzivne-kalkulacka.html
            podpora-v-nezamestnanosti-kalkulacka.html
            duchodovy-vek-kalkulacka.html
            kolik-stoji-prvni-rok-ditete-kalkulacka.html
            kolik-me-stoji-pleny-kalkulacka.html
            kolik-stoji-umele-mleko-kalkulacka.html
            pribirani-v-tehotenstvi-kalkulacka.html
            cena-za-km-kalkulacka.html
          )
          mkdir -p lighthouse-json
          printf 'url,strategy,performance,accessibility,best_practices,seo,lcp_ms,cls,tbt_ms\n' > lighthouse-results.csv
          for path in "${urls[@]}"; do
            for strategy in mobile desktop; do
              target="https://rychlevypocty.cz/${path}"
              out="lighthouse-json/${path%.html}-${strategy}.json"
              args=(
                "$target"
                --quiet
                --output=json
                --output-path="$out"
                --only-categories=performance,accessibility,best-practices,seo
                --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
                --max-wait-for-load=45000
              )
              if [ "$strategy" = "desktop" ]; then
                args+=(--preset=desktop)
              fi
              echo "Lighthouse ${strategy}: ${target}"
              lighthouse "${args[@]}"
              perf=$(jq -r '(.categories.performance.score * 100) | round' "$out")
              acc=$(jq -r '(.categories.accessibility.score * 100) | round' "$out")
              bp=$(jq -r '(.categories["best-practices"].score * 100) | round' "$out")
              seo=$(jq -r '(.categories.seo.score * 100) | round' "$out")
              lcp=$(jq -r '.audits["largest-contentful-paint"].numericValue | round' "$out")
              cls=$(jq -r '.audits["cumulative-layout-shift"].numericValue' "$out")
              tbt=$(jq -r '.audits["total-blocking-time"].numericValue | round' "$out")
              printf '%s,%s,%s,%s,%s,%s,%s,%s,%s\n' "$path" "$strategy" "$perf" "$acc" "$bp" "$seo" "$lcp" "$cls" "$tbt" >> lighthouse-results.csv
            done
          done
          cat lighthouse-results.csv

      - name: Summarize Lighthouse floor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('lighthouse-results.csv', encoding='utf-8')))
          assert len(rows)==30, f'Expected 30 Lighthouse rows, got {len(rows)}'
          for key in ['performance','accessibility','best_practices','seo']:
              vals=[int(r[key]) for r in rows]
              print(key, 'min=', min(vals), 'avg=', round(sum(vals)/len(vals),1))
          misses=[r for r in rows if any(int(r[k])<100 for k in ['performance','accessibility','best_practices','seo'])]
          print('rows_below_100_any_category', len(misses))
          for r in misses:
              print(r)
          PY

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-lighthouse-evidence
          path: |
            lighthouse-results.csv
            lighthouse-json/
            live-html/
          retention-days: 30
