name: RV monthly Gold desktop diagnosis
on:
  push:
    branches: ['fix/monthly-gold-green']
    paths: ['.github/workflows/rv-monthly-desktop-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/monthly-gold-green'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current hotfix in workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mesicni-mzda-z-hodinove-sazby.js');s=p.read_text();p.write_text(s.replace('document.querySelectorAll("[data-mode]")','document.querySelectorAll(".hm-mode [data-mode]")'))
          p=Path('mesicni-mzda-z-hodinove-sazby.css');s=p.read_text()
          r='''\n.hm-page{--hm-muted:#526a7d}\n.hm-page .header-cta{color:#fff!important}\n.hm-page .hm-mode button:not(.is-active){color:#4b6275}\n.hm-page .hm-basis small{color:#506779}\n.hm-page .hm-private{color:#536a7d}\n.hm-page .hm-min-check p{color:#556b7d}\n.hm-page .hm-disclaimer p{color:#586f82}\n.hm-page .hm-tape-head b,.hm-page .hm-loss span,.hm-page .hm-shift-head b,.hm-page .hm-regime-title small,.hm-page .hm-offer-side>small{color:#566d80}\n.hm-page .hm-tape-legend,.hm-page .hm-shift-math span{color:#526a7d}\n.hm-page .hm-offer-side p{color:#586f82}\n.hm-page .hm-related-line a>span{color:#526a7d}\n.hm-page .hm-fourweeks .hm-kicker,.hm-page .hm-regime .hm-kicker,.hm-page .hm-checklist .hm-kicker,.hm-page .hm-method .hm-kicker,.hm-page .hm-related .hm-kicker{color:#236c2e}\n.hm-page .footer-grid a{min-height:44px;display:flex;align-items:center;margin:0}\n.hm-page .footer-grid .rv-social-links a{display:grid;place-items:center;width:44px;height:44px;min-height:44px}\n@supports (content-visibility:auto){.hm-page .hm-sensitivity,.hm-page .hm-fourweeks,.hm-page .hm-when,.hm-page .hm-paidtime,.hm-page .hm-regime,.hm-page .hm-offer,.hm-page .hm-checklist,.hm-page .hm-method,.hm-page .hm-faq,.hm-page .hm-related,.hm-page .site-footer{content-visibility:auto;contain-intrinsic-size:auto 900px}}\n'''
          p.write_text(s+r)
          PY
          npm install --prefix "$RUNNER_TEMP/rv-lh" lighthouse@13.4.1
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 1
      - name: Desktop accessibility details
        shell: bash
        run: |
          LH="$RUNNER_TEMP/rv-lh/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/mesicni-mzda-z-hodinove-sazby-kalkulacka.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/d.json" --only-categories=accessibility
          node - <<'NODE'
          const x=require(process.env.RUNNER_TEMP+'/d.json');
          console.log('A11Y',Math.round(x.categories.accessibility.score*100));
          for(const a of Object.values(x.audits).filter(a=>a.score!==null&&a.score<1)) console.log('FAIL',a.id,JSON.stringify(a.details?.items||[],null,2));
          NODE
