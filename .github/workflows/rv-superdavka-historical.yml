name: RV Superdavka historical-scope QA
on:
  pull_request:
    paths:
      - 'superdavka-kalkulacka.html'
      - 'superdavka-vnext.js'
      - 'superdavka-vnext.css'
      - '.github/scripts/superdavka-historical-smoke.cjs'
      - '.github/workflows/rv-superdavka-historical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check superdavka-vnext.js
          node --check .github/scripts/superdavka-historical-smoke.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/rv-superdavka" playwright@1.62.1
          "$RUNNER_TEMP/rv-superdavka/node_modules/.bin/playwright" install --with-deps chromium
      - name: Serve branch candidate
        run: python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/rv-superdavka-server.log" 2>&1 &
      - name: Check historical warning, result and responsive interactions
        env:
          NODE_PATH: ${{ runner.temp }}/rv-superdavka/node_modules
          RV_TARGET_BASE: http://127.0.0.1:8765
          RV_QA_OUTPUT: ${{ runner.temp }}/rv-superdavka-results
        run: node .github/scripts/superdavka-historical-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv-superdavka-historical-qa
          path: ${{ runner.temp }}/rv-superdavka-results
          retention-days: 30
