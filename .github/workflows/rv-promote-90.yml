name: RV Promote 90

on:
  push:
    paths:
      - '.github/workflows/rv-promote-90.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Release V-next #90
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path

          root = Path('.')
          payload = ''.join((root / f'.github/rv_payload_90_{i}.txt').read_text(encoding='utf-8').strip() for i in range(1, 6))
          bundle = json.loads(gzip.decompress(base64.b64decode(payload)).decode('utf-8'))
          target = 'kolik-me-stoji-pleny-kalkulacka.html'
          dataset = 'pleny-pack-runway-2026-regression.csv'
          (root / target).write_text(bundle['html'], encoding='utf-8')
          (root / dataset).write_text(bundle['csv'], encoding='utf-8')

          progress_path = root / 'RV_VNEXT_PROGRESS.json'
          data = json.loads(progress_path.read_text(encoding='utf-8'))
          completed = [x for x in data.get('completedPages', []) if x.get('file') != target and x.get('sequence') != 90]
          inprog = [x for x in data.get('inProgressPages', []) if x.get('file') != target and x.get('sequence') != 90]
          completed.append({
            'file': target,
            'url': 'https://rychlevypocty.cz/kolik-me-stoji-pleny-kalkulacka.html',
            'status': 'DONE',
            'decision': 'KEEP + FULL CLEAN REBUILD',
            'majorChangeDate': '2026-08-29',
            'archetype': 'Pack Runway / whole-pack purchase planner',
            'researchVerifiedAt': '2026-08-29',
            'qaStatus': 'PASS',
            'benchmarkDataset': {
              'enabled': True,
              'file': dataset,
              'rows': 25,
              'verifiedAt': '2026-08-29',
              'mode': 'REGRESSION_SCENARIOS_NOT_PRICE_BENCHMARK'
            },
            'structuredData': ['BreadcrumbList', 'WebApplication', 'Dataset'],
            'minimumHoldUntil': '2026-09-12',
            'holdUntil': '2026-09-26',
            'manualProductionVisualGate': 'PASS',
            'manualProductionVisualGateAt': '2026-08-29',
            'notes': 'Full V-next rebuild approved by user on 2026-08-29. Replaces fractional-pack cash-flow and unsupported working intervals with a deterministic Pack Runway: unit price, package runway, whole packages required, purchase spend and leftover stock. Detailed mode compares two concrete packs under the same consumption/horizon and optionally models cloth diapers only from user-entered setup and washing costs. No automatic age-based diaper consumption or market-price benchmark is claimed.' ,
            'sequence': 90
          })
          data['completedPages'] = sorted(completed, key=lambda x: x['sequence'])
          data['inProgressPages'] = inprog
          data['currentCandidate'] = None
          data['nextCandidate'] = None
          data['updatedAt'] = '2026-08-29'
          data['lastUpdated'] = '2026-08-29'
          ti = data.setdefault('trackingIntegrity', {})
          ti['lastReconciledAt'] = '2026-08-29'
          ti['reconciledAgainst'] = 'GitHub main + user-approved #90 Pack Runway preview + deterministic release QA'
          ti['trackedSequenceRange'] = '1-90 completed'
          ti['nextSequence'] = 91
          ti['guard'] = 'python rv-vnext-progress-audit.py --root .'
          progress_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          registry_path = root / 'calculators-registry.json'
          reg = json.loads(registry_path.read_text(encoding='utf-8'))
          for item in reg.get('items', []):
            if item.get('file') == target:
              item['name'] = 'Kolik stojí pleny?'
              item['shortDescription'] = 'Spočítejte cenu za kus, kolik celých balení plen skutečně koupíte, výdaj za zvolené období a zbylou zásobu. Podrobný režim porovná dvě konkrétní nabídky.'
              terms = list(dict.fromkeys((item.get('searchTerms') or []) + ['kolik stojí pleny', 'cena plen za kus', 'kolik balení plen potřebuji', 'náklady na pleny', 'porovnání balení plen']))
              item['searchTerms'] = terms
              item['methodologyCheckedAt'] = '2026-08-29'
              item['referenceYear'] = 2026
              break
          registry_path.write_text(json.dumps(reg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sitemap_path = root / 'sitemap.xml'
          sm = sitemap_path.read_text(encoding='utf-8')
          loc = 'https://rychlevypocty.cz/kolik-me-stoji-pleny-kalkulacka.html'
          pattern = re.compile(r'(<url>\s*<loc>' + re.escape(loc) + r'</loc>)(.*?)(</url>)', re.S)
          def repl(m):
            mid = re.sub(r'<lastmod>[^<]+</lastmod>', '<lastmod>2026-08-29</lastmod>', m.group(2))
            if '<lastmod>' not in mid:
              mid = '\n<lastmod>2026-08-29</lastmod>' + mid
            return m.group(1) + mid + m.group(3)
          sm, n = pattern.subn(repl, sm, count=1)
          if n != 1:
            raise SystemExit('Sitemap entry for #90 not found')
          sitemap_path.write_text(sm, encoding='utf-8')
          PY
          python rv-vnext-progress-audit.py --root .
          python .github/scripts/audit_static_site.py --root . --config audits/audit-config.json --check-js --json-out /tmp/rv90-audit.json
      - name: Commit release and clean staging
        shell: bash
        run: |
          git config user.name 'rv-github-native-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/rv_payload_90_1.txt .github/rv_payload_90_2.txt .github/rv_payload_90_3.txt .github/rv_payload_90_4.txt .github/rv_payload_90_5.txt .github/workflows/rv-promote-90.yml
          git add kolik-me-stoji-pleny-kalkulacka.html pleny-pack-runway-2026-regression.csv RV_VNEXT_PROGRESS.json calculators-registry.json sitemap.xml
          git commit -m 'Release V-next #90 Pack Runway calculator'
          git push origin HEAD:main
