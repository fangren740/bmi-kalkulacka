name: Odstupne final visual polish
on:
  push:
    branches: [upgrade/odstupne-v7]
    paths: [.github/workflows/odstupne-visual-final.yml]
permissions:
  contents: write
jobs:
  visual-final:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odstupne-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply human visual polish
        shell: bash
        run: |
          cat >> odstupne-kalkulacka.css <<'CSS'

          /* Gold V7 human visual review: secondary hero action must stay clearly secondary. */
          .stp-hero__actions .stp-btn--ghost{
            color:#12343d!important;
            background:#eef2ef!important;
            border-color:#9fb5ae!important;
            box-shadow:none!important;
          }
          CSS
          node --check odstupne.js
      - name: Install QA
        run: npm install --prefix "$RUNNER_TEMP/rvqa" puppeteer-core@24.16.0 lighthouse@13.4.1
      - name: Browser and correctness gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 1
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');
          (async()=>{const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          for(const width of [1440,1280,1024,768,430,390,360,320]){const p=await b.newPage();await p.setViewport({width,height:1000});await p.goto('http://127.0.0.1:8765/odstupne-kalkulacka.html',{waitUntil:'networkidle0'});const base=await p.evaluate(()=>{const ghost=document.querySelector('.stp-hero__actions .stp-btn--ghost');const cs=getComputedStyle(ghost);return{overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,total:document.querySelector('#resultTotal').textContent.trim(),toolTop:Math.round(document.querySelector('#kalkulacka').getBoundingClientRect().top+scrollY),ghostBg:cs.backgroundColor,ghostColor:cs.color}});console.log('WIDTH',width,base);if(base.overflow)throw new Error('overflow '+width);if(base.total.replace(/\s/g,'')!=='84000Kč')throw new Error('default '+width);if(width<=390&&base.toolTop>820)throw new Error('mobile first-use '+width);if(width>=1024&&(base.ghostBg!=='rgb(238, 242, 239)'||base.ghostColor!=='rgb(18, 52, 61)'))throw new Error('ghost visual '+JSON.stringify(base));
          if(width===390){await p.click('[data-mode-button="pro"]');await p.waitForFunction(()=>document.body.dataset.mode==='pro');await p.$eval('#proWorkTimeAccount',e=>{e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'')==='210000Kč');await p.$eval('#proWorkTimeAccount',e=>{e.checked=false;e.dispatchEvent(new Event('change',{bubbles:true}))});await p.$eval('#proReason',e=>{e.value='exposure';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'')==='504000Kč');if((await p.$eval('#decisionType',e=>e.textContent.trim()))!=='§ 67 odst. 3')throw new Error('exposure paragraph');await p.$eval('#proReason',e=>{e.value='workHealth';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#proReturnEnabled').disabled===true);if(!(await p.$eval('#repaymentBox',e=>e.hidden)))throw new Error('271ca repayment');}
          await p.close();}await b.close();console.log('ODSTUPNE_FINAL_VISUAL_BROWSER_PASS');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Lighthouse gate
        shell: bash
        run: |
          set -euo pipefail
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');for(const n of ['mobile','desktop']){const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+n+'.json'));const s=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));console.log(n.toUpperCase(),s,'LCP',Math.round(x.audits['largest-contentful-paint'].numericValue||0),'TBT',Math.round(x.audits['total-blocking-time'].numericValue||0),'CLS',x.audits['cumulative-layout-shift'].numericValue||0);if(s.performance<98||s.accessibility<100||s['best-practices']<100||s.seo<100)process.exit(1);}
          NODE
      - name: Build exact final preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          h=Path('odstupne-kalkulacka.html').read_text();css='\n'.join(Path(p).read_text() for p in ['rv-brand-v32.css','rv-social-links.css','odstupne-kalkulacka.css']);js=Path('odstupne.js').read_text();h=re.sub(r'<link rel="stylesheet" href="/rv-brand-v32.css[^>]*>\s*','',h);h=re.sub(r'<link rel="stylesheet" href="/rv-social-links.css[^>]*>\s*','',h);h=re.sub(r'<link rel="stylesheet" href="/odstupne-kalkulacka.css[^>]*>',lambda m:'<style>'+css+'</style>',h);h=re.sub(r'<script src="/odstupne.js[^>]*></script>',lambda m:'<script>'+js+'</script>',h)
          for name in ['logo-rv-v32.svg','logo-rv-v32-inverse.svg','favicon-rv-v32.svg']:
            data=base64.b64encode(Path(name).read_bytes()).decode();h=re.sub(r'/'+re.escape(name)+r'(?:\?v=1)?',lambda m:'data:image/svg+xml;base64,'+data,h)
          Path('RV_ODSTUPNE_GOLD_LIVE_PREVIEW.html').write_text(h)
          PY
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');(async()=>{const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});for(const [n,w,h] of [['desktop',1440,1100],['mobile390',390,844],['mobile320',320,780]]){const p=await b.newPage();await p.setViewport({width:w,height:h});await p.goto('http://127.0.0.1:8765/odstupne-kalkulacka.html',{waitUntil:'networkidle0'});await p.screenshot({path:'candidate-'+n+'-top.png'});await p.evaluate(()=>document.querySelector('#kalkulacka').scrollIntoView());await new Promise(r=>setTimeout(r,200));await p.screenshot({path:'candidate-'+n+'-tool.png'});await p.close();}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: odstupne-gold-v7-final-human-reviewed
          path: |
            RV_ODSTUPNE_GOLD_LIVE_PREVIEW.html
            candidate-*.png
            ${{ runner.temp }}/mobile.json
            ${{ runner.temp }}/desktop.json
          retention-days: 30
      - name: Commit polish and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/odstupne-visual-final.yml
          git add odstupne-kalkulacka.css .github/workflows/odstupne-visual-final.yml
          git commit -m 'Polish severance hero action contrast'
          git push origin HEAD:upgrade/odstupne-v7
