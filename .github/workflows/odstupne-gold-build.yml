name: Odstupne Gold V7 build
on:
  push:
    branches: [upgrade/odstupne-v7]
    paths: [.github/workflows/odstupne-gold-build.yml]
permissions:
  contents: write
jobs:
  build-qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odstupne-v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Gold correctness UX and brand upgrade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          hp=Path('odstupne-kalkulacka.html'); cp=Path('odstupne-kalkulacka.css'); jp=Path('odstupne.js')
          h=hp.read_text(); c=cp.read_text(); s=jp.read_text()
          def rep(text,a,b,label):
              if a not in text: raise SystemExit('missing '+label)
              return text.replace(a,b)
          h=rep(h,'<link rel="icon" href="favicon.ico?v=2" sizes="any">','<link rel="icon" href="/favicon-rv-v32.svg?v=1" type="image/svg+xml">','favicon')
          h=rep(h,'<meta name="theme-color" content="#12343d">','<meta name="theme-color" content="#071a33">','theme')
          h=rep(h,'<meta name="description" content="Spočítejte odstupné v roce 2026 z průměrného měsíčního výdělku. Basic výpočet 1× až 3×, PRO režim, 12násobná náhrada, rozpad a praktický průvodce.">','<meta name="description" content="Spočítejte odstupné 2026 z průměrného měsíčního výdělku. Organizační důvody 1× až 3×, zvláštní konto pracovní doby 4× až 6×, 12× expozice i náhrada § 271ca.">','description')
          h=rep(h,'<link rel="stylesheet" href="odstupne-kalkulacka.css?v=20260718-1">','<link rel="stylesheet" href="/rv-brand-v32.css?v=20260801-stable">\n  <link rel="stylesheet" href="/rv-social-links.css?v=20260907-1">\n  <link rel="stylesheet" href="/odstupne-kalkulacka.css?v=20260915-gold1">','styles')
          h=rep(h,'<body class="stp-page" data-mode="basic">','<body class="rv-brand-v3 rv-brand-v32 stp-page" data-mode="basic">','body class')
          h=rep(h,'<a class="stp-brand" href="/" aria-label="RychléVýpočty.cz – domů"><img src="logo-rychlevypocty.svg" alt="RychléVýpočty.cz" width="190" height="38"></a>','<a class="stp-brand rv-logo" href="/" aria-label="RychléVýpočty.cz – domů"><img src="/logo-rv-v32.svg?v=1" alt="" width="295" height="48" decoding="async"></a>','header logo')
          h=rep(h,'<p class="stp-kicker"><i></i> Konec pracovního poměru · pravidla 2026</p>','<p class="stp-kicker"><i></i> Konec pracovního poměru · § 67 / § 271ca · ověřeno 15. 9. 2026</p>','hero kicker')
          h=rep(h,'<div class="stp-proof"><span><strong>1×–3×</strong> organizační důvody</span><span><strong>12×</strong> zvláštní situace</span><span><strong>Basic + PRO</strong> dva režimy</span><span>Bez registrace</span></div>','<div class="stp-proof"><span><strong>1×–3×</strong> běžné organizační důvody</span><span><strong>4×–6×</strong> zvláštní konto pracovní doby</span><span><strong>12×</strong> expozice / § 271ca</span><span>MPSV ověřeno 15. 9. 2026</span></div>','hero proof')
          h=rep(h,'<small id="basicEarningsHelp">Hledejte jej v podkladech zaměstnavatele; pro rychlý odhad lze použít běžnou hrubou mzdu.</small>','<small id="basicEarningsHelp">Hledejte jej v podkladech zaměstnavatele; pro rychlý odhad lze použít běžnou hrubou mzdu. <a class="stp-inline-link" href="/prumerny-vydelek-kalkulacka.html">Nevíte hodnotu? Spočítejte průměrný výdělek →</a></small>','basic earnings help')
          prev='<label class="stp-field stp-conditional" id="previousMonthsField" hidden><span>Délka předchozího pracovního poměru</span><div class="stp-input-wrap"><input id="proPreviousMonths" type="text" inputmode="numeric" value="0"><em>měs.</em></div><small>Kalkulačka jej přičte k současné době pouze po zapnutí volby výše.</small></label>'
          account=prev+'\n      <label class="stp-toggle stp-account-toggle" id="accountToggle"><input id="proWorkTimeAccount" type="checkbox"><span><strong>Speciální režim konta pracovní doby</strong><small>Jen u organizačního důvodu a pouze pokud se na vás při skončení vztahuje postup podle § 86 odst. 4. § 67 odst. 1 písm. d) pak přidává další 3×.</small></span></label>'
          h=rep(h,prev,account,'account toggle')
          h=rep(h,'<div class="stp-step"><span>D</span><div><strong>Volitelný model návratu k zaměstnavateli</strong><small>Pomůže včas upozornit na možnou povinnost vrátit poměrnou část odstupného.</small></div></div>','<div class="stp-step"><span>D</span><div><strong>Volitelný model návratu k zaměstnavateli</strong><small>Platí pro odstupné podle § 67. Náhrada podle § 271ca ani obecné smluvní plnění se do tohoto modelu automaticky nezahrnují.</small></div></div>','return head')
          h=rep(h,'<label class="stp-toggle"><input id="proReturnEnabled" type="checkbox"><span><strong>Plánuji návrat k dosavadnímu zaměstnavateli</strong><small>Model platí pro pracovní poměr nebo DPČ před uplynutím odpovídající doby.</small></span></label>','<label class="stp-toggle" id="returnToggle"><input id="proReturnEnabled" type="checkbox"><span><strong>Plánuji návrat k dosavadnímu zaměstnavateli</strong><small>§ 68 řeší návrat v pracovním poměru nebo na DPČ před uplynutím odpovídající doby.</small></span></label><p class="stp-eligibility-note" id="returnEligibilityNote">Model je dostupný pro odstupné podle § 67.</p>','return toggle')
          org='''    <article id="organizacni-duvody"><h3>Organizační důvody: nejméně jeden, dva nebo tři výdělky</h3><p>Nejčastější zákonné odstupné vzniká, pokud pracovní poměr končí výpovědí zaměstnavatele nebo dohodou z organizačních důvodů. Typicky se zaměstnavatel nebo jeho část ruší, přemísťuje, případně se zaměstnanec stane nadbytečným v důsledku organizační změny. Nestačí, že firma situaci neformálně popíše jako „úspory“. Důvod musí odpovídat skutečnosti a právnímu jednání, kterým pracovní poměr končí.</p><p>Pracovní poměr kratší než jeden rok znamená nejméně jeden průměrný měsíční výdělek. Doba alespoň jeden rok a kratší než dva roky znamená nejméně dvojnásobek. Při trvání alespoň dva roky jde nejméně o trojnásobek. Slovo „nejméně“ je důležité: zákon určuje spodní hranici, nikoli univerzální strop. Kolektivní smlouva, vnitřní předpis nebo konkrétní dohoda může přiznat více.</p><p>Pokud pracovní poměr končí dohodou, je pro zaměstnance praktické trvat na uvedení organizačního důvodu. Bez něj může být obtížnější prokazovat, proč má odstupné náležet. Samotný podpis dohody automaticky nárok neruší, ale obsah dohody a skutečný důvod jsou pro posouzení zásadní.</p></article>'''
          org2=org+'''\n\n    <article id="konto-pracovni-doby"><h3>Výjimka: konto pracovní doby může zvýšit zákonné minimum na 4× až 6×</h3><p>§ 67 odst. 1 písm. d) obsahuje zvláštní pravidlo pro organizační skončení v době, kdy se na zaměstnance v kontu pracovní doby vztahuje postup podle § 86 odst. 4. K běžnému násobku podle délky pracovního poměru se v takové situaci přičítá trojnásobek průměrného výdělku. Výsledkem tak může být nejméně 4×, 5× nebo 6×.</p><p>Nejde o běžnou volbu pro každého zaměstnance v nerovnoměrném provozu. PRO režim ji proto drží odděleně a má se zapnout jen tehdy, pokud odpovídá skutečnému režimu konta pracovní doby a podkladům zaměstnavatele.</p></article>'''
          h=rep(h,org,org2,'konto guide')
          h=rep(h,'Stránka rozlišuje úpravu zákonného odstupného, novou jednorázovou náhradu účinnou od 1. června 2025 a praktické informace MPSV. U konkrétního sporu vždy rozhodují skutečné dokumenty a aktuální znění právních předpisů.','Stránka rozlišuje běžné odstupné podle § 67 odst. 1, návaznost pracovních poměrů podle odst. 2, 12× odstupné za nejvyšší přípustnou expozici podle odst. 3 a jednorázovou náhradu § 271ca účinnou od 1. června 2025. U konkrétního sporu vždy rozhodují skutečné dokumenty a aktuální znění právních předpisů.','sources copy')
          h=rep(h,'<div class="stp-review-note"><strong>Aktualizováno 18. 7. 2026.</strong>','<div class="stp-review-note"><strong>Metodika znovu ověřena 15. 9. 2026.</strong>','review date')
          h=rep(h,'<img src="logo-rychlevypocty-footer.svg" alt="RychléVýpočty.cz" width="205" height="41">','<img src="/logo-rv-v32-inverse.svg?v=1" alt="RychléVýpočty.cz" width="260" height="45">','footer logo')
          footer_p='<p>Praktické online kalkulačky pro mzdy, finance, podnikání, bydlení a každodenní rozhodování.</p>'
          footer_p2=footer_p+'<div class="rv-social-links stp-socials" role="group" aria-label="Sociální sítě RychléVýpočty.cz"><a href="https://www.facebook.com/rychlevypocty" target="_blank" rel="noopener" aria-label="Facebook RychléVýpočty.cz">f</a><a href="https://www.instagram.com/rychlevypocty/" target="_blank" rel="noopener" aria-label="Instagram RychléVýpočty.cz">◎</a></div>'
          h=rep(h,footer_p,footer_p2,'socials')
          h=rep(h,'<script src="odstupne.js?v=20260718-1"></script>','<script src="/odstupne.js?v=20260915-gold1"></script>','script')
          app='''\n  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Kalkulačka odstupného 2026","url":"https://rychlevypocty.cz/odstupne-kalkulacka.html","applicationCategory":"BusinessApplication","operatingSystem":"Any","inLanguage":"cs-CZ","isAccessibleForFree":true}</script>\n'''
          if '"@type":"WebApplication"' not in h: h=h.replace('</head>',app+'</head>')

          # JS correctness
          s=rep(s,'basis: "§ 67 odst. 2"','basis: "§ 67 odst. 3"','exposure legal basis')
          pat=r'  function legalMultiplier\(reason, duration\) \{.*?\n  \}\n\n  function getBasicInput'
          new='''  function legalMultiplier(reason, duration, workTimeAccount) {\n    if (reason === "exposure" || reason === "workHealth") return 12;\n    if (reason !== "organizational") return 0;\n    const base = duration === "under1" ? 1 : duration === "1to2" ? 2 : 3;\n    return base + (workTimeAccount ? 3 : 0);\n  }\n\n  function getBasicInput'''
          s,n=re.subn(pat,new,s,flags=re.S)
          if n!=1: raise SystemExit('legalMultiplier replacement '+str(n))
          s=rep(s,'      mode: "basic",\n      earnings:','      mode: "basic",\n      workTimeAccount: false,\n      earnings:','basic account field')
          s=rep(s,'      mode: "pro",\n      earnings:','      mode: "pro",\n      workTimeAccount: $("proReason").value === "organizational" && $("proWorkTimeAccount").checked,\n      earnings:','pro account field')
          s=rep(s,'const statutoryMultiplier = legalMultiplier(input.reason, input.duration);','const statutoryMultiplier = legalMultiplier(input.reason, input.duration, input.workTimeAccount);','multiplier call')
          old='''    let repayment = 0;\n    let repaymentShare = 0;\n\n    if (input.returnEnabled && totalMultiplier > 0 && input.returnAfter < totalMultiplier) {\n      repaymentShare = (totalMultiplier - input.returnAfter) / totalMultiplier;\n      repayment = totalAmount * repaymentShare;\n    }'''
          new='''    let repayment = 0;\n    let repaymentShare = 0;\n    const repaymentEligible = input.reason === "organizational" || input.reason === "exposure";\n\n    if (repaymentEligible && input.returnEnabled && totalMultiplier > 0 && input.returnAfter < totalMultiplier) {\n      repaymentShare = (totalMultiplier - input.returnAfter) / totalMultiplier;\n      repayment = totalAmount * repaymentShare;\n    }'''
          s=rep(s,old,new,'repayment eligibility')
          s=rep(s,'      repayment,\n      repaymentShare','      repayment,\n      repaymentShare,\n      repaymentEligible','repayment return')
          pat=r'    if \(result.reason === "organizational"\) \{.*?\n    \}\n\n    if \(result.reason === "exposure"\)'
          new='''    if (result.reason === "organizational") {\n      return {\n        title: result.workTimeAccount ? "Organizační důvod · konto pracovní doby" : "Organizační důvod",\n        text: `Pro dobu ${durationLabel(result.duration, result.totalMonths)} vychází zákonné minimum ${multiple(result.statutoryMultiplier)} průměrného měsíčního výdělku.${result.workTimeAccount ? " Zahrnut je zvláštní příplatek 3× podle § 67 odst. 1 písm. d)." : ""}${result.extraMultiplier > 0 ? ` Dokumenty přidávají dalších ${multiple(result.extraMultiplier)}.` : ""}`\n      };\n    }\n\n    if (result.reason === "exposure")'''
          s,n=re.subn(pat,new,s,flags=re.S)
          if n!=1: raise SystemExit('status org replacement '+str(n))
          s=rep(s,'["Právní scénář", reasonData[result.reason].short, reasonData[result.reason].basis],','["Právní scénář", reasonData[result.reason].short, result.workTimeAccount ? "§ 67 odst. 1 písm. d)" : reasonData[result.reason].basis],','table basis')
          s=rep(s,'["Zákonný násobek", multiple(result.statutoryMultiplier), result.reason === "organizational" ? "Minimum podle délky poměru" : "Minimum podle zvoleného zvláštního důvodu"],','["Zákonný násobek", multiple(result.statutoryMultiplier), result.reason === "organizational" ? (result.workTimeAccount ? "Běžné minimum podle délky + zvláštní 3× za konto pracovní doby" : "Minimum podle délky poměru") : "Minimum podle zvoleného zvláštního důvodu"],','table multiplier note')
          s=rep(s,'$("decisionType").textContent = config.basis;','$("decisionType").textContent = result.workTimeAccount ? "§ 67 odst. 1 písm. d)" : config.basis;','decision basis')
          old='''    $("repaymentBox").hidden = !(result.mode === "pro" && result.returnEnabled && result.totalMultiplier > 0);\n    if (!$("repaymentBox").hidden) {'''
          new='''    const returnToggle = $("proReturnEnabled");\n    const accountToggle = $("proWorkTimeAccount");\n    const eligibleReturn = result.reason === "organizational" || result.reason === "exposure";\n    returnToggle.disabled = result.mode === "pro" && !eligibleReturn;\n    $("returnToggle").classList.toggle("is-disabled", returnToggle.disabled);\n    $("returnEligibilityNote").textContent = eligibleReturn\n      ? "Model je dostupný pro odstupné podle § 67; zákon stanoví poměrnou část podle kalendářních dnů, proto je výsledek níže jen orientační."\n      : result.reason === "workHealth"\n        ? "Jednorázová náhrada podle § 271ca není odstupné podle § 67; automatickou vratku podle § 68 proto nepočítáme."\n        : "U obecného smluvního plnění nelze vratku odvozovat automaticky z § 68; rozhodují konkrétní dokumenty.";\n    if (!eligibleReturn) $("returnAfterField").hidden = true;\n    accountToggle.disabled = result.mode === "pro" && result.reason !== "organizational";\n    $("accountToggle").classList.toggle("is-disabled", accountToggle.disabled);\n    $("repaymentBox").hidden = !(result.mode === "pro" && result.repaymentEligible && result.returnEnabled && result.totalMultiplier > 0);\n    if (!$("repaymentBox").hidden) {'''
          s=rep(s,old,new,'render repayment')
          s=rep(s,'    $("proPreviousEligible").checked = false;\n    $("proPreviousMonths").value = 0;','    $("proPreviousEligible").checked = false;\n    $("proPreviousMonths").value = 0;\n    $("proWorkTimeAccount").checked = false;','copy basic account reset')
          s=rep(s,'    $("proPreviousMonths").value = "0";\n    $("proExtraMultiplier").value = "0";','    $("proPreviousMonths").value = "0";\n    $("proWorkTimeAccount").checked = false;\n    $("proExtraMultiplier").value = "0";','reset pro account')

          # CSS Gold hardening and mobile first-use
          c += r'''\n\n/* Gold V7 hardening — 2026-09-15 */\n:root{--stp-ink:#0b2239;--stp-ink-soft:#4f687e;--stp-navy:#071a33;--stp-teal:#1265ad;--stp-mint:#52d657;--stp-line:rgba(7,26,51,.15);--stp-shadow:0 24px 64px rgba(7,26,51,.12)}\nhtml{scroll-padding-top:92px}#kalkulacka,#vysledek,#rozpad,#pruvodce,#chyby,#faq,#zdroje{scroll-margin-top:92px}\n.stp-header{position:sticky;top:0;background:rgba(255,255,255,.97);border-bottom:1px solid #d7e2ea}\n.stp-brand img{width:224px;height:auto}\n.stp-header-cta,.stp-btn{background:linear-gradient(120deg,#071a33,#1265ad)}\n.stp-hero{background:linear-gradient(180deg,#fff 0%,#f3f8fb 100%)}\n.stp-hero h1{color:#071a33}.stp-hero h1 span{color:#1265ad}.stp-lead{color:#4f687e}\n.stp-kicker{color:#1b762c}.stp-kicker i{background:#52d657;box-shadow:0 0 0 6px rgba(82,214,87,.12)}\n.stp-visual{background:linear-gradient(145deg,#071a33,#0d3156 70%,#735a38);box-shadow:0 30px 68px rgba(7,26,51,.20)}\n.stp-anchor{background:#edf4f8;border-color:#d7e2ea}.stp-tool-band{background:#eaf2f7}.stp-panel{background:#fff}.stp-calculation{background:#fffdf8}\n.stp-inline-link{display:inline;font-weight:900;color:#1265ad;text-decoration:underline;text-underline-offset:2px}.stp-inline-link:hover{color:#0d3156}\n.stp-account-toggle{margin-top:13px}.stp-toggle.is-disabled{opacity:.58}.stp-toggle.is-disabled input{cursor:not-allowed}.stp-eligibility-note{margin:8px 0 0;color:#5a7083;font-size:.76rem;line-height:1.55}.stp-socials{display:flex!important;gap:9px;margin-top:15px}.stp-socials a{display:grid!important;place-items:center;width:36px;height:36px;margin:0!important;border:1px solid rgba(255,255,255,.18);border-radius:50%;color:#fff!important;font-weight:950}\n@media(max-width:700px){\n  html{scroll-padding-top:72px}#kalkulacka,#vysledek,#rozpad,#pruvodce,#chyby,#faq,#zdroje{scroll-margin-top:72px}\n  .stp-container{width:min(100% - 24px,1180px)}.stp-header__inner{min-height:62px}.stp-brand img{width:145px}\n  .stp-hero{padding:22px 0 24px}.stp-hero__grid{gap:14px}.stp-hero__copy{padding:0}.stp-breadcrumb{margin-bottom:13px;font-size:.72rem}.stp-kicker{margin-bottom:10px;font-size:.64rem;line-height:1.35}.stp-hero h1{font-size:clamp(2.38rem,12vw,3.05rem);line-height:.94;letter-spacing:-.055em}.stp-lead{margin-top:14px;font-size:.91rem;line-height:1.55}.stp-hero__actions{margin-top:17px}.stp-hero__actions .stp-btn{width:100%;min-height:48px}.stp-hero__actions .stp-btn--ghost{display:none}.stp-proof{display:none}\n  .stp-visual{min-height:0;margin-top:2px;padding:14px 15px;border-radius:22px;transform:none}.stp-visual__top{font-size:.62rem}.stp-visual__top i{display:none}.stp-briefcase,.stp-visual__stats{display:none}.stp-visual__amount{margin-top:9px;padding:13px 15px;border-radius:15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:end}.stp-visual__amount span,.stp-visual__amount small{grid-column:1}.stp-visual__amount strong{grid-column:2;grid-row:1/3;margin:0;font-size:1.7rem;white-space:nowrap}.stp-visual__line{margin:10px 0 0}\n  .stp-anchor{display:none}.stp-tool-band{padding:24px 0 46px}.stp-card{border-radius:22px}.stp-panel__head{padding:20px 18px 15px}.stp-panel__head h2{font-size:2rem}.stp-panel__head p:not(.stp-kicker-light){margin-top:7px;font-size:.8rem}.stp-live{padding:6px 8px;font-size:.65rem}.stp-mode{gap:7px;padding:0 18px 17px}.stp-mode__button{grid-template-columns:34px minmax(0,1fr);padding:11px 10px}.stp-mode__button>span{width:34px;height:34px}.stp-mode__button>b{display:none}.stp-mode__button>strong{font-size:.78rem}.stp-mode__button>small{font-size:.63rem}.stp-calculation{padding:19px 18px 24px}.stp-intro{margin-bottom:18px;padding:12px}.stp-step{margin:19px 0 12px}.stp-choice-grid label,.stp-toggle{min-height:48px}.stp-actions .stp-btn,.stp-actions .stp-reset{min-height:48px}.stp-inline-link{display:block;margin-top:5px}\n}\n@media(max-width:350px){.stp-hero h1{font-size:2.25rem}.stp-lead{font-size:.87rem}.stp-visual__amount strong{font-size:1.5rem}.stp-mode__button small{display:none}.stp-mode__button{min-height:54px}}\n'''
          hp.write_text(h); cp.write_text(c); jp.write_text(s)
          PY
          node --check odstupne.js
          grep -q '§ 67 odst. 1 písm. d)' odstupne-kalkulacka.html
          grep -q 'Metodika znovu ověřena 15. 9. 2026' odstupne-kalkulacka.html
          grep -q 'logo-rv-v32.svg' odstupne-kalkulacka.html
          ! grep -q 'basis: "§ 67 odst. 2"' odstupne.js
      - name: Install QA
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/rvqa" puppeteer-core@24.16.0 lighthouse@13.4.1
      - name: Browser correctness responsive and UX gate
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 & sleep 1
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');
          (async()=>{const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const errs=[];
          for(const width of [1440,1280,1024,768,430,390,360,320]){const p=await b.newPage();p.on('pageerror',e=>errs.push(String(e)));p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});await p.setViewport({width,height:1000});await p.goto('http://127.0.0.1:8765/odstupne-kalkulacka.html',{waitUntil:'networkidle0'});const base=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,total:document.querySelector('#resultTotal').textContent.trim(),logo:document.querySelector('header img').getAttribute('src'),toolTop:document.querySelector('#kalkulacka').getBoundingClientRect().top+scrollY}));if(base.overflow)throw new Error('overflow '+width);if(base.total!=='84 000 Kč'&&base.total!=='84 000 Kč')throw new Error('default '+width+' '+base.total);if(!base.logo.includes('logo-rv-v32.svg'))throw new Error('logo '+width);if(width<=390&&base.toolTop>820)throw new Error('mobile first-use tool too low '+width+' '+base.toolTop);
            if(width===390){
              await p.click('[data-mode-button="pro"]');await p.waitForFunction(()=>document.body.dataset.mode==='pro');
              await p.$eval('#proWorkTimeAccount',e=>{e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'').includes('210000Kč'));if(!(await p.$eval('#decisionType',e=>e.textContent)).includes('písm. d'))throw new Error('konto legal basis');
              await p.$eval('#proWorkTimeAccount',e=>{e.checked=false;e.dispatchEvent(new Event('change',{bubbles:true}))});await p.$eval('#proReason',e=>{e.value='exposure';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'').includes('504000Kč'));if((await p.$eval('#decisionType',e=>e.textContent.trim()))!=='§ 67 odst. 3')throw new Error('exposure paragraph');
              await p.$eval('#proReturnEnabled',e=>{e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForFunction(()=>!document.querySelector('#repaymentBox').hidden);
              await p.$eval('#proReason',e=>{e.value='workHealth';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#proReturnEnabled').disabled===true);if(!(await p.$eval('#repaymentBox',e=>e.hidden)))throw new Error('271ca repayment must be hidden');if(!(await p.$eval('#returnEligibilityNote',e=>e.textContent)).includes('§ 271ca'))throw new Error('271ca explanation');
              await p.$eval('#proReason',e=>{e.value='other';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.$eval('#proExtraMultiplier',e=>{e.value='2';e.dispatchEvent(new Event('input',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#proReturnEnabled').disabled===true);if(!(await p.$eval('#repaymentBox',e=>e.hidden)))throw new Error('contractual repayment must be hidden');
              const targets=await p.$$eval('.stp-btn,.stp-mode__button,.stp-choice-grid label,.stp-toggle',els=>els.filter(e=>e.offsetParent!==null).map(e=>({w:e.getBoundingClientRect().width,h:e.getBoundingClientRect().height,t:e.textContent.trim().slice(0,30)})));const bad=targets.filter(x=>x.h<44||x.w<44);if(bad.length)throw new Error('small touch targets '+JSON.stringify(bad.slice(0,5)));
            }
            await p.close();}
          await b.close();if(errs.length)throw new Error(errs.join('\n'));console.log('ODSTUPNE_GOLD_BROWSER_QA_PASS');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Lighthouse Gold gate
        shell: bash
        run: |
          set -euo pipefail
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');for(const n of ['mobile','desktop']){const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+n+'.json'));const s=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));console.log(n.toUpperCase(),s);if(s.performance<98||s.accessibility<100||s['best-practices']<100||s.seo<100)process.exit(1);}
          NODE
      - name: Build exact preview and candidate screenshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,base64
          h=Path('odstupne-kalkulacka.html').read_text();css='\n'.join(Path(p).read_text() for p in ['rv-brand-v32.css','rv-social-links.css','odstupne-kalkulacka.css']);js=Path('odstupne.js').read_text()
          h=re.sub(r'<link rel="stylesheet" href="/rv-brand-v32.css[^>]*>\s*','',h);h=re.sub(r'<link rel="stylesheet" href="/rv-social-links.css[^>]*>\s*','',h);h=re.sub(r'<link rel="stylesheet" href="/odstupne-kalkulacka.css[^>]*>',lambda m:'<style>'+css+'</style>',h);h=re.sub(r'<script src="/odstupne.js[^>]*></script>',lambda m:'<script>'+js+'</script>',h)
          for name in ['logo-rv-v32.svg','logo-rv-v32-inverse.svg','favicon-rv-v32.svg']:
            data=base64.b64encode(Path(name).read_bytes()).decode();h=re.sub(r'/'+re.escape(name)+r'(?:\?v=1)?',lambda m:'data:image/svg+xml;base64,'+data,h)
          Path('RV_ODSTUPNE_GOLD_LIVE_PREVIEW.html').write_text(h)
          PY
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');(async()=>{const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});for(const [n,w,h] of [['desktop',1440,1100],['mobile390',390,844],['mobile320',320,780]]){const p=await b.newPage();await p.setViewport({width:w,height:h});await p.goto('http://127.0.0.1:8765/odstupne-kalkulacka.html',{waitUntil:'networkidle0'});await p.screenshot({path:'candidate-'+n+'-top.png'});await p.evaluate(()=>document.querySelector('#kalkulacka').scrollIntoView());await new Promise(r=>setTimeout(r,250));await p.screenshot({path:'candidate-'+n+'-tool.png'});await p.close();}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: odstupne-gold-candidate
          path: |
            RV_ODSTUPNE_GOLD_LIVE_PREVIEW.html
            candidate-*.png
            ${{ runner.temp }}/mobile.json
            ${{ runner.temp }}/desktop.json
          retention-days: 30
      - name: Commit verified candidate and clean one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/odstupne-gold-build.yml .github/workflows/odstupne-baseline.yml
          git add odstupne-kalkulacka.html odstupne-kalkulacka.css odstupne.js
          git commit -m 'Upgrade severance calculator to Gold V7'
          git push origin HEAD:upgrade/odstupne-v7
