name: Vacation footer V32 brand hotfix gate
on:
  push:
    branches: [hotfix/vacation-footer-logo-v32-color-20260916]
    paths: ['.github/workflows/vacation-logo-v32-hotfix-gate.yml']
permissions:
  contents: write
jobs:
  brand-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/vacation-footer-logo-v32-color-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch only vacation footer logo, preserve V32 geometry and colors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          html=Path('nahrada-mzdy-za-dovolenou-kalkulacka.html')
          css=Path('nahrada-dovolena-pro.css')
          source=Path('logo-rv-v32.svg')
          assert hashlib.sha256(html.read_bytes()).hexdigest()=='9ec047dd12a36a9a991d87c4b6ce0430a3755b6b7086f9bbb2296ed7da17a5de'
          assert hashlib.sha256(css.read_bytes()).hexdigest()=='b0e117e91c02d9d2fb2bb965ee88ac2782d1ec824d1ce6cc45896539140a0f71'
          s=source.read_text()
          assert s.count('fill="#071A33"')==9 and s.count('fill="url(#rvBody)"')==1
          out=s.replace('fill="#071A33"','fill="#F6FAFC"').replace('stroke="#0D315D"','stroke="#B8D6EB"').replace('fill="url(#rvBody)"','fill="url(#rvBody)" stroke="#9BBBD3" stroke-width="1.2"')
          new=Path('logo-rv-v32-footer-color.svg');new.write_text(out)
          a=html.read_text();old='/logo-rv-v32-inverse.svg?v=1';assert a.count(old)==1
          html.write_text(a.replace(old,'/logo-rv-v32-footer-color.svg?v=20260916-1'))
          a=css.read_text();old='filter:brightness(0) invert(1)';assert a.count(old)==1
          css.write_text(a.replace(old,'filter:none'))
          expected={'nahrada-mzdy-za-dovolenou-kalkulacka.html':'a5709977652a09c408889786a9e4b3150391845cb3f2b031af3fbc26a6881a82','nahrada-dovolena-pro.css':'c73097ac26bc4dd0bff9a514094e298d335fc47073dca6cd06b363630ef9537e','logo-rv-v32-footer-color.svg':'99a95ff991c0bc011900ac22b90bee1e6fceacdb391d461e1ca7d8b9fb934975'}
          for path,digest in expected.items():
            actual=hashlib.sha256(Path(path).read_bytes()).hexdigest()
            assert actual==digest,(path,actual)
          assert 'fill="#36C931"' in out and 'fill="#F6FAFC"' in out and 'fill="url(#rvBolt)"' in out
          print('V32_COLORED_LOGO_EXACT_BYTES_PASS')
          PY
          node --check nahrada-dovolena.js
          git diff --check
      - name: Browser verify actual footer pixels, image, styles and layout
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/logoqa" --no-audit --no-fund --silent puppeteer-core@24
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/logo-server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          sleep 1
          node - <<'NODE'
          const pptr=require(process.env.RUNNER_TEMP+'/logoqa/node_modules/puppeteer-core');
          (async()=>{const browser=await pptr.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          for(const width of [1440,390,320]){const page=await browser.newPage();await page.setViewport({width,height:900,deviceScaleFactor:1});await page.goto('http://127.0.0.1:8765/nahrada-mzdy-za-dovolenou-kalkulacka.html',{waitUntil:'networkidle0'});
          const r=await page.evaluate(async()=>{const img=document.querySelector('.vac-footer__brand .rv-logo img');const css=getComputedStyle(img);const s=await (await fetch(img.src)).text();const c=document.createElement('canvas');c.width=590;c.height=96;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,590,96);const pixels=ctx.getImageData(0,0,590,96).data;let green=0,white=0,blue=0;for(let j=0;j<pixels.length;j+=4){const [r,g,b,a]=pixels.slice(j,j+4);if(a<150)continue;if(g>r*1.35&&g>b*1.1&&g>110)green++;if(r>220&&g>220&&b>220)white++;if(b>r*1.3&&b>g*1.05&&b>75)blue++;}return {src:img.getAttribute('src'),loaded:img.naturalWidth>0,filter:css.filter,green,white,blue,columns:document.querySelectorAll('.vac-footer__grid>div').length,overflow:document.documentElement.scrollWidth>innerWidth+2,svgGreen:s.includes('#36C931'),svgWhite:s.includes('#F6FAFC')};});console.log('BRAND_VIEWPORT',width,r);if(!r.loaded||r.filter!=='none'||r.green<500||r.white<700||r.blue<100||r.columns!==4||r.overflow||!r.svgGreen||!r.svgWhite||!r.src.includes('logo-rv-v32-footer-color.svg'))throw Error('footer brand regression '+width);if(width===390){await page.$eval('.vac-footer',e=>e.scrollIntoView());await page.screenshot({path:'/tmp/vacation-footer-v32-390.png'});}await page.close();}await browser.close();console.log('FOOTER_VISUAL_COLOR_CONTRACT_PASS');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit only three hotfix files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/vacation-logo-v32-hotfix-gate.yml
          git add -A .github/workflows/vacation-logo-v32-hotfix-gate.yml nahrada-mzdy-za-dovolenou-kalkulacka.html nahrada-dovolena-pro.css logo-rv-v32-footer-color.svg
          git diff --cached --check
          git commit -m 'Fix vacation footer V32 logo colors and remove destructive filter'
          git push origin HEAD:hotfix/vacation-footer-logo-v32-color-20260916
          test "$(git diff --name-only origin/main...HEAD | sort | tr '\n' ',')" = 'logo-rv-v32-footer-color.svg,nahrada-dovolena-pro.css,nahrada-mzdy-za-dovolenou-kalkulacka.html,'
