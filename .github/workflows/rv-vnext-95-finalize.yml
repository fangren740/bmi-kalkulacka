name: RV V-next 95 Finalize

on:
  push:
    branches:
      - upgrade/naklady-provoz-auta-vnext-95
    paths:
      - '.github/workflows/rv-vnext-95-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/naklady-provoz-auta-vnext-95
          fetch-depth: 0
      - name: Apply release-gate fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('naklady-na-provoz-auta-kalkulacka.html')
          text = html.read_text(encoding='utf-8')
          text = text.replace('<div class="cost-meter" aria-label="Struktura nákladů">', '<div class="cost-meter" role="img" aria-label="Struktura nákladů">')
          text = text.replace('href="/metodika.html"', 'href="/jak-pocitame.html"')
          text = text.replace('href="/o-projektu.html"', 'href="/o-nas.html"')
          html.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          s = sitemap.read_text(encoding='utf-8')
          target = 'https://rychlevypocty.cz/naklady-na-provoz-auta-kalkulacka.html'
          pattern = rf'(<loc>{re.escape(target)}</loc>\s*<lastmod>)[^<]+(</lastmod>)'
          s, n = re.subn(pattern, rf'\g<1>2026-09-10\g<2>', s, count=1)
          if n != 1:
              raise SystemExit('Target sitemap entry not found exactly once')
          sitemap.write_text(s, encoding='utf-8')
          PY
          python .github/scripts/vnext_inventory.py
          python rv-vnext-progress-audit.py --root .
          python rv-vnext-a11y-lint.py --all-vnext
          python .github/scripts/vnext_inventory.py --check
      - name: Commit final release-gate fixes
        run: |
          git config user.name 'rv-github-native-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/rv-vnext-95-finalize.yml
          git add naklady-na-provoz-auta-kalkulacka.html sitemap.xml RV_VNEXT_INVENTORY.json
          git commit -m 'Finalize V-next 95 release gates'
          git push origin HEAD:upgrade/naklady-provoz-auta-vnext-95
