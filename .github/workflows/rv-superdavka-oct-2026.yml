name: RV Superdávka Oct 2026 candidate QA
on:
  pull_request:
    paths:
      - 'superdavka-kalkulacka.html'
      - 'superdavka-vnext.js'
      - 'superdavka-vnext.css'
      - 'superdavka-normativy-2026-10.js'
      - '.github/scripts/superdavka-oct-2026-qa.cjs'
      - '.github/workflows/rv-superdavka-oct-2026.yml'
permissions:
  contents: read
jobs:
  october-functional:
    name: Current statutory model, basic UX and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_PATH: /tmp/rv-superdavka-qa/node_modules
      RV_TARGET_BASE: http://127.0.0.1:8765
      RV_QA_OUTPUT: /tmp/rv-superdavka-oct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check superdavka-vnext.js
          node --check superdavka-normativy-2026-10.js
          node --check .github/scripts/superdavka-oct-2026-qa.cjs
      - name: Install browser
        run: |
          npm install --prefix /tmp/rv-superdavka-qa playwright@1.62.1
          /tmp/rv-superdavka-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve candidate
        run: python -m http.server 8765 --bind 127.0.0.1 > /tmp/rv-superdavka-server.log 2>&1 &
      - name: Verify real October model and UI
        run: node .github/scripts/superdavka-oct-2026-qa.cjs
      - name: Attach user-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superdavka-2026-oct-preview
          path: /tmp/rv-superdavka-oct
          if-no-files-found: warn
          retention-days: 21
