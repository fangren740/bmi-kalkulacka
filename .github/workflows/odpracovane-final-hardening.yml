name: RV worked-hours final no-regression hardening
on:
  push:
    branches: [upgrade/odpracovane-hodiny-v7]
    paths: [.github/workflows/odpracovane-final-hardening.yml]
permissions:
  contents: write
jobs:
  harden-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odpracovane-hodiny-v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final UX and content no-regression fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cssp=Path('odpracovane-hodiny.css')
          css=cssp.read_text()
          old='.wh-presets button{min-height:36px;padding:0 12px;border:1px solid #cbdbe5;border-radius:10px;background:#f8fbfd;color:#536b7f;font-size:.65rem;font-weight:900;cursor:pointer}'
          new='.wh-presets button{min-height:44px;padding:0 12px;border:1px solid #cbdbe5;border-radius:10px;background:#f8fbfd;color:#536b7f;font-size:.8rem;font-weight:900;cursor:pointer}'
          if old not in css: raise SystemExit('preset CSS token missing')
          css=css.replace(old,new)

          focus='.wh-page :focus-visible{outline:3px solid var(--wh-blue2);outline-offset:3px;border-radius:9px}'
          focus_new=focus+'\nbody.wh-page a.wh-btn:focus-visible,body.wh-page button.wh-btn:focus-visible{outline:3px solid var(--wh-blue2)!important;outline-offset:3px}'
          if focus not in css: raise SystemExit('focus CSS token missing')
          css=css.replace(focus,focus_new,1)

          anchor='.wh-shell{width:var(--wh-max);margin-inline:auto}'
          anchor_new=anchor+'\n#kalkulacka,#metodika,#jak-cist,#souvisejici,#faq{scroll-margin-top:90px}'
          if anchor not in css: raise SystemExit('shell CSS token missing')
          css=css.replace(anchor,anchor_new,1)
          cssp.write_text(css)

          hp=Path('kalkulacka-odpracovanych-hodin.html')
          h=hp.read_text()
          h=h.replace('/odpracovane-hodiny.css?v=20260915-gold1','/odpracovane-hodiny.css?v=20260915-gold2')
          needle='''      <section>\n        <h3>Dlouhá směna a krátká pauza jsou důvod k ověření, ne automatický soud</h3>\n        <p>Obecná délka směny nesmí přesáhnout 12 hodin, ale zákon obsahuje zvláštní výjimku pro vybrané zaměstnance ve zdravotnictví. Stejně tak směna delší než šest hodin s méně než třiceti minutami odečtené pauzy může znamenat chybu v zadání, nebo odlišný režim nepřerušitelné práce. Kalkulačka proto upozorňuje a nechává právní posouzení na skutečných podkladech.</p>\n      </section>'''
          add='''      <section>\n        <h3>Dlouhá směna a krátká pauza jsou důvod k ověření, ne automatický soud</h3>\n        <p>Obecná délka směny nesmí přesáhnout 12 hodin, ale zákon obsahuje zvláštní výjimku pro vybrané zaměstnance ve zdravotnictví. Stejně tak směna delší než šest hodin s méně než třiceti minutami odečtené pauzy může znamenat chybu v zadání, nebo odlišný režim nepřerušitelné práce. Kalkulačka proto upozorňuje a nechává právní posouzení na skutečných podkladech.</p>\n      </section>\n\n      <section>\n        <h3>Kdy samotný součet hodin nestačí</h3>\n        <p>Dovolená, svátek, nemoc nebo jiná placená nepřítomnost nejsou totéž co skutečně odpracovaný čas. Stejně tak pracovní pohotovost, služební cesta nebo běžné dojíždění mohou mít odlišný režim a jednoduché pole začátek–konec je samo nerozliší.</p>\n        <p>Před porovnáním s docházkou nebo výplatní páskou si proto ověřte pět věcí: stejné období, stejný typ času, správnou nezapočítanou pauzu, správný počet směn a stejný zdroj cílového fondu. Technický průchod turniketem, plánovaná směna a čas uznaný pro mzdu nemusí být totožné údaje.</p>\n      </section>'''
          if needle not in h: raise SystemExit('guide insertion token missing')
          h=h.replace(needle,add,1)
          hp.write_text(h)
          PY
          node --check odpracovane-hodiny.js
          grep -q 'Kdy samotný součet hodin nestačí' kalkulacka-odpracovanych-hodin.html
          grep -q 'pracovní pohotovost' kalkulacka-odpracovanych-hodin.html
          grep -q 'scroll-margin-top:90px' odpracovane-hodiny.css
          grep -q 'min-height:44px' odpracovane-hodiny.css

      - name: Install QA tooling
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/rvqa" puppeteer-core@24.16.0 lighthouse@13.4.1

      - name: Deep browser and mobile ergonomics QA
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 & sleep 1
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const errs=[];
            for(const width of [1440,1024,768,430,390,360,320]){
              const p=await b.newPage();
              p.on('pageerror',e=>errs.push(String(e)));
              p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
              await p.setViewport({width,height:1000});
              await p.goto('http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html',{waitUntil:'networkidle0'});
              if(await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1)) throw new Error('horizontal overflow '+width);
              if(await p.$eval('#resultTotal',e=>e.textContent.trim())!=='160 h') throw new Error('default result '+width);
              const presetMetrics=await p.$$eval('.wh-presets button',els=>els.map(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {h:r.height,fs:parseFloat(s.fontSize)}}));
              if(presetMetrics.some(x=>x.h<44||x.fs<12)) throw new Error('preset ergonomics '+width+' '+JSON.stringify(presetMetrics));
              if(width<=430){
                await p.click('.wh-hero .wh-btn-main');await new Promise(r=>setTimeout(r,120));
                const anchor=await p.evaluate(()=>{const h=document.querySelector('.site-header').getBoundingClientRect();const sh=document.querySelector('#kalkulacka .wh-section-head').getBoundingClientRect();return {header:h.bottom,head:sh.top}});
                if(anchor.head<anchor.header+8) throw new Error('anchor hidden under sticky header '+width+' '+JSON.stringify(anchor));
              }
              await p.close();
            }

            const p=await b.newPage();await p.setViewport({width:390,height:844});await p.goto('http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html',{waitUntil:'networkidle0'});
            const setv=async(sel,val)=>p.$eval(sel,(e,v)=>{e.value=v;e.dispatchEvent(new Event('input',{bubbles:true}))},val);
            const text=sel=>p.$eval(sel,e=>e.textContent.trim());
            await setv('#startTime','09:00');await setv('#endTime','17:00');await setv('#breakMinutes','30');await setv('#shiftCount','1');await setv('#targetFund','');
            if(await text('#resultTotal')!=='7 h 30 min') throw new Error('simple arithmetic');
            await setv('#startTime','22:00');await setv('#endTime','06:30');await setv('#breakMinutes','0');
            if(await text('#resultTotal')!=='8 h 30 min'||await text('#resultNight')!=='8 h') throw new Error('overnight no-break');
            await setv('#breakMinutes','30');const night=await text('#resultNight');if(!night.includes('7 h 30 min')||!night.includes('8 h')) throw new Error('night range '+night);
            await setv('#startTime','08:00');await setv('#endTime','08:00');if(await text('#resultTotal')!=='—') throw new Error('same-time stale guard');
            await setv('#endTime','09:00');await setv('#breakMinutes','60');if(await text('#resultTotal')!=='—') throw new Error('break >= gross guard');
            await setv('#startTime','08:00');await setv('#endTime','16:30');await setv('#breakMinutes','30');await setv('#shiftCount','20');await setv('#targetFund','160,5');if(!(await text('#resultDifference')).includes('30 min')) throw new Error('decimal comma fund');
            await setv('#shiftCount','0');if(await text('#resultTotal')!=='—') throw new Error('zero count guard');
            await setv('#shiftCount','1');await setv('#breakMinutes','-1');if(await text('#resultTotal')!=='—') throw new Error('negative break guard');
            await setv('#breakMinutes','0');await setv('#shiftCount','1000000');if(await text('#resultTotal')!=='—') throw new Error('huge count guard');
            await p.click('.wh-mode [data-mode="advanced"]');await p.click('#loadShiftExample');if(await text('#resultTotal')==='—') throw new Error('advanced example');
            for(let i=0;i<6;i++) await p.click('#addShiftBlock').catch(()=>{});
            if(await p.$$eval('.shift-block',els=>els.length)>6) throw new Error('advanced max blocks');

            await p.goto('http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html',{waitUntil:'networkidle0'});
            let found=false;
            for(let i=0;i<12;i++){
              await p.keyboard.press('Tab');
              const f=await p.evaluate(()=>{const e=document.activeElement,s=getComputedStyle(e);return {txt:(e.innerText||'').trim(),focus:e.matches(':focus-visible'),outline:parseFloat(s.outlineWidth)||0}});
              if(f.txt==='Spočítat směnu'){if(!f.focus||f.outline<2) throw new Error('hero CTA has no visible keyboard focus');found=true;break;}
            }
            if(!found) throw new Error('hero CTA not reachable by keyboard');
            await p.close();await b.close();
            if(errs.length) throw new Error(errs.join('\n'));
            console.log('WORKED_HOURS_DEEP_NO_REGRESSION_QA_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Lighthouse Gold gate mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$LH" 'http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');
          for(const n of ['mobile','desktop']){const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+n+'.json'));const s=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));console.log(n.toUpperCase(),s);if(s.performance<98||s.accessibility<100||s['best-practices']<100||s.seo<100)process.exit(1);}
          NODE

      - name: Commit only if every gate is green
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/odpracovane-final-hardening.yml
          git add kalkulacka-odpracovanych-hodin.html odpracovane-hodiny.css
          git commit -m 'Harden worked-hours Gold candidate after no-regression review'
          git push origin HEAD:upgrade/odpracovane-hodiny-v7
