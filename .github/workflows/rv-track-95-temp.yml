name: RV Track 95 Temporary

on:
  push:
    branches:
      - upgrade/naklady-provoz-auta-vnext-95
    paths:
      - '.github/workflows/rv-track-95-temp.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/naklady-provoz-auta-vnext-95
          fetch-depth: 0
      - name: Reconcile V-next tracker for sequence 95
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('RV_VNEXT_PROGRESS.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          completed = [x for x in data.get('completedPages', []) if x.get('sequence') != 95 and x.get('file') != 'naklady-na-provoz-auta-kalkulacka.html']
          in_progress = [x for x in data.get('inProgressPages', []) if x.get('sequence') != 95 and x.get('file') != 'naklady-na-provoz-auta-kalkulacka.html']

          completed.append({
            'sequence': 95,
            'file': 'naklady-na-provoz-auta-kalkulacka.html',
            'url': 'https://rychlevypocty.cz/naklady-na-provoz-auta-kalkulacka.html',
            'status': 'RELEASE_CANDIDATE',
            'decision': 'KEEP + FULL CLEAN REBUILD',
            'majorChangeDate': '2026-09-10',
            'archetype': 'Ownership Cost Stack / cash vs. value ledger',
            'researchVerifiedAt': '2026-09-10',
            'qaStatus': 'LOCAL_STATIC_RUNTIME_VISUAL_NUMERIC_AND_STRUCTURAL_A11Y_PASS_PRODUCTION_PSI_PENDING',
            'benchmarkDataset': {
              'enabled': False,
              'file': None,
              'rows': None,
              'verifiedAt': None
            },
            'structuredData': ['BreadcrumbList', 'WebApplication'],
            'minimumHoldUntil': '2026-09-24',
            'holdUntil': '2026-10-08',
            'manualProductionVisualGate': 'PASS',
            'manualProductionVisualGateAt': '2026-09-10',
            'notes': 'Full V-next rebuild visually approved by user on 2026-09-10. The calculator models monthly, annual and per-kilometre ownership cost only from user-entered values, separates operating cash from depreciation, supports petrol/diesel/EV, detailed recurring costs, mileage dilution and ±20% energy-price sensitivity without claiming a forecast or market average. Local deterministic regression covered 25 scenarios; responsive/runtime QA covered 1440/1280/1120/1024/768/390/320 with zero horizontal overflow and no browser errors. Production PageSpeed/Lighthouse remains pending after deploy.'
          })

          data['completedPages'] = sorted(completed, key=lambda x: x['sequence'])
          data['inProgressPages'] = in_progress
          data['currentCandidate'] = None
          data['nextCandidate'] = None
          data['updatedAt'] = '2026-09-10'
          if 'lastUpdated' in data:
            data['lastUpdated'] = '2026-09-10'

          ti = data.setdefault('trackingIntegrity', {})
          ti['lastReconciledAt'] = '2026-09-10'
          ti['reconciledAgainst'] = 'GitHub branch + canonical RV-VNEXT HTML markers + user visual approval'
          ti['trackedSequenceRange'] = '1-95 completed'
          ti['nextSequence'] = 96
          ti['guard'] = 'python rv-vnext-progress-audit.py --root .'

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/rv-track-95-temp.yml
          python rv-vnext-progress-audit.py --root .
      - name: Commit tracking reconciliation and remove temporary workflow
        run: |
          git config user.name 'rv-github-native-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Track V-next #95 release candidate'
          git push origin HEAD:upgrade/naklady-provoz-auta-vnext-95
