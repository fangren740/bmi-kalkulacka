name: Odstupne Gold V7 final v5
on:
  push:
    branches: [upgrade/odstupne-v7]
    paths: [.github/workflows/odstupne-final-v5.yml]
permissions:
  contents: write
jobs:
  final-v5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odstupne-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize final candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml,subprocess,os
          y=yaml.safe_load(Path('.github/workflows/odstupne-final-v3.yml').read_text())
          by={s.get('name'):s.get('run') for s in y['jobs']['final-v3']['steps'] if s.get('name')}
          subprocess.run(['bash','-lc',by['Materialize candidate and harden contrast']],check=True,env=os.environ.copy())
          p=Path('odstupne-kalkulacka.css');s=p.read_text()
          repl={'#4d6b65':'#36544e','#3c6860':'#2f554e','#2c6d63':'#285c54','#397066':'#2f5b54','#2e6f65':'#285c54','#5d746d':'#435f59','#3a7066':'#2f5b54'}
          for a,b in repl.items():s=s.replace(a,b)
          s += '\n\n/* Dark related cards retain light secondary copy. */\n.stp-related small{color:#c6d7d3}\n'
          p.write_text(s)
          PY
          node --check odstupne.js
      - name: Install QA
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/rvqa" puppeteer-core@24.16.0 lighthouse@13.4.1
      - name: Browser correctness responsive and UX gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          sleep 1
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml,subprocess,os
          y=yaml.safe_load(Path('.github/workflows/odstupne-final-v3.yml').read_text())
          by={s.get('name'):s.get('run') for s in y['jobs']['final-v3']['steps'] if s.get('name')}
          subprocess.run(['bash','-lc',by['Deep browser correctness mobile and UX gate'].replace("python -m http.server 8765 --bind 127.0.0.1 > \"$RUNNER_TEMP/server.log\" 2>&1 & sleep 1\n",'')],check=True,env=os.environ.copy())
          PY
      - name: Lighthouse Gold gate
        shell: bash
        run: |
          set -euo pipefail
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');let fail=false;
          for(const n of ['mobile','desktop']){const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+n+'.json'));const s=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));const lcp=Math.round(x.audits['largest-contentful-paint']?.numericValue||0);const tbt=Math.round(x.audits['total-blocking-time']?.numericValue||0);const cls=x.audits['cumulative-layout-shift']?.numericValue||0;console.log(n.toUpperCase(),s,'LCP',lcp,'TBT',tbt,'CLS',cls);if(s.performance<98||s.accessibility<100||s['best-practices']<100||s.seo<100){fail=true;for(const r of x.categories.accessibility.auditRefs||[]){const a=x.audits[r.id];if(a&&a.score!==1&&a.score!==null)console.log('A11Y_FAIL',n,r.id,a.score,a.title,JSON.stringify(a.details||{}).slice(0,16000));}}}
          if(fail)process.exit(1);
          NODE
      - name: Build exact preview and screenshots
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml,subprocess,os
          y=yaml.safe_load(Path('.github/workflows/odstupne-final-v3.yml').read_text())
          by={s.get('name'):s.get('run') for s in y['jobs']['final-v3']['steps'] if s.get('name')}
          subprocess.run(['bash','-lc',by['Build exact preview and screenshots']],check=True,env=os.environ.copy())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: odstupne-gold-v7-final-preview
          path: |
            RV_ODSTUPNE_GOLD_LIVE_PREVIEW.html
            candidate-*.png
            ${{ runner.temp }}/mobile.json
            ${{ runner.temp }}/desktop.json
          retention-days: 30
      - name: Commit only verified production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/odstupne-baseline.yml .github/workflows/odstupne-gold-build.yml .github/workflows/odstupne-diagnostic.yml .github/workflows/odstupne-gold-fix.yml .github/workflows/odstupne-run-final.yml .github/workflows/odstupne-a11y-diagnostic.yml .github/workflows/odstupne-final-v3.yml .github/workflows/odstupne-final-v4.yml .github/workflows/odstupne-final-v5.yml
          git add -A .github/workflows odstupne-kalkulacka.html odstupne-kalkulacka.css odstupne.js
          git commit -m 'Upgrade severance calculator to Gold V7'
          git push origin HEAD:upgrade/odstupne-v7
