name: Vacation pay complete redesign rerun
on:
  push:
    branches: [upgrade/nahrada-dovolena-complete-redesign-v7]
    paths: [.github/workflows/nahrada-dovolena-redesign-rerun.yml]
permissions:
  contents: write
jobs:
  gold-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/nahrada-dovolena-complete-redesign-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run corrected complete redesign gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re,subprocess,os,yaml
          for stem,target in [
            ('html','nahrada-mzdy-za-dovolenou-kalkulacka.html'),
            ('css','nahrada-dovolena-pro.css'),
            ('js','nahrada-dovolena.js')
          ]:
            payload=''.join(p.read_text().strip() for p in sorted(Path('.vacstage').glob(stem+'-*.txt')))
            Path(target).write_bytes(gzip.decompress(base64.b64decode(payload)))
          subprocess.run(['node','--check','nahrada-dovolena.js'],check=True)
          h=Path('nahrada-mzdy-za-dovolenou-kalkulacka.html').read_text()
          j=Path('nahrada-dovolena.js').read_text()
          ids=set(re.findall(r'id="([^"]+)"',h)); refs=set(re.findall(r'\$\("([^"]+)"\)',j))
          miss=sorted(refs-ids); dup=sorted(x for x in ids if h.count('id="'+x+'"')>1)
          print('JS_IDS',len(refs),'MISSING',miss,'DUP',dup)
          if miss or dup: raise SystemExit(1)
          assert 'KALKULAČKA NÁHRADY ZA DOVOLENOU 2026' in h
          assert '/logo-rv-v32.svg?v=1' in h
          assert 'value="265"' not in h and 'value="16"' not in h
          wf=yaml.safe_load(Path('.github/workflows/nahrada-dovolena-redesign-gate.yml').read_text())
          steps={s.get('name'):s.get('run') for s in wf['jobs']['gold-gate']['steps'] if s.get('name') and s.get('run')}
          for name in ['Install isolated QA','Browser correctness responsive UX and Lighthouse gate']:
            print('\n### '+name,flush=True)
            subprocess.run(['bash','-lc',steps[name]],check=True,env=os.environ.copy())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vacation-pay-complete-redesign
          path: |
            RV_NAHRADA_DOVOLENA_GOLD_LIVE_PREVIEW.html
            vac-*.png
            vac-*.jpg
            ${{ runner.temp }}/mobile.json
            ${{ runner.temp }}/desktop.json
          retention-days: 30
      - name: Commit only verified redesign
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .vacstage
          rm -f .github/workflows/nahrada-dovolena-redesign-gate.yml .github/workflows/nahrada-dovolena-redesign-rerun.yml
          git add -A .vacstage .github/workflows/nahrada-dovolena-redesign-gate.yml .github/workflows/nahrada-dovolena-redesign-rerun.yml nahrada-mzdy-za-dovolenou-kalkulacka.html nahrada-dovolena-pro.css nahrada-dovolena.js
          git commit -m 'Completely redesign vacation pay calculator Gold V7'
          git push origin HEAD:upgrade/nahrada-dovolena-complete-redesign-v7
