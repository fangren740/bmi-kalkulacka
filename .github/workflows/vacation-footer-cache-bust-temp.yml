name: Vacation footer CSS cache-bust hotfix
on:
  push:
    branches: [hotfix/vacation-footer-css-cache-v32]
    paths: ['.github/workflows/vacation-footer-cache-bust-temp.yml']
permissions:
  contents: write
jobs:
  cache-bust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/vacation-footer-css-cache-v32
          fetch-depth: 0
      - name: Pin V32 footer CSS to fresh version without changing calculations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          html=Path('nahrada-mzdy-za-dovolenou-kalkulacka.html')
          css=Path('nahrada-dovolena-pro.css')
          logo=Path('logo-rv-v32-footer-color.svg')
          assert hashlib.sha256(html.read_bytes()).hexdigest()=='a5709977652a09c408889786a9e4b3150391845cb3f2b031af3fbc26a6881a82'
          assert hashlib.sha256(css.read_bytes()).hexdigest()=='c73097ac26bc4dd0bff9a514094e298d335fc47073dca6cd06b363630ef9537e'
          assert hashlib.sha256(logo.read_bytes()).hexdigest()=='99a95ff991c0bc011900ac22b90bee1e6fceacdb391d461e1ca7d8b9fb934975'
          s=html.read_text();old='nahrada-dovolena-pro.css?v=20260916-review2';new='nahrada-dovolena-pro.css?v=20260916-review2-footerfix1'
          assert s.count(old)==1
          html.write_text(s.replace(old,new))
          assert hashlib.sha256(html.read_bytes()).hexdigest()=='6fdb880c7d262a567153db7953d7244a41f6fed17346966a610a7700de149877'
          assert 'logo-rv-v32-footer-color.svg?v=20260916-1' in html.read_text()
          assert 'filter:none' in css.read_text()
          print('FOOTER_CSS_CACHE_BUST_EXACT_BYTES_PASS')
          PY
          git diff --check
      - name: Commit only HTML cache bust and remove temporary gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/vacation-footer-cache-bust-temp.yml
          git add -A .github/workflows/vacation-footer-cache-bust-temp.yml nahrada-mzdy-za-dovolenou-kalkulacka.html
          git diff --cached --check
          git commit -m 'Bust cached vacation CSS after footer V32 color fix'
          git push origin HEAD:hotfix/vacation-footer-css-cache-v32
          test "$(git diff --name-only origin/main...HEAD)" = 'nahrada-mzdy-za-dovolenou-kalkulacka.html'
