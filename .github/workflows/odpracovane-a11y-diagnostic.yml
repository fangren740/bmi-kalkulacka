name: RV worked-hours accessibility diagnostic
on:
  push:
    branches: [upgrade/odpracovane-hodiny-v7]
    paths: [.github/workflows/odpracovane-a11y-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odpracovane-hodiny-v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          for src,dst in {'.rv_tmp/wh_html.gz.b64':'kalkulacka-odpracovanych-hodin.html','.rv_tmp/wh_css.gz.b64':'odpracovane-hodiny.css','.rv_tmp/wh_js.gz.b64':'odpracovane-hodiny.js'}.items():
              s=''.join(Path(src).read_text().split()); s += '='*((4-len(s)%4)%4)
              Path(dst).write_bytes(gzip.decompress(base64.b64decode(s,validate=False)))
          PY
      - name: Run Lighthouse and print failing accessibility audits
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rvqa" lighthouse@13.4.1
          python -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=accessibility
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/mobile.json','utf8'));
          console.log('ACCESSIBILITY_SCORE',Math.round(x.categories.accessibility.score*100));
          const refs=x.categories.accessibility.auditRefs.filter(r=>r.weight>0);
          for(const r of refs){
            const a=x.audits[r.id];
            if(a && a.score!==null && a.score<1){
              console.log('A11Y_FAIL',r.id,'weight='+r.weight,'score='+a.score);
              console.log('TITLE',a.title);
              console.log('DESC',a.description);
              if(a.details?.items) console.log('ITEMS',JSON.stringify(a.details.items.slice(0,10)));
            }
          }
          NODE
