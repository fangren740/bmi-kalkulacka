name: RV worked-hours Gold final gate v4
on:
  push:
    branches: [upgrade/odpracovane-hodiny-v7]
    paths: [.github/workflows/odpracovane-gold-final-v4.yml]
permissions:
  contents: write
jobs:
  final-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odpracovane-hodiny-v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize exact candidate and apply a11y fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          mapping={'.rv_tmp/wh_html.gz.b64':'kalkulacka-odpracovanych-hodin.html','.rv_tmp/wh_css.gz.b64':'odpracovane-hodiny.css','.rv_tmp/wh_js.gz.b64':'odpracovane-hodiny.js'}
          for src,dst in mapping.items():
              s=''.join(Path(src).read_text().split()); s += '='*((4-len(s)%4)%4); Path(dst).write_bytes(gzip.decompress(base64.b64decode(s,validate=False)))
          p=Path('odpracovane-hodiny.css'); s=p.read_text()
          repl={
            '--wh-green2:#218431':'--wh-green2:#1b762c',
            '--wh-muted:#60768a':'--wh-muted:#566f83',
            'color:#60778a;font-weight:900':'color:#526b7e;font-weight:900',
            'background:#f7fbfd;color:#63798a':'background:#f7fbfd;color:#526b7e',
            '.wh-inline-audit>span{font-size:.67rem':'.wh-inline-audit>span{font-size:.7rem',
            'color:#718697;font-size:.6rem':'color:#526b7e;font-size:.68rem',
            'color:#748797;font-size:.59rem':'color:#526b7e;font-size:.67rem',
            'color:#718697;font-size:.61rem':'color:#526b7e;font-size:.65rem',
            'color:#fff;border-radius:13px':'color:#fff!important;border-radius:13px',
            '.wh-source-links a{color:var(--wh-blue);font-size:.66rem':'.wh-source-links a{display:flex;align-items:center;min-height:32px;color:var(--wh-blue);font-size:.7rem',
            '.wh-guide-note span{display:block;color:#708496;font-size:.61rem':'.wh-guide-note span{display:block;color:#526b7e;font-size:.68rem',
          }
          for a,b in repl.items():
              if a not in s: raise SystemExit('Missing expected CSS token: '+a)
              s=s.replace(a,b)
          p.write_text(s)
          PY
          node --check odpracovane-hodiny.js
          grep -q 'MPSV ověřeno 15. 9. 2026' kalkulacka-odpracovanych-hodin.html
          grep -q 'DOCHÁZKOVÁ KARTA' kalkulacka-odpracovanych-hodin.html
          grep -q 'logo-rv-v32.svg' kalkulacka-odpracovanych-hodin.html
          grep -q 'logo-rv-v32-inverse.svg' kalkulacka-odpracovanych-hodin.html
      - name: Install QA
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/rvqa" puppeteer-core@24.16.0 lighthouse@13.4.1
      - name: Browser regression QA
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 & sleep 1
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');
          (async()=>{const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const errs=[];
          for(const width of [1440,1280,1024,768,390,320]){const p=await b.newPage();p.on('pageerror',e=>errs.push(String(e)));p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});await p.setViewport({width,height:1000});await p.goto('http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html',{waitUntil:'networkidle0'});if(await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2))throw new Error('overflow '+width);if(await p.$eval('#resultTotal',e=>e.textContent.trim())!=='160 h')throw new Error('default '+width);if(await p.$eval('#heroShift',e=>e.textContent.trim())!=='8 h')throw new Error('hero shift '+width);
          if(width===390){await p.click('[data-preset="22:00|06:30|30"]');await p.$eval('#shiftCount',e=>{e.value='1';e.dispatchEvent(new Event('input',{bubbles:true}))});await p.$eval('#targetFund',e=>{e.value='';e.dispatchEvent(new Event('input',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.trim()==='8 h');const night=await p.$eval('#resultNight',e=>e.textContent.trim());if(!night.includes('7 h 30 min')||!night.includes('8 h'))throw new Error('night '+night);await p.$eval('#endTime',e=>{e.value='22:00';e.dispatchEvent(new Event('input',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.trim()==='—');await p.$eval('#endTime',e=>{e.value='11:00';e.dispatchEvent(new Event('input',{bubbles:true}))});await p.$eval('#startTime',e=>{e.value='22:00';e.dispatchEvent(new Event('input',{bubbles:true}))});await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.trim()!=='—');if(!(await p.$eval('#statusBadge',e=>e.textContent)).includes('délku směny'))throw new Error('long shift');await p.click('.wh-mode [data-mode="advanced"]');await p.waitForFunction(()=>document.body.dataset.mode==='advanced');await p.click('#loadShiftExample');if(await p.$eval('#resultTotal',e=>e.textContent.trim())==='—')throw new Error('advanced');await p.click('#addShiftBlock');if((await p.$$eval('.shift-block',e=>e.length))<4)throw new Error('add block');await p.click('.shift-block:last-child .remove-block');}await p.close();}await b.close();if(errs.length)throw new Error(errs.join('\n'));console.log('WORKED_HOURS_GOLD_BROWSER_QA_PASS');})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Lighthouse Gold gate
        shell: bash
        run: |
          set -euo pipefail
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$LH" 'http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');for(const n of ['mobile','desktop']){const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+n+'.json'));const s=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));console.log(n.toUpperCase(),s);if(s.performance<98||s.accessibility<100||s['best-practices']<100||s.seo<100)process.exit(1);}
          NODE
      - name: Build exact live preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re
          h=Path('kalkulacka-odpracovanych-hodin.html').read_text();css='\n'.join(Path(p).read_text() for p in ['rv-brand-v32.css','rv-social-links.css','odpracovane-hodiny.css']);js=Path('odpracovane-hodiny.js').read_text();h=re.sub(r'<link rel="stylesheet" href="/rv-brand-v32.css[^>]*>\s*','',h);h=re.sub(r'<link rel="stylesheet" href="/rv-social-links.css[^>]*>\s*','',h);h=re.sub(r'<link rel="stylesheet" href="/odpracovane-hodiny.css[^>]*>',lambda m:'<style>'+css+'</style>',h);h=re.sub(r'<script src="/odpracovane-hodiny.js[^>]*></script>',lambda m:'<script>'+js+'</script>',h)
          for name in ['logo-rv-v32.svg','logo-rv-v32-inverse.svg','favicon-rv-v32.svg']:
              data=base64.b64encode(Path(name).read_bytes()).decode();h=re.sub(r'/'+re.escape(name)+r'(?:\?v=1)?',lambda m:'data:image/svg+xml;base64,'+data,h)
          Path('RV_ODPRACOVANE_HODINY_GOLD_LIVE_PREVIEW.html').write_text(h)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: worked-hours-gold-final-preview
          path: RV_ODPRACOVANE_HODINY_GOLD_LIVE_PREVIEW.html
          retention-days: 30
      - name: Commit verified candidate and clean one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/odpracovane-gold-final-v4.yml .github/workflows/odpracovane-gold-final-v3.yml .github/workflows/odpracovane-gold-final.yml .github/workflows/odpracovane-gold-rebuild.yml .github/workflows/odpracovane-a11y-diagnostic.yml .github/workflows/odpracovane-a11y-desktop.yml .rv_tmp/wh_html.gz.b64 .rv_tmp/wh_css.gz.b64 .rv_tmp/wh_css2.gz.b64 .rv_tmp/wh_js.gz.b64
          git add kalkulacka-odpracovanych-hodin.html odpracovane-hodiny.css odpracovane-hodiny.js
          git commit -m 'Rebuild worked-hours calculator as Gold V7 product'
          git push origin HEAD:upgrade/odpracovane-hodiny-v7
