name: Tapety panel spacing hotfix

on:
  push:
    branches:
      - hotfix/tapety-panel-spacing

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused layout polish
        run: |
          cat >> tapety.css <<'EOF'

          /* 2026-09-10: focused panel spacing polish after live visual review */
          .rv-tp-panel{padding-top:16px}
          .rv-tp-panel-copy{margin-top:0;margin-bottom:20px}
          .rv-tp-panel-roll .rv-tp-roll-visual{display:none}
          @media (max-width:600px){.rv-tp-panel{padding-top:14px}}
          EOF

      - name: Run repo gates
        run: |
          python .github/scripts/audit_static_site.py --root . --config audits/audit-config.json --check-js --json-out /tmp/rv-static.json
          python rv-vnext-progress-audit.py --root . --json-out /tmp/rv-tracking.json
          python rv-vnext-a11y-lint.py --all-vnext
          python .github/scripts/vnext_inventory.py --check

      - name: Remove one-off workflow and commit
        run: |
          git rm .github/workflows/tapety-panel-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tapety.css
          git diff --cached --check
          git commit -m "Polish tapety input panel spacing"
          git push origin HEAD:${GITHUB_REF_NAME}
