name: Odstupne first-use UX final
on:
  push:
    branches: [upgrade/odstupne-complete-redesign-v7]
    paths: [.github/workflows/odstupne-ux-final.yml]
permissions:
  contents: write
jobs:
  ux-final:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odstupne-complete-redesign-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply first-use UX hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('odstupne-kalkulacka.html')
          h=p.read_text()
          replacements=[
            ('<p class="sev-overline"><span>PRACOVNÍ POMĚR / VÝSTUPNÍ PROTOKOL</span><b>ověřeno 15. 9. 2026</b></p>', '<p class="sev-overline"><span>KALKULAČKA ODSTUPNÉHO 2026 / VÝSTUPNÍ PROTOKOL</span><b>ověřeno 15. 9. 2026</b></p>'),
            ('<p class="sev-lead">Odstupné není jedna univerzální násobilka. Důvod skončení rozhoduje, zda jde o zákonné odstupné, dvanáctinásobnou náhradu, nebo žádný zákonný nárok. Kalkulačka vás proto vede stejným pořadím jako kontrola dokumentů.</p>', '<p class="sev-lead">Odpovězte na tři otázky — proč pracovní poměr končí, jaký máte průměrný výdělek a jak dlouho pracovní poměr trval. Výsledek ukáže nárok, zákonný násobek i orientační částku.</p>'),
            ('<div class="sev-dossier__head"><span>SPIS 2026 / SKONČENÍ PRACOVNÍHO POMĚRU</span><b id="heroMode">Basic</b></div>', '<div class="sev-dossier__head"><span>VÁŠ VÝSLEDEK / 3 KROKY</span><b id="heroMode">RYCHLE</b></div>'),
            ('<div class="sev-dossier__stamp"><span id="heroType">Zákonné odstupné</span><strong id="heroAmount">84 000 Kč</strong><small id="heroTitle">2× průměrného výdělku</small></div>', '<div class="sev-dossier__stamp"><span id="heroType">Výsledek po 3 odpovědích</span><strong id="heroAmount">Čeká na údaje</strong><small id="heroTitle">Důvod → výdělek → délka poměru</small></div>'),
            ('<div><dt>Průměrný výdělek</dt><dd id="heroAverage">42 000 Kč</dd></div>', '<div><dt>Průměrný výdělek</dt><dd id="heroAverage">—</dd></div>'),
            ('<div><dt>Délka poměru</dt><dd id="heroDuration">1–2 roky</dd></div>', '<div><dt>Délka poměru</dt><dd id="heroDuration">—</dd></div>'),
            ('<div><dt>Výsledný násobek</dt><dd id="heroMultiplier">2×</dd></div>', '<div><dt>Výsledný násobek</dt><dd id="heroMultiplier">—</dd></div>'),
            ('<div class="sev-workspace__intro"><div><p class="sev-eyebrow">Kalkulačka odstupného</p><h2>Vyřešte nejdřív nárok. Částka přijde sama.</h2></div><p>Rychlý režim chce tři odpovědi. Kontrola dokumentů přidává návazné zaměstnání, konto pracovní doby, vyšší firemní plnění, finanční rezervu a model návratu.</p></div>', '<div class="sev-workspace__intro"><div><p class="sev-eyebrow">Kalkulačka odstupného</p><h2>Zjistěte nárok a výši odstupného ve 3 krocích.</h2></div><p>Začněte důvodem skončení, potom zadejte průměrný výdělek a délku pracovního poměru. Nic předem nepočítáme z cizích ukázkových hodnot.</p></div><ol class="sev-quicksteps" aria-label="Tři kroky rychlého výpočtu"><li><span>1</span><div><strong>Proč končíte</strong><small>vyberte skutečný důvod</small></div></li><li><span>2</span><div><strong>Průměrný výdělek</strong><small>zadejte vlastní částku</small></div></li><li><span>3</span><div><strong>Délka poměru</strong><small>zvolte odpovídající dobu</small></div></li></ol>'),
            ('<span>RYCHLÝ ODHAD</span><small>3 rozhodnutí</small>', '<span>RYCHLÝ VÝPOČET</span><small>3 jednoduché kroky</small>'),
            ('value="organizational" checked', 'value="organizational"'),
            ('<strong>Nejvyšší přípustná expozice</strong><small>Zvláštní zákonné odstupné při splnění konkrétních podmínek.</small>', '<strong>Práce se zdravotním rizikem</strong><small>Dosáhli jste nejvyšší přípustné expozice na pracovišti (§ 67 odst. 3).</small>'),
            ('id="basicEarnings" type="text" inputmode="decimal" value="42000"', 'id="basicEarnings" type="text" inputmode="decimal" value="" placeholder="např. 42 000"'),
            ('name="basicDuration" value="1to2" checked', 'name="basicDuration" value="1to2"'),
            ('id="proEarnings" type="text" inputmode="decimal" value="42000"', 'id="proEarnings" type="text" inputmode="decimal" value="" placeholder="např. 42 000"'),
            ('<select id="proReason"><option value="organizational">Organizační důvod · § 52 a–c</option><option value="exposure">Nejvyšší přípustná expozice</option>', '<select id="proReason"><option value="">Vyberte důvod…</option><option value="organizational">Organizační důvod · § 52 a–c</option><option value="exposure">Práce se zdravotním rizikem · § 67 odst. 3</option>'),
            ('id="proCurrentMonths" type="text" inputmode="numeric" value="18"', 'id="proCurrentMonths" type="text" inputmode="numeric" value="" placeholder="např. 18"'),
            ('<div class="sev-verdict__head"><p><span>VÝSLEDEK / VERDIKT</span><b id="modeStatus">Basic výpočet</b></p><strong id="resultType">Zákonné odstupné</strong></div>', '<div class="sev-verdict__head"><p><span>VÝSLEDEK / VERDIKT</span><b id="modeStatus">Rychlý výpočet</b></p><strong id="resultType">Čeká na vaše údaje</strong></div>'),
            ('<div class="sev-verdict__amount"><output id="resultTotal">84 000 Kč</output><span id="resultMultiplier">2× průměrného výdělku</span></div>', '<div class="sev-verdict__amount"><output id="resultTotal">— Kč</output><span id="resultMultiplier">Vyplňte 3 kroky vlevo</span></div>'),
            ('<p><span>Zákonné minimum</span><b id="resultMinimum">2×</b></p>', '<p><span>Zákonné minimum</span><b id="resultMinimum">—</b></p>'),
            ('<div class="sev-verdict__sentence"><strong id="resultStatus">Organizační důvod</strong><p id="resultStatusText">Při pracovním poměru trvajícím alespoň jeden rok a méně než dva roky vychází zákonné minimum ve výši dvojnásobku.</p><span id="resultTax">zdanění ano · pojistné obvykle ne</span></div>', '<div class="sev-verdict__sentence"><strong id="resultStatus">Začněte důvodem skončení</strong><p id="resultStatusText">Po zodpovězení tří kroků se zde zobrazí váš výsledek a vysvětlení.</p><span id="resultTax">bez výpočtu z ukázkových hodnot</span></div>'),
            ('<div><dt>Výdělek</dt><dd id="resultAverage">42 000 Kč</dd>', '<div><dt>Výdělek</dt><dd id="resultAverage">—</dd>'),
            ('<div><dt>Zákonný násobek</dt><dd id="resultLegal">2×</dd>', '<div><dt>Zákonný násobek</dt><dd id="resultLegal">—</dd>'),
            ('id="resultDuration">1–2 roky</dd>', 'id="resultDuration">—</dd>'),
            ('<div class="sev-form-actions"><button class="sev-action sev-action--primary" type="submit">Přepočítat výsledek</button>', '<div class="sev-form-actions"><button class="sev-action sev-action--primary" type="submit">Spočítat výsledek</button>')
          ]
          for a,b in replacements:
            if a not in h:
              raise SystemExit('missing HTML target: '+a[:120])
            h=h.replace(a,b,1)
          p.write_text(h)

          p=Path('odstupne.js')
          j=p.read_text()
          j=j.replace('const duration = selected("basicDuration") || "1to2";', 'const duration = selected("basicDuration");')
          j=j.replace('reason: selected("basicReason") || "organizational",', 'reason: selected("basicReason"),')
          old='''  function run() {\n    render(calculate(mode === "pro" ? getProInput() : getBasicInput()));\n  }\n'''
          new='''  function completionState() {\n    if (mode === "basic") {\n      const reason = selected("basicReason");\n      const earnings = parseNumber($("basicEarnings").value);\n      const duration = selected("basicDuration");\n      if (!reason) return { complete: false, next: "1. Vyberte důvod skončení pracovního poměru." };\n      if (!(earnings > 0)) return { complete: false, next: "2. Zadejte svůj průměrný měsíční výdělek." };\n      if (!duration) return { complete: false, next: "3. Vyberte délku pracovního poměru." };\n      return { complete: true, next: "" };\n    }\n    const reason = $("proReason").value;\n    const earnings = parseNumber($("proEarnings").value);\n    const currentMonths = parseNumber($("proCurrentMonths").value);\n    if (!reason) return { complete: false, next: "Vyberte právní důvod skončení." };\n    if (!(earnings > 0)) return { complete: false, next: "Zadejte svůj průměrný měsíční výdělek." };\n    if (!(currentMonths > 0)) return { complete: false, next: "Zadejte délku současného pracovního poměru." };\n    return { complete: true, next: "" };\n  }\n\n  function renderIdle(next) {\n    lastResult = null;\n    document.body.dataset.mode = mode;\n    document.body.dataset.resultState = "idle";\n    $("modeStatus").textContent = mode === "pro" ? "Kontrola dokumentů" : "Rychlý výpočet";\n    $("heroMode").textContent = mode === "pro" ? "PRO" : "RYCHLE";\n    $("heroType").textContent = "Výsledek po vyplnění";\n    $("heroAmount").textContent = "Čeká na údaje";\n    $("heroTitle").textContent = next || "Důvod → výdělek → délka poměru";\n    $("heroAverage").textContent = "—";\n    $("heroDuration").textContent = "—";\n    $("heroMultiplier").textContent = "—";\n    $("heroBar").style.width = "0%";\n    $("resultType").textContent = "Čeká na vaše údaje";\n    $("resultTotal").textContent = "— Kč";\n    $("resultMultiplier").textContent = next || "Vyplňte požadované kroky vlevo";\n    $("resultMinimum").textContent = "—";\n    $("resultBar").style.width = "0%";\n    $("resultAverage").textContent = "—";\n    $("resultLegal").textContent = "—";\n    $("resultDuration").textContent = "—";\n    $("resultExtra").textContent = "—";\n    $("resultRunway").textContent = "—";\n    $("resultStatus").textContent = next || "Začněte důvodem skončení";\n    $("resultStatusText").textContent = "Výsledek počítáme až z vašich údajů — nepoužíváme předvyplněný ukázkový nárok.";\n    $("resultTax").textContent = "výsledek se zobrazí po vyplnění";\n    $("readingTitle").textContent = "Kontrolní list se doplní po výpočtu.";\n    $("readingText").textContent = next || "Vyplňte požadované údaje v kalkulačce.";\n    $("decisionType").textContent = "—";\n    $("decisionMultiplier").textContent = "—";\n    $("decisionAmount").textContent = "—";\n    $("summaryTableBody").innerHTML = '<tr><td colspan="3">Výpočet čeká na vaše údaje.</td></tr>';\n    renderScenarios(0);\n    $("repaymentBox").hidden = true;\n  }\n\n  function run() {\n    const state = completionState();\n    if (!state.complete) {\n      renderIdle(state.next);\n      return;\n    }\n    document.body.dataset.resultState = "ready";\n    render(calculate(mode === "pro" ? getProInput() : getBasicInput()));\n  }\n'''
          if old not in j: raise SystemExit('missing run block')
          j=j.replace(old,new,1)
          old='''    if (isPro && options && options.copyBasic) copyBasicToPro();\n    run();\n'''
          new='''    if (isPro && options && options.copyBasic) copyBasicToPro();\n    if (options && options.silent) renderIdle(completionState().next);\n    else run();\n'''
          if old not in j: raise SystemExit('missing setMode block')
          j=j.replace(old,new,1)
          old='''  function copyBasicToPro() {\n    const basic = getBasicInput();\n    $("proEarnings").value = Math.round(basic.earnings);\n    $("proReason").value = basic.reason;\n    $("proCurrentMonths").value = basic.duration === "under1" ? 8 : basic.duration === "1to2" ? 18 : 30;\n    $("proPreviousEligible").checked = false;\n'''
          new='''  function copyBasicToPro() {\n    const basic = getBasicInput();\n    if (basic.earnings > 0) $("proEarnings").value = Math.round(basic.earnings);\n    if (basic.reason) $("proReason").value = basic.reason;\n    if (basic.duration) $("proCurrentMonths").value = basic.duration === "under1" ? 8 : basic.duration === "1to2" ? 18 : 30;\n    $("proPreviousEligible").checked = false;\n'''
          if old not in j: raise SystemExit('missing copy block')
          j=j.replace(old,new,1)
          old='''  function resetBasic() {\n    $("basicEarnings").value = "42000";\n    form.querySelector('input[name="basicReason"][value="organizational"]').checked = true;\n    form.querySelector('input[name="basicDuration"][value="1to2"]').checked = true;\n    run();\n  }\n'''
          new='''  function resetBasic() {\n    $("basicEarnings").value = "";\n    form.querySelectorAll('input[name="basicReason"],input[name="basicDuration"]').forEach((input) => { input.checked = false; });\n    run();\n  }\n'''
          if old not in j: raise SystemExit('missing reset basic')
          j=j.replace(old,new,1)
          old='''  function resetPro() {\n    $("proEarnings").value = "42000";\n    $("proReason").value = "organizational";\n    $("proCurrentMonths").value = "18";\n'''
          new='''  function resetPro() {\n    $("proEarnings").value = "";\n    $("proReason").value = "";\n    $("proCurrentMonths").value = "";\n'''
          if old not in j: raise SystemExit('missing reset pro')
          j=j.replace(old,new,1)
          j=j.replace('  setMode("basic");\n})();', '  setMode("basic", { silent: true });\n})();')
          p.write_text(j)

          with Path('odstupne-kalkulacka.css').open('a') as f:
            f.write('''\n\n/* Gold V7 first-use UX: three explicit steps and a neutral pre-calculation state. */\n.sev-quicksteps{list-style:none;margin:0 0 24px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.sev-quicksteps li{display:flex;align-items:center;gap:10px;min-width:0;padding:11px 13px;border:1px solid rgba(8,47,54,.13);background:#fff;border-radius:14px}\n.sev-quicksteps li>span{display:grid;place-items:center;flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:#0b4a50;color:#fff;font-weight:800;font-size:.78rem}\n.sev-quicksteps strong,.sev-quicksteps small{display:block}.sev-quicksteps strong{color:#12343d;font-size:.82rem}.sev-quicksteps small{margin-top:2px;color:#536965;font-size:.7rem}\nbody[data-result-state="idle"] .sev-dossier__stamp strong{font-size:clamp(1.55rem,3vw,2.45rem);letter-spacing:-.035em}\nbody[data-result-state="idle"] .sev-verdict{outline:1px dashed rgba(8,47,54,.18);outline-offset:-1px}\nbody[data-result-state="idle"] .sev-verdict__amount output{font-size:clamp(2rem,5vw,3.6rem)}\n@media(max-width:700px){.sev-quicksteps{grid-template-columns:1fr;gap:7px;margin-bottom:18px}.sev-quicksteps li{padding:9px 11px}.sev-quicksteps li>span{width:28px;height:28px;flex-basis:28px}}\n''')
          PY
          node --check odstupne.js
      - name: Install QA
        run: npm install --prefix "$RUNNER_TEMP/rvqa" puppeteer-core@24.16.0 lighthouse@13.4.1
      - name: Browser correctness and first-use UX gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 1
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');
          (async()=>{const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          for(const width of [1440,1280,1024,768,430,390,360,320]){const p=await b.newPage();await p.setViewport({width,height:1000});const errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto('http://127.0.0.1:8765/odstupne-kalkulacka.html',{waitUntil:'networkidle0'});
            const init=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,hero:heroAmount.textContent.trim(),total:resultTotal.textContent.trim(),earnings:basicEarnings.value,reason:document.querySelector('input[name="basicReason"]:checked')?.value||'',duration:document.querySelector('input[name="basicDuration"]:checked')?.value||'',overline:document.querySelector('.sev-overline span').textContent.trim(),steps:document.querySelectorAll('.sev-quicksteps li').length,toolTop:Math.round(kalkulacka.getBoundingClientRect().top+scrollY)}));
            console.log('INIT',width,init); if(init.overflow)throw Error('overflow '+width); if(init.hero!=='Čeká na údaje'||init.total.replace(/\s/g,'')!=='—Kč')throw Error('idle result '+width); if(init.earnings||init.reason||init.duration)throw Error('prefilled personal data '+width); if(!init.overline.includes('KALKULAČKA ODSTUPNÉHO 2026')||init.steps!==3)throw Error('first use copy '+width); if(width<=390&&init.toolTop>900)throw Error('tool too low '+width+' '+init.toolTop);
            if(width===390){const radio=async(n,v)=>p.$eval(`input[name="${n}"][value="${v}"]`,e=>{e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}))});await radio('basicReason','organizational');if((await p.$eval('#resultTotal',e=>e.textContent.trim()))!=='— Kč')throw Error('calculated too early after reason');await p.$eval('#basicEarnings',e=>{e.value='42000';e.dispatchEvent(new Event('input',{bubbles:true}))});if((await p.$eval('#resultTotal',e=>e.textContent.trim()))!=='— Kč')throw Error('calculated too early after earnings');await radio('basicDuration','1to2');await p.waitForFunction(()=>resultTotal.textContent.replace(/\s/g,'')==='84000Kč');await radio('basicReason','exposure');await p.waitForFunction(()=>resultTotal.textContent.replace(/\s/g,'')==='504000Kč');if(decisionType.textContent.trim()!=='§ 67 odst. 3')throw Error('exposure basis');await p.click('#resetBasic');await p.waitForFunction(()=>resultTotal.textContent.replace(/\s/g,'')==='—Kč'&&!basicEarnings.value&&!document.querySelector('input[name="basicReason"]:checked'));}
            if(errs.length)throw Error(errs.join('\n'));await p.close();}
          await b.close();console.log('FIRST_USE_UX_BROWSER_PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Lighthouse Gold gate
        shell: bash
        run: |
          set -euo pipefail
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');let fail=false;for(const n of ['mobile','desktop']){const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+n+'.json'));const s=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));console.log(n.toUpperCase(),s,'LCP',Math.round(x.audits['largest-contentful-paint'].numericValue),'TBT',Math.round(x.audits['total-blocking-time'].numericValue),'CLS',x.audits['cumulative-layout-shift'].numericValue);if(s.performance<98||s.accessibility<100||s['best-practices']<100||s.seo<100)fail=true;}if(fail)process.exit(1);
          NODE
      - name: Build preview and screenshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,base64
          h=Path('odstupne-kalkulacka.html').read_text();common='\n'.join(Path(x).read_text() for x in ['rv-brand-v32.css','rv-social-links.css']);page=Path('odstupne-kalkulacka.css').read_text();js=Path('odstupne.js').read_text()
          h=re.sub(r'<link rel="stylesheet" href="/rv-brand-v32.css[^>]*>\s*','',h);h=re.sub(r'<link rel="stylesheet" href="/rv-social-links.css[^>]*>\s*','',h);h=re.sub(r'<link rel="stylesheet" href="/odstupne-kalkulacka.css[^>]*>',lambda m:'<style>'+common+'\n'+page+'</style>',h);h=re.sub(r'<script src="/odstupne.js[^>]*></script>',lambda m:'<script>'+js+'</script>',h)
          for name in ['logo-rv-v32.svg','logo-rv-v32-inverse.svg','favicon-rv-v32.svg']:
            data=base64.b64encode(Path(name).read_bytes()).decode();h=re.sub(r'/'+re.escape(name)+r'(?:\?v=1)?',lambda m:'data:image/svg+xml;base64,'+data,h)
          Path('RV_ODSTUPNE_GOLD_UX_FINAL_LIVE_PREVIEW.html').write_text(h)
          PY
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');(async()=>{const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});for(const [n,w,h] of [['desktop',1440,1100],['mobile390',390,844],['mobile320',320,780]]){const p=await b.newPage();await p.setViewport({width:w,height:h});await p.goto('http://127.0.0.1:8765/odstupne-kalkulacka.html',{waitUntil:'networkidle0'});await p.screenshot({path:'ux-'+n+'-top.png'});await p.evaluate(()=>kalkulacka.scrollIntoView());await new Promise(r=>setTimeout(r,150));await p.screenshot({path:'ux-'+n+'-tool.png'});await p.close();}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: odstupne-gold-ux-final
          path: |
            RV_ODSTUPNE_GOLD_UX_FINAL_LIVE_PREVIEW.html
            ux-*.png
            ${{ runner.temp }}/mobile.json
            ${{ runner.temp }}/desktop.json
      - name: Commit verified UX only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/odstupne-ux-final.yml
          git add -A .github/workflows/odstupne-ux-final.yml odstupne-kalkulacka.html odstupne-kalkulacka.css odstupne.js
          git commit -m 'Polish severance calculator first-use UX'
          git push origin HEAD:upgrade/odstupne-complete-redesign-v7
