name: RV OSVČ 2026 – správnost finančního výsledku
on:
  pull_request:
    paths:
      - 'osvc-danova-kalkulacka.html'
      - 'osvc-dan-vnext.js'
      - 'osvc-dan-vnext.css'
      - '.github/scripts/osvc-dan-financial-smoke.cjs'
      - '.github/workflows/rv-osvc-financial-2026.yml'
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NODE_PATH: /tmp/rv-osvc-deps/node_modules
      RV_TARGET_BASE: http://127.0.0.1:8765
      RV_QA_OUTPUT: /tmp/rv-osvc-financial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check osvc-dan-vnext.js
          node --check .github/scripts/osvc-dan-financial-smoke.cjs
      - name: Install browser
        run: |
          npm install --prefix /tmp/rv-osvc-deps playwright@1.62.1
          /tmp/rv-osvc-deps/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve candidate
        run: python -m http.server 8765 --bind 127.0.0.1 >/tmp/rv-osvc-server.log 2>&1 &
      - name: Verify real calculation and human inputs
        run: node .github/scripts/osvc-dan-financial-smoke.cjs
      - name: Attach review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osvc-dan-2026-oprava-nahled
          path: /tmp/rv-osvc-financial
          if-no-files-found: warn
          retention-days: 21
