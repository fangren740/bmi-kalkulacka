name: RV worked-hours V7 copy polish gate
on:
  push:
    branches: ['upgrade/odpracovane-hodiny-v7']
    paths: ['.github/workflows/odpracovane-v7-copy-polish.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'upgrade/odpracovane-hodiny-v7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove duplicate night-pay sentence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kalkulacka-odpracovanych-hodin.html')
          s=p.read_text(encoding='utf-8')
          old='Přesný údaj zjistíte jen tehdy, když znáte skutečné umístění pauzy. Peněžní příplatek se na této stránce nepočítá.</p><p>Peněžní příplatek se nepočítá na této stránce.'
          new='Přesný údaj zjistíte jen tehdy, když znáte skutečné umístění pauzy.</p><p>Peněžní příplatek se nepočítá na této stránce.'
          if s.count(old) != 1:
              raise SystemExit(f'Expected duplicate sequence once, got {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check odpracovane-hodiny.js
          grep -q 'Ověřeno 14. 9. 2026' kalkulacka-odpracovanych-hodin.html
          grep -q '7 h 30 min–8 h' kalkulacka-odpracovanych-hodin.html
      - name: Lighthouse regression gate
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/rvqa" lighthouse@13.4.1
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 1
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$LH" 'http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');
          for (const name of ['mobile','desktop']) {
            const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+name+'.json','utf8'));
            const scores=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));
            console.log(name.toUpperCase(),scores);
            if(Object.values(scores).some(v=>v<100)) process.exit(1);
          }
          NODE
      - name: Build exact self-contained live preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re
          h=Path('kalkulacka-odpracovanych-hodin.html').read_text(encoding='utf-8')
          css='\n'.join(Path(p).read_text(encoding='utf-8') for p in ['rv-brand-v32.css','rv-social-links.css','odpracovane-hodiny.css'])
          js=Path('odpracovane-hodiny.js').read_text(encoding='utf-8')
          h=re.sub(r'<link rel="stylesheet" href="/rv-brand-v32.css[^>]*>\s*','',h)
          h=re.sub(r'<link rel="stylesheet" href="/rv-social-links.css[^>]*>\s*','',h)
          h=re.sub(r'<link rel="stylesheet" href="/odpracovane-hodiny.css[^>]*>',lambda m:'<style>'+css+'</style>',h)
          h=re.sub(r'<script src="/odpracovane-hodiny.js[^>]*></script>',lambda m:'<script>'+js+'</script>',h)
          for name in ['logo-rv-v32.svg','logo-rv-v32-inverse.svg','favicon-rv-v32.svg']:
            data=base64.b64encode(Path(name).read_bytes()).decode('ascii')
            h=re.sub(r'/'+re.escape(name)+r'(?:\?v=1)?',lambda m:'data:image/svg+xml;base64,'+data,h)
          Path('RV_ODPRACOVANE_HODINY_V7_LIVE_PREVIEW.html').write_text(h,encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: worked-hours-v7-live-preview-final
          path: RV_ODPRACOVANE_HODINY_V7_LIVE_PREVIEW.html
          retention-days: 30
      - name: Commit verified candidate and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/odpracovane-v7-copy-polish.yml
          git add kalkulacka-odpracovanych-hodin.html
          git commit -m 'Polish worked-hours night-method copy'
          git push origin HEAD:upgrade/odpracovane-hodiny-v7
