name: RV worked-hours V7 final gate
on:
  push:
    branches: ['upgrade/odpracovane-hodiny-v7']
    paths: ['.github/workflows/odpracovane-v7-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'upgrade/odpracovane-hodiny-v7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build candidate and close desktop contrast gate
        shell: bash
        run: |
          pip install -q pyyaml
          python - <<'PY'
          import yaml,subprocess
          from pathlib import Path
          data=yaml.safe_load(open('.github/workflows/odpracovane-v7-candidate.yml',encoding='utf-8'))
          step=next(s for s in data['jobs']['candidate']['steps'] if s.get('name')=='Apply focused V7 polish and correctness fixes')
          subprocess.run(['bash','-c',step['run']],check=True)
          p=Path('odpracovane-hodiny.css')
          c=p.read_text(encoding='utf-8')
          c += '\n.worked-hours-page .method-card-head b{color:#26475e}\n.worked-hours-page .source-fact>span,.worked-hours-page .source-fact>small{color:#526a7d}\n'
          p.write_text(c,encoding='utf-8')
          PY
          node --check odpracovane-hodiny.js
      - name: Install QA tools and serve
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/rvqa" lighthouse@13.4.1 puppeteer-core@24.16.0
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 1
      - name: Run functional and Lighthouse gates from candidate workflow
        shell: bash
        run: |
          python - <<'PY'
          import yaml,subprocess
          data=yaml.safe_load(open('.github/workflows/odpracovane-v7-candidate.yml',encoding='utf-8'))
          for name in ['Functional browser QA','Lighthouse candidate']:
              step=next(s for s in data['jobs']['candidate']['steps'] if s.get('name')==name)
              subprocess.run(['bash','-c',step['run']],check=True)
          PY
      - name: Build live preview
        shell: bash
        run: |
          python - <<'PY'
          import yaml,subprocess
          data=yaml.safe_load(open('.github/workflows/odpracovane-v7-candidate.yml',encoding='utf-8'))
          step=next(s for s in data['jobs']['candidate']['steps'] if s.get('name')=='Build self-contained live preview')
          subprocess.run(['bash','-c',step['run']],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: worked-hours-v7-live-preview
          path: RV_ODPRACOVANE_HODINY_V7_LIVE_PREVIEW.html
          retention-days: 30
      - name: Commit verified candidate only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/odpracovane-v7-candidate.yml .github/workflows/odpracovane-v7-a11y-diagnose.yml .github/workflows/odpracovane-v7-finalize.yml
          git add kalkulacka-odpracovanych-hodin.html odpracovane-hodiny.css odpracovane-hodiny.js
          git commit -m 'Polish worked-hours calculator for V7 finish gate'
          git push origin HEAD:upgrade/odpracovane-hodiny-v7
