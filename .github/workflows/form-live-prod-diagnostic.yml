name: Recipe form live production diagnostic

on:
  push:
    branches:
      - hotfix/prepocet-formy-add-ingredient-20260911

jobs:
  live-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/rv-browser" playwright@1.62.1
          "$RUNNER_TEMP/rv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Inspect clean direct live URL
        env:
          NODE_PATH: ${{ runner.temp }}/rv-browser/node_modules
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const context=await browser.newContext({viewport:{width:390,height:844}});
              const page=await context.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              const r=await page.goto('https://rychlevypocty.cz/prepocet-formy-na-peceni.html',{waitUntil:'networkidle'});
              console.log('STATUS',r.status());
              console.log('CACHE_CONTROL',r.headers()['cache-control']||'');
              console.log('AGE',r.headers()['age']||'');
              console.log('SCRIPT_SRCS',await page.locator('script[src]').evaluateAll(es=>es.map(e=>e.getAttribute('src'))));
              console.log('PAGE_ERRORS',errors);
              console.log('ROWS_BEFORE',await page.locator('#rows .ing-row').count());
              await page.locator('#addIng').click();
              console.log('ROWS_AFTER',await page.locator('#rows .ing-row').count());
              assert.equal(errors.length,0);
              assert.equal(await page.locator('#rows .ing-row').count(),7);
              console.log('DIRECT LIVE URL: PASS');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
