name: Vacation V2 postmerge live diagnostic
on:
  push:
    branches: [upgrade/nahrada-dovolena-review2-release]
    paths: ['.github/workflows/vacation-production-smoke-temporary.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Compare public delivered HTML with current main source and test assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,difflib
          root='https://rychlevypocty.cz/'
          files={'nahrada-mzdy-za-dovolenou-kalkulacka.html':'9ec047dd12a36a9a991d87c4b6ce0430a3755b6b7086f9bbb2296ed7da17a5de','nahrada-dovolena-pro.css':'b0e117e91c02d9d2fb2bb965ee88ac2782d1ec824d1ce6cc45896539140a0f71','nahrada-dovolena.js':'df7f7438bd54faca1fccd1af5a89b7773dd4c9ae8ba02b1cc8a0ad5f3f8466ee'}
          for filename,sha in files.items():
            source=Path(filename).read_bytes()
            url=root+filename+'?delivery-check=167502029bc48f4010ebca0b388b556aa8ee21f7'
            with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'}),timeout=20) as response:body=response.read();status=response.status
            print('FILE',filename,'http',status,'local_bytes',len(source),'remote_bytes',len(body),'local_sha',hashlib.sha256(source).hexdigest(),'remote_sha',hashlib.sha256(body).hexdigest(),'same',source==body,flush=True)
            assert hashlib.sha256(source).hexdigest()==sha,'unexpected main source change'
            if filename.endswith('.html'):
              print('MARKER_NEW',b'20260916-review2' in body,'MARKER_OLD',b'20260718-1' in body,flush=True)
              if source!=body:
                a=source.decode('utf8','replace').splitlines(keepends=True);b=body.decode('utf8','replace').splitlines(keepends=True)
                matcher=difflib.SequenceMatcher(None,a,b,autojunk=False)
                diffs=[(tag,i,j,k,l) for tag,i,j,k,l in matcher.get_opcodes() if tag!='equal']
                print('DIFF_COUNT',len(diffs),flush=True)
                for tag,i,j,k,l in diffs[:16]:
                  print('HTML_DIFF',tag,'source_lines',i+1,j,'remote_lines',k+1,l,flush=True)
                  for line in a[i:j][:3]:print('SOURCE_SNIP',repr(line[:240]),flush=True)
                  for line in b[k:l][:3]:print('REMOTE_SNIP',repr(line[:240]),flush=True)
              assert b'20260916-review2' in body and b'20260718-1' not in body
            else:assert source==body,'CSS or JS does not match approved V2'
          print('PUBLIC_V2_MARKER_AND_ASSETS_PASS',flush=True)
          PY