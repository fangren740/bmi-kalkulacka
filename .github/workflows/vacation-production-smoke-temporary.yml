name: Vacation V2 postmerge live smoke
on:
  push:
    branches: [upgrade/nahrada-dovolena-review2-release]
    paths: ['.github/workflows/vacation-production-smoke-temporary.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public domain version and assets
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,time,sys,re
          root='https://rychlevypocty.cz/'
          expected={
            'nahrada-mzdy-za-dovolenou-kalkulacka.html':'9ec047dd12a36a9a991d87c4b6ce0430a3755b6b7086f9bbb2296ed7da17a5de',
            'nahrada-dovolena-pro.css':'b0e117e91c02d9d2fb2bb965ee88ac2782d1ec824d1ce6cc45896539140a0f71',
            'nahrada-dovolena.js':'df7f7438bd54faca1fccd1af5a89b7773dd4c9ae8ba02b1cc8a0ad5f3f8466ee'
          }
          for attempt in range(1,7):
            print('PUBLIC_PROBE_ATTEMPT',attempt,flush=True)
            ok=True
            for filename,sha in expected.items():
              url=root+filename+'?v=20260916-review2&postmerge=1675020-'+str(attempt)
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 VacationPostMergeAudit/1.0'}),timeout=17) as resp:
                  body=resp.read();status=resp.status;final=resp.url
                actual=hashlib.sha256(body).hexdigest()
                match=actual==sha
                print('PUBLIC_ASSET',filename,'http',status,'bytes',len(body),'sha256',actual,'exact_match',match,'final',final,flush=True)
                if filename.endswith('.html'):
                  print('V2_MARKER','20260916-review2' in body.decode('utf-8','replace'),'OLD_MARKER','20260718-1' in body.decode('utf-8','replace'),flush=True)
                  if b'20260916-review2' not in body:match=False
                ok=ok and match
              except Exception as exc:
                print('PUBLIC_ASSET_ERROR',filename,type(exc).__name__,str(exc),flush=True);ok=False
            if ok:
              print('PUBLIC_V2_EXACT_BYTES_PASS',flush=True);sys.exit(0)
            if attempt<6:time.sleep(8)
          print('PUBLIC_V2_SMOKE_FAIL',flush=True);sys.exit(1)
          PY