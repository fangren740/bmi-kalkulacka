name: Odstupne Gold V7 final v4
on:
  push:
    branches: [upgrade/odstupne-v7]
    paths: [.github/workflows/odstupne-final-v4.yml]
permissions:
  contents: write
jobs:
  final-v4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odstupne-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute final candidate QA
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml,subprocess,os
          y=yaml.safe_load(Path('.github/workflows/odstupne-final-v3.yml').read_text())
          by={s.get('name'):s.get('run') for s in y['jobs']['final-v3']['steps'] if s.get('name')}
          subprocess.run(['bash','-lc',by['Materialize candidate and harden contrast']],check=True,env=os.environ.copy())
          p=Path('odstupne-kalkulacka.css');s=p.read_text()
          repl={'#4d6b65':'#36544e','#3c6860':'#2f554e','#2c6d63':'#285c54','#397066':'#2f5b54','#2e6f65':'#285c54','#5d746d':'#435f59','#3a7066':'#2f5b54'}
          for a,b in repl.items():s=s.replace(a,b)
          p.write_text(s)
          for name in ['Install QA','Browser correctness responsive and UX gate','Lighthouse Gold gate with diagnostics','Build exact preview and screenshots']:
              print('\n###',name,flush=True)
              subprocess.run(['bash','-lc',by[name]],check=True,env=os.environ.copy())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: odstupne-gold-v7-approved-candidate
          path: |
            RV_ODSTUPNE_GOLD_LIVE_PREVIEW.html
            candidate-*.png
            ${{ runner.temp }}/mobile.json
            ${{ runner.temp }}/desktop.json
          retention-days: 30
      - name: Commit verified production files and remove QA scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/odstupne-gold-fix.yml .github/workflows/odstupne-gold-build.yml .github/workflows/odstupne-baseline.yml .github/workflows/odstupne-diagnostic.yml .github/workflows/odstupne-run-final.yml .github/workflows/odstupne-a11y-diagnostic.yml .github/workflows/odstupne-final-v3.yml .github/workflows/odstupne-final-v4.yml
          git add -A .github/workflows odstupne-kalkulacka.html odstupne-kalkulacka.css odstupne.js
          git commit -m 'Upgrade severance calculator to Gold V7'
          git push origin HEAD:upgrade/odstupne-v7
