name: RV V8 - One-shot shift calculator candidate preparation
# Deliberately one-shot: adding this workflow starts it on the dedicated branch.
# Subsequent calculator commits do not match the workflow-file path filter.
on:
  push:
    branches:
      - v8/priplatky-smeny-candidate-20260916
    paths:
      - '.github/workflows/priplatky-smeny-v8-prepare.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'fangren740/bmi-kalkulacka' && github.ref == 'refs/heads/v8/priplatky-smeny-candidate-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8/priplatky-smeny-candidate-20260916
          fetch-depth: 0
      - name: Apply guarded two-file validation repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          js=Path('priplatky-smeny.js')
          html=Path('kalkulacka-priplatku-za-smeny.html')
          expected={'priplatky-smeny.js':'57fdbf982a12d3c5fa304aaecab3a2a3737b328a',
                    'kalkulacka-priplatku-za-smeny.html':'fb80936bfc7081948b2f2517528642076f06e0e8'}
          for path,sha in expected.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if actual!=sha: raise SystemExit(f'ABORT: {path} moved: {actual} != {sha}')
          def replace_once(text,old,new,name):
              count=text.count(old)
              if count!=1: raise SystemExit(f'ABORT: expected exactly one {name}, got {count}')
              return text.replace(old,new,1)
          s=js.read_text(encoding='utf-8')
          s=replace_once(s,
              "if (breakStart >= end || breakEnd <= start) return { error:'Zadaná přestávka neleží uvnitř směny.' };",
              "if (breakStart < start || breakEnd > end) return { error:'Neplacená přestávka musí celá ležet uvnitř směny.' };",
              'entire break inside shift')
          s=replace_once(s,
              "if(!shift || shift.error){ ['workTrack','nightTrack','weekendTrack','holidayTrack'].forEach(id=>$(id)?.replaceChildren()); return; }",
              "if(!shift || shift.error){\n      ['workTrack','nightTrack','weekendTrack','holidayTrack'].forEach(id=>$(id)?.replaceChildren());\n      ['timelineStart','timelineEnd','timelineRange','autoWorked','autoNight','autoWeekend','autoHoliday'].forEach(id=>setText(id,'—'));\n      return;\n    }",
              'stale timeline')
          s=replace_once(s,
              "  function calculate() {",
              """  function clearInvalidResults() {
    // Errors must never leave a plausible monetary amount on screen, in share
    // actions, in the hero or in the payslip comparison.
    ['cashBonus','basePay','totalPay','repeatBonus','heroBonus','heroTotal',
     'auditExpected','benchmarkPhv','nightLegalKc','weekendLegalKc',
     'overtimeLegalKc','holidayLegalKc'].forEach(id=>setText(id,'—'));
    ['timeOff','heroWorked','heroLeave'].forEach(id=>setText(id,'—'));
    setText('resultSummary','Opravte neplatné zadání.');
    setText('heroCaption','Neplatné zadání');
    setText('overlapText','Opravte údaje pro nový výpočet.');
    setText('auditMessage','Nejprve opravte zadání směny.');
    $('breakdownList').replaceChildren();
    $('overlapChips').replaceChildren();
    $('auditResult').classList.remove('is-good','is-warn','is-bad');
    const note=$('resultNote')?.querySelector('p');
    if(note) note.textContent='Výsledek nelze vypočítat, dokud neopravíte označené údaje.';
    ['copyResult','copyLink','printResult'].forEach(id=>{ const el=$(id); if(el)el.disabled=true; });
  }

  function calculate() {""",
              'clear invalid result function')
          s=replace_once(s,
              "    if(errors.length){ errorBox.hidden=false; errorBox.textContent=errors.join(' '); }\n    else errorBox.hidden=true;",
              """    if(errors.length){
      errorBox.hidden=false;
      errorBox.textContent=errors.join(' ');
      lastCalc=null;
      clearInvalidResults();
      return null;
    }
    errorBox.hidden=true;
    ['copyResult','copyLink','printResult'].forEach(id=>{ const el=$(id); if(el)el.disabled=false; });""",
              'early return on validation errors')
          s=replace_once(s,
              "  function renderAudit() {\n    if(!lastCalc) return;",
              "  function renderAudit() {\n    if(!lastCalc){ setText('auditExpected','—'); setText('auditMessage','Nejprve opravte zadání směny.'); return; }",
              'stale payslip check')
          h=html.read_text(encoding='utf-8')
          h=replace_once(h,
              '/priplatky-smeny.js?v=20260818-a11y1',
              '/priplatky-smeny.js?v=20260916-v8-validation1',
              'JS cache version')
          js.write_text(s,encoding='utf-8')
          html.write_text(h,encoding='utf-8')
          print('Guarded changes applied to exactly the two intended product files.')
          PY
          node --check priplatky-smeny.js
          git diff --check
          git diff --stat
          sha256sum priplatky-smeny.js kalkulacka-priplatku-za-smeny.html
      - name: Commit candidate only to dedicated V8 branch
        run: |
          git config user.name 'rv-v8-candidate-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- priplatky-smeny.js kalkulacka-priplatku-za-smeny.html
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'fix: reject out-of-shift breaks and clear invalid pay results'
          git rev-parse HEAD
          git push origin HEAD:v8/priplatky-smeny-candidate-20260916
