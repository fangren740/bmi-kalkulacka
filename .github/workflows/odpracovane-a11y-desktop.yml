name: RV worked-hours desktop accessibility diagnostic
on:
  push:
    branches: [upgrade/odpracovane-hodiny-v7]
    paths: [.github/workflows/odpracovane-a11y-desktop.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odpracovane-hodiny-v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize patched candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,gzip
          for src,dst in {'.rv_tmp/wh_html.gz.b64':'kalkulacka-odpracovanych-hodin.html','.rv_tmp/wh_css.gz.b64':'odpracovane-hodiny.css','.rv_tmp/wh_js.gz.b64':'odpracovane-hodiny.js'}.items():
              s=''.join(Path(src).read_text().split()); s += '='*((4-len(s)%4)%4); Path(dst).write_bytes(gzip.decompress(base64.b64decode(s,validate=False)))
          p=Path('odpracovane-hodiny.css'); s=p.read_text()
          for a,b in {'--wh-green2:#218431':'--wh-green2:#1b762c','--wh-muted:#60768a':'--wh-muted:#566f83','color:#60778a;font-weight:900':'color:#526b7e;font-weight:900','background:#f7fbfd;color:#63798a':'background:#f7fbfd;color:#526b7e','.wh-inline-audit>span{font-size:.67rem':'.wh-inline-audit>span{font-size:.7rem','color:#718697;font-size:.6rem':'color:#526b7e;font-size:.68rem','color:#748797;font-size:.59rem':'color:#526b7e;font-size:.67rem','color:#718697;font-size:.61rem':'color:#526b7e;font-size:.65rem'}.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Lighthouse desktop accessibility detail
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rvqa" lighthouse@13.4.1
          python -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 & sleep 1
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/kalkulacka-odpracovanych-hodin.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=accessibility
          node - <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/desktop.json')); console.log('ACCESSIBILITY_SCORE',Math.round(x.categories.accessibility.score*100));
          for(const r of x.categories.accessibility.auditRefs.filter(r=>r.weight>0)){const a=x.audits[r.id]; if(a&&a.score!==null&&a.score<1){console.log('A11Y_FAIL',r.id,'weight='+r.weight,'score='+a.score); console.log('TITLE',a.title); if(a.details?.items) console.log('ITEMS',JSON.stringify(a.details.items.slice(0,20)));}}
          NODE
