name: RV All Completed Visual Render

on:
  push:
    branches:
      - audit/retro-quality-2026-08-30
    paths:
      - '.github/workflows/rv-all-visual-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/retro-quality-2026-08-30
      - name: Render all completed V-next heroes
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p all-renders
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python3 - <<'PY' > /tmp/pages.tsv
          import json
          d=json.load(open('RV_VNEXT_PROGRESS.json',encoding='utf-8'))
          for x in sorted(d.get('completedPages',[]),key=lambda z:z.get('sequence',9999)):
              s=x.get('sequence'); f=x.get('file')
              if isinstance(s,int) and s<=94 and f:
                  print(f'{s}\t{f}')
          PY
          while IFS=$'\t' read -r seq f; do
            if [[ -f "$f" ]]; then
              "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --run-all-compositor-stages-before-draw --virtual-time-budget=700 --window-size=1440,850 --screenshot="all-renders/${seq}.png" "http://127.0.0.1:8765/${f}" >/dev/null 2>&1
            fi
          done < /tmp/pages.tsv
          echo "Rendered $(find all-renders -name '*.png' | wc -l) pages"
      - uses: actions/upload-artifact@v4
        with:
          name: rv-all-completed-visual-renders
          path: all-renders/*.png
          retention-days: 7
