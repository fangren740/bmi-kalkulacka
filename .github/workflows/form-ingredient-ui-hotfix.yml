name: Recipe form ingredient UI hotfix

on:
  push:
    branches:
      - hotfix/prepocet-formy-ingredient-ui-20260911

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI patch
        run: python .tmp-form-ui/patch.py

      - name: Syntax and static gates
        run: |
          node --check prepocet-formy-page.js
          node --check prepocet-formy-core.js
          python .github/scripts/audit_static_site.py --root . --config audits/audit-config.json --check-js --json-out /tmp/static.json
          python rv-vnext-progress-audit.py --root . --json-out /tmp/tracking.json
          python rv-vnext-a11y-lint.py --all-vnext
          python .github/scripts/vnext_inventory.py --check

      - name: Install browser
        run: |
          npm install --prefix "$RUNNER_TEMP/rv-browser" playwright@1.62.1
          "$RUNNER_TEMP/rv-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Browser regression desktop and mobile
        env:
          NODE_PATH: ${{ runner.temp }}/rv-browser/node_modules
        run: |
          python -m http.server 4173 >/tmp/form-ui-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/prepocet-formy-na-peceni.html >/dev/null; then break; fi
            sleep .25
          done
          node - <<'NODE'
          const { chromium }=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const vp of [{width:1440,height:1100},{width:390,height:844}]){
                const page=await browser.newPage({viewport:vp});
                const errors=[]; const failed=[];
                page.on('pageerror',e=>errors.push(String(e)));
                page.on('requestfailed',r=>failed.push(r.url()+': '+(r.failure()?.errorText||'')));
                const response=await page.goto('http://127.0.0.1:4173/prepocet-formy-na-peceni.html',{waitUntil:'networkidle'});
                assert.equal(response.status(),200);
                await page.waitForFunction(()=>document.querySelectorAll('#rows .tr').length===6,{timeout:5000});
                assert.equal(errors.length,0,'page errors '+errors.join('; '));
                assert.equal(await page.locator('#rows .tr').count(),6);
                await page.locator('#addIng').click();
                assert.equal(await page.locator('#rows .tr').count(),7);
                assert.equal(await page.locator('#rows .tr').last().locator('.cell-label').count(),3);
                assert.equal(await page.locator('#rows .tr').last().locator('.remove svg').count(),1);
                const focused=await page.evaluate(()=>document.activeElement?.getAttribute('data-k'));
                assert.equal(focused,'name');
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1);
                assert.equal(overflow,false,'horizontal overflow at '+vp.width);
                const row=page.locator('#rows .tr').first();
                const style=await row.evaluate(el=>({display:getComputedStyle(el).display,borderRadius:getComputedStyle(el).borderRadius}));
                assert.equal(style.display,'grid');
                assert.notEqual(style.borderRadius,'0px');
                if(vp.width===390){
                  const name=await row.locator('.ing-name').boundingBox();
                  const amount=await row.locator('.ing-amount').boundingBox();
                  const unit=await row.locator('.ing-unit').boundingBox();
                  const remove=await row.locator('.ing-remove').boundingBox();
                  assert(name && amount && unit && remove);
                  assert(name.width>300,'mobile ingredient name should span full card width');
                  assert(Math.abs(amount.y-unit.y)<3 && Math.abs(unit.y-remove.y)<3,'mobile amount/unit/remove should share second row');
                }
                console.log('viewport',vp.width,'request failures',failed.length);
                await page.close();
              }
              console.log('ingredient editor browser regression PASS');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit tested UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Polish recipe ingredient editor UI"
          git push origin HEAD:${GITHUB_REF_NAME}
