name: Odstupne redesign overflow diagnostic
on:
  push:
    branches: [upgrade/odstupne-complete-redesign-v7]
    paths: [.github/workflows/odstupne-redesign-overflow.yml]
jobs:
  overflow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odstupne-complete-redesign-v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize and diagnose 430 390 320
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .redesign/odstupne-kalkulacka.html.gz > odstupne-kalkulacka.html
          gzip -dc .redesign/odstupne-kalkulacka.css.gz > odstupne-kalkulacka.css
          npm install --prefix "$RUNNER_TEMP/diag" puppeteer-core@24.16.0
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/diag/node_modules/puppeteer-core');
          (async()=>{const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});for(const width of [430,390,360,320]){const p=await b.newPage();await p.setViewport({width,height:1000});await p.goto('http://127.0.0.1:8765/odstupne-kalkulacka.html',{waitUntil:'networkidle0'});const x=await p.evaluate(()=>{const vw=document.documentElement.clientWidth;return {vw,sw:document.documentElement.scrollWidth,offenders:[...document.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.right>vw+1||r.left<-1)}).map(e=>{const r=e.getBoundingClientRect();return {tag:e.tagName,cls:e.className,id:e.id,left:Math.round(r.left),right:Math.round(r.right),w:Math.round(r.width),text:(e.textContent||'').trim().slice(0,80)}}).slice(0,30)}});console.log('DIAG',width,JSON.stringify(x,null,2));await p.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
