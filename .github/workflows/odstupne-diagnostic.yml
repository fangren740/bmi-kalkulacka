name: Odstupne Gold diagnostic
on:
  push:
    branches: [upgrade/odstupne-v7]
    paths: [.github/workflows/odstupne-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odstupne-v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize same candidate as Gold workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/odstupne-gold-build.yml').read_text()
          marker="          python - <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY\n", start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          Path('/tmp/materialize.py').write_text(code)
          PY
          python /tmp/materialize.py
          node --check odstupne.js
      - name: Install browser tooling
        run: npm install --prefix "$RUNNER_TEMP/rvqa" puppeteer-core@24.16.0
      - name: Run detailed diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 & sleep 1
          node - <<'NODE'
          const fs=require('fs');const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');
          (async()=>{const out={widths:{},scenario:{},errors:[]};const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          for(const width of [1440,1280,1024,768,430,390,360,320]){const p=await b.newPage();p.on('pageerror',e=>out.errors.push('page '+width+' '+String(e)));p.on('console',m=>{if(m.type()==='error')out.errors.push('console '+width+' '+m.text())});await p.setViewport({width,height:1000});await p.goto('http://127.0.0.1:8765/odstupne-kalkulacka.html',{waitUntil:'networkidle0'});out.widths[width]=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,total:document.querySelector('#resultTotal')?.textContent.trim(),logo:document.querySelector('header img')?.getAttribute('src'),toolTop:Math.round(document.querySelector('#kalkulacka').getBoundingClientRect().top+scrollY),heroHeight:Math.round(document.querySelector('.stp-hero').getBoundingClientRect().height)}));
          if(width===390){await p.click('[data-mode-button="pro"]');await p.waitForFunction(()=>document.body.dataset.mode==='pro');const snap=async n=>out.scenario[n]=await p.evaluate(()=>({total:document.querySelector('#resultTotal')?.textContent.trim(),basis:document.querySelector('#decisionType')?.textContent.trim(),repaymentHidden:document.querySelector('#repaymentBox')?.hidden,returnDisabled:document.querySelector('#proReturnEnabled')?.disabled,eligibility:document.querySelector('#returnEligibilityNote')?.textContent.trim(),accountDisabled:document.querySelector('#proWorkTimeAccount')?.disabled}));await snap('proStart');await p.$eval('#proWorkTimeAccount',e=>{e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}))});await new Promise(r=>setTimeout(r,100));await snap('account');await p.$eval('#proWorkTimeAccount',e=>{e.checked=false;e.dispatchEvent(new Event('change',{bubbles:true}))});await p.$eval('#proReason',e=>{e.value='exposure';e.dispatchEvent(new Event('change',{bubbles:true}))});await new Promise(r=>setTimeout(r,100));await snap('exposure');await p.$eval('#proReturnEnabled',e=>{e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}))});await new Promise(r=>setTimeout(r,100));await snap('exposureReturn');await p.$eval('#proReason',e=>{e.value='workHealth';e.dispatchEvent(new Event('change',{bubbles:true}))});await new Promise(r=>setTimeout(r,100));await snap('workHealth');await p.$eval('#proReason',e=>{e.value='other';e.dispatchEvent(new Event('change',{bubbles:true}))});await p.$eval('#proExtraMultiplier',e=>{e.value='2';e.dispatchEvent(new Event('input',{bubbles:true}))});await new Promise(r=>setTimeout(r,100));await snap('other');out.targets=await p.$$eval('.stp-btn,.stp-mode__button,.stp-choice-grid label,.stp-toggle',els=>els.filter(e=>e.offsetParent!==null).map(e=>({tag:e.tagName,txt:e.textContent.trim().slice(0,40),w:Math.round(e.getBoundingClientRect().width),h:Math.round(e.getBoundingClientRect().height)})).filter(x=>x.h<44||x.w<44));}
          await p.close();}await b.close();fs.writeFileSync('odstupne-diagnostic.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));})().catch(e=>{fs.writeFileSync('odstupne-diagnostic-error.txt',String(e.stack||e));console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odstupne-diagnostic
          path: |
            odstupne-diagnostic.json
            odstupne-diagnostic-error.txt
          if-no-files-found: warn
          retention-days: 7
