name: Odstupne complete redesign Gold gate
on:
  push:
    branches: [upgrade/odstupne-complete-redesign-v7]
    paths: [.github/workflows/odstupne-complete-redesign-gate.yml]
permissions:
  contents: write
jobs:
  redesign-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odstupne-complete-redesign-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize complete redesign
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .redesign/odstupne-kalkulacka.html.gz > odstupne-kalkulacka.html
          gzip -dc .redesign/odstupne-kalkulacka.css.gz > odstupne-kalkulacka.css
          node --check odstupne.js
          python -m pip install --quiet beautifulsoup4
          python - <<'PY'
          from bs4 import BeautifulSoup
          import re
          from pathlib import Path
          html=Path('odstupne-kalkulacka.html').read_text()
          js=Path('odstupne.js').read_text()
          soup=BeautifulSoup(html,'html.parser')
          ids=[x.get('id') for x in soup.select('[id]')]
          dup=sorted({x for x in ids if ids.count(x)>1})
          needed=sorted(set(re.findall(r'\$\("([A-Za-z0-9_-]+)"\)',js)))
          missing=[x for x in needed if not soup.find(id=x)]
          print('JS_IDS',len(needed),'MISSING',missing,'DUP',dup)
          assert not missing and not dup
          assert len(soup.select('input[name="basicReason"]'))==4
          assert len(soup.select('input[name="basicDuration"]'))==3
          PY
      - name: Install browser QA
        run: npm install --prefix "$RUNNER_TEMP/rvqa" puppeteer-core@24.16.0 lighthouse@13.4.1
      - name: Browser correctness responsive UX gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          sleep 1
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const runtimeErrors=[];
            for(const width of [1440,1280,1024,768,430,390,360,320]){
              const p=await browser.newPage();
              p.on('pageerror',e=>runtimeErrors.push(width+': '+String(e)));
              p.on('console',m=>{if(m.type()==='error')runtimeErrors.push(width+': '+m.text())});
              await p.setViewport({width,height:1000});
              await p.goto('http://127.0.0.1:8765/odstupne-kalkulacka.html',{waitUntil:'networkidle0'});
              const base=await p.evaluate(()=>({
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                total:document.querySelector('#resultTotal').textContent.trim(),
                toolTop:Math.round(document.querySelector('#kalkulacka').getBoundingClientRect().top+scrollY),
                h1:document.querySelector('h1').textContent.trim(),
                logo:document.querySelector('header img')?.getAttribute('src')||''
              }));
              console.log('WIDTH',width,base);
              if(base.overflow) throw new Error('horizontal overflow '+width);
              if(base.total.replace(/\s/g,'')!=='84000Kč') throw new Error('default result '+width+' '+base.total);
              if(!base.logo.includes('logo-rv-v32.svg')) throw new Error('logo mismatch '+width);
              if(width<=390 && base.toolTop>900) throw new Error('mobile tool too low '+width+' '+base.toolTop);
              if(width===390){
                const setRadio=async(name,value)=>p.$eval(`input[name="${name}"][value="${value}"]`,e=>{e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}))});
                await setRadio('basicReason','other');
                await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'')==='0Kč');
                await setRadio('basicReason','exposure');
                await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'')==='504000Kč');
                if((await p.$eval('#decisionType',e=>e.textContent.trim()))!=='§ 67 odst. 3') throw new Error('exposure legal basis');
                await setRadio('basicReason','organizational');
                await setRadio('basicDuration','over2');
                await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'')==='126000Kč');
                await p.click('#proTab');
                await p.waitForFunction(()=>document.body.dataset.mode==='pro');
                await p.$eval('#proEarnings',e=>{e.value='42000';e.dispatchEvent(new Event('input',{bubbles:true}))});
                await p.$eval('#proCurrentMonths',e=>{e.value='18';e.dispatchEvent(new Event('input',{bubbles:true}))});
                await p.$eval('#proReason',e=>{e.value='organizational';e.dispatchEvent(new Event('change',{bubbles:true}))});
                await p.$eval('#proWorkTimeAccount',e=>{e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}))});
                await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'')==='210000Kč');
                if(!(await p.$eval('#decisionType',e=>e.textContent)).includes('písm. d')) throw new Error('konto legal basis');
                await p.$eval('#proWorkTimeAccount',e=>{e.checked=false;e.dispatchEvent(new Event('change',{bubbles:true}))});
                await p.$eval('#proReason',e=>{e.value='exposure';e.dispatchEvent(new Event('change',{bubbles:true}))});
                await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'')==='504000Kč');
                await p.$eval('#proReturnEnabled',e=>{e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}))});
                await p.waitForFunction(()=>!document.querySelector('#repaymentBox').hidden);
                await p.$eval('#proReason',e=>{e.value='workHealth';e.dispatchEvent(new Event('change',{bubbles:true}))});
                await p.waitForFunction(()=>document.querySelector('#proReturnEnabled').disabled===true);
                if(!(await p.$eval('#repaymentBox',e=>e.hidden))) throw new Error('271ca repayment visible');
                if(!(await p.$eval('#returnEligibilityNote',e=>e.textContent)).includes('§ 271ca')) throw new Error('271ca note missing');
                await p.$eval('#proReason',e=>{e.value='organizational';e.dispatchEvent(new Event('change',{bubbles:true}))});
                await p.$eval('#proCurrentMonths',e=>{e.value='8';e.dispatchEvent(new Event('input',{bubbles:true}))});
                await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'')==='42000Kč');
                await p.$eval('#proPreviousEligible',e=>{e.checked=true;e.dispatchEvent(new Event('change',{bubbles:true}))});
                await p.$eval('#proPreviousMonths',e=>{e.value='10';e.dispatchEvent(new Event('input',{bubbles:true}))});
                await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'')==='84000Kč');
                await p.$eval('#proExtraMultiplier',e=>{e.value='2';e.dispatchEvent(new Event('input',{bubbles:true}))});
                await p.waitForFunction(()=>document.querySelector('#resultTotal').textContent.replace(/\s/g,'')==='168000Kč');
                const bad=await p.$$eval('button,.sev-mode__tab,.sev-choice label,.sev-toggle',els=>els.filter(e=>e.offsetParent!==null).map(e=>({t:e.textContent.trim().slice(0,30),w:e.getBoundingClientRect().width,h:e.getBoundingClientRect().height})).filter(x=>x.w<44||x.h<44));
                if(bad.length) throw new Error('small targets '+JSON.stringify(bad.slice(0,8)));
                await p.click('#copyResult');
              }
              await p.close();
            }
            await browser.close();
            if(runtimeErrors.length) throw new Error(runtimeErrors.join('\n'));
            console.log('ODSTUPNE_COMPLETE_REDESIGN_BROWSER_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Lighthouse Gold gate
        shell: bash
        run: |
          set -euo pipefail
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');let fail=false;
          for(const n of ['mobile','desktop']){
            const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+n+'.json'));
            const s=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));
            const lcp=Math.round(x.audits['largest-contentful-paint']?.numericValue||0),tbt=Math.round(x.audits['total-blocking-time']?.numericValue||0),cls=x.audits['cumulative-layout-shift']?.numericValue||0;
            console.log(n.toUpperCase(),s,'LCP',lcp,'TBT',tbt,'CLS',cls);
            if(s.performance<98||s.accessibility<100||s['best-practices']<100||s.seo<100){
              fail=true;
              for(const r of x.categories.accessibility.auditRefs||[]){const a=x.audits[r.id];if(a&&a.score!==1&&a.score!==null)console.log('A11Y_FAIL',n,r.id,a.score,a.title,JSON.stringify(a.details||{}).slice(0,8000));}
            }
          }
          if(fail)process.exit(1);
          NODE
      - name: Build exact preview and screenshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,base64
          h=Path('odstupne-kalkulacka.html').read_text()
          common='\n'.join(Path(p).read_text() for p in ['rv-brand-v32.css','rv-social-links.css'])
          page=Path('odstupne-kalkulacka.css').read_text();js=Path('odstupne.js').read_text()
          h=re.sub(r'<link rel="stylesheet" href="/rv-brand-v32.css[^>]*>\s*','',h)
          h=re.sub(r'<link rel="stylesheet" href="/rv-social-links.css[^>]*>\s*','',h)
          h=re.sub(r'<link rel="stylesheet" href="/odstupne-kalkulacka.css[^>]*>',lambda m:'<style>'+common+'\n'+page+'</style>',h)
          h=re.sub(r'<script src="/odstupne.js[^>]*></script>',lambda m:'<script>'+js+'</script>',h)
          for name in ['logo-rv-v32.svg','logo-rv-v32-inverse.svg','favicon-rv-v32.svg']:
            data=base64.b64encode(Path(name).read_bytes()).decode();h=re.sub(r'/'+re.escape(name)+r'(?:\?v=1)?',lambda m:'data:image/svg+xml;base64,'+data,h)
          Path('RV_ODSTUPNE_COMPLETE_REDESIGN_LIVE_PREVIEW.html').write_text(h)
          PY
          node - <<'NODE'
          const puppeteer=require(process.env.RUNNER_TEMP+'/rvqa/node_modules/puppeteer-core');
          (async()=>{const b=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});for(const [n,w,h] of [['desktop',1440,1100],['tablet',768,1024],['mobile390',390,844],['mobile320',320,780]]){const p=await b.newPage();await p.setViewport({width:w,height:h});await p.goto('http://127.0.0.1:8765/odstupne-kalkulacka.html',{waitUntil:'networkidle0'});await p.screenshot({path:'redesign-'+n+'-top.png'});await p.evaluate(()=>document.querySelector('#kalkulacka').scrollIntoView());await new Promise(r=>setTimeout(r,200));await p.screenshot({path:'redesign-'+n+'-tool.png'});if(n==='desktop'||n==='mobile390')await p.screenshot({path:'redesign-'+n+'-full.jpg',fullPage:true,type:'jpeg',quality:72});await p.close();}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: odstupne-complete-redesign-final
          path: |
            RV_ODSTUPNE_COMPLETE_REDESIGN_LIVE_PREVIEW.html
            redesign-*.png
            redesign-*.jpg
            ${{ runner.temp }}/mobile.json
            ${{ runner.temp }}/desktop.json
          retention-days: 30
      - name: Commit verified redesign and clean staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .redesign .github/workflows/odstupne-complete-redesign-gate.yml
          git add -A .redesign .github/workflows/odstupne-complete-redesign-gate.yml odstupne-kalkulacka.html odstupne-kalkulacka.css
          git commit -m 'Completely redesign severance calculator Gold V7'
          git push origin HEAD:upgrade/odstupne-complete-redesign-v7
