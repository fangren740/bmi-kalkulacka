name: Vacation pay narrow mobile final QA
on:
  push:
    branches: [upgrade/nahrada-dovolena-complete-redesign-v7]
    paths: [.github/workflows/nahrada-dovolena-mobile-final.yml]
permissions:
  contents: write
jobs:
  gold:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/nahrada-dovolena-complete-redesign-v7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build product and run full Gold QA
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import os, subprocess, base64, gzip, yaml
          for stem,target in [('html','nahrada-mzdy-za-dovolenou-kalkulacka.html'),('css','nahrada-dovolena-pro.css'),('js','nahrada-dovolena.js')]:
              chunks=sorted(Path('.vacstage').glob(stem+'-*.txt'))
              assert chunks,stem
              Path(target).write_bytes(gzip.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks))))
          css=Path('nahrada-dovolena-pro.css')
          css.write_text(css.read_text()+'''\n/* Gold: accessible result controls and mobile-first direct route to calculator. */
          #copyResult,#printResult{min-height:46px}
          @media(max-width:430px){
            .vac-ticket{display:none}
            .vac-hero{padding-bottom:22px}
            .vac-hero__facts{margin-top:12px}
            .vac-hero__facts span:nth-child(n+2){display:none}
          }
          @media(max-width:360px){
            .vac-hero h1{font-size:2.24rem}
            .vac-lead{font-size:.84rem;line-height:1.45;margin-top:12px}
            .vac-overline b{display:none}
            .vac-hero__actions{margin-top:14px;gap:7px}
          }
          @media(max-width:320px){
            .vac-hero h1{font-size:2.04rem}
            .vac-action{font-size:.74rem;padding-inline:11px}
          }
          ''')
          subprocess.run(['node','--check','nahrada-dovolena.js'],check=True)
          wf=yaml.safe_load(Path('.github/workflows/nahrada-dovolena-redesign-gate.yml').read_text())
          steps={s.get('name'):s.get('run') for s in wf['jobs']['gold-gate']['steps'] if s.get('name') and s.get('run')}
          for name in ['Install isolated QA','Browser correctness responsive UX and Lighthouse gate']:
              script=steps[name]
              if name.startswith('Browser'):
                  old=".filter(e=>getComputedStyle(e).display!=='none'&&!e.hidden)"
                  assert old in script,'expected target filter missing'
                  script=script.replace(old,'.filter(e=>e.getClientRects().length>0)')
              print('\n### '+name,flush=True)
              subprocess.run(['bash','-lc',script],check=True,env=os.environ.copy())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vacation-pay-final-candidate
          path: |
            RV_NAHRADA_DOVOLENA_GOLD_LIVE_PREVIEW.html
            nahrada-mzdy-za-dovolenou-kalkulacka.html
            nahrada-dovolena-pro.css
            nahrada-dovolena.js
            vac-*.png
            vac-*.jpg
            ${{ runner.temp }}/mobile.json
            ${{ runner.temp }}/desktop.json
          retention-days: 30
      - name: Commit tested product only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .vacstage
          rm -f .github/workflows/nahrada-dovolena-redesign-gate.yml .github/workflows/nahrada-dovolena-redesign-rerun.yml .github/workflows/nahrada-dovolena-gold-fix.yml .github/workflows/nahrada-dovolena-inspect.yml .github/workflows/nahrada-dovolena-mobile-final.yml
          git add -A .vacstage .github/workflows/nahrada-dovolena-redesign-gate.yml .github/workflows/nahrada-dovolena-redesign-rerun.yml .github/workflows/nahrada-dovolena-gold-fix.yml .github/workflows/nahrada-dovolena-inspect.yml .github/workflows/nahrada-dovolena-mobile-final.yml nahrada-mzdy-za-dovolenou-kalkulacka.html nahrada-dovolena-pro.css nahrada-dovolena.js
          git commit -m 'Complete vacation pay Gold V7 redesign and mobile UX hardening'
          git push origin HEAD:upgrade/nahrada-dovolena-complete-redesign-v7
