name: Odstupne a11y diagnostic
on:
  push:
    branches: [upgrade/odstupne-v7]
    paths: [.github/workflows/odstupne-a11y-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose-a11y:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/odstupne-v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize Gold candidate and install QA
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml, subprocess, os
          y=yaml.safe_load(Path('.github/workflows/odstupne-gold-fix.yml').read_text())
          steps=y['jobs']['final-gate']['steps']
          by={s.get('name'):s.get('run') for s in steps if s.get('name')}
          for name in ['Materialize candidate and repair Gold CSS payload','Install QA']:
              print('###',name,flush=True)
              subprocess.run(['bash','-lc',by[name]],check=True,env=os.environ.copy())
          PY
      - name: Diagnose Lighthouse accessibility failures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/odst-a11y-server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 1
          LH="$RUNNER_TEMP/rvqa/node_modules/lighthouse/cli/index.js"
          node "$LH" 'http://127.0.0.1:8765/odstupne-kalkulacka.html' --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/a11y-mobile.json" --only-categories=accessibility
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/a11y-mobile.json'));
          console.log('ACCESSIBILITY SCORE',Math.round(x.categories.accessibility.score*100));
          const refs=x.categories.accessibility.auditRefs||[];
          for(const r of refs){
            const a=x.audits[r.id];
            if(!a || a.score===1 || a.score===null) continue;
            console.log('\nFAIL',r.id,'score=',a.score,'title=',a.title);
            console.log('description=',a.description||'');
            if(a.details){
              console.log('details=',JSON.stringify(a.details,null,2).slice(0,30000));
            }
          }
          NODE
