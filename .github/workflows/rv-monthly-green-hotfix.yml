name: RV monthly Gold green hotfix
on:
  push:
    branches: ['fix/monthly-gold-green']
    paths: ['.github/workflows/rv-monthly-green-hotfix.yml']
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/monthly-gold-green'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply production-gate fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('mesicni-mzda-z-hodinove-sazby.js')
          s=js.read_text(encoding='utf-8')
          old='document.querySelectorAll("[data-mode]")'
          if s.count(old)!=2: raise SystemExit('Unexpected mode selector count')
          js.write_text(s.replace(old,'document.querySelectorAll(".hm-mode [data-mode]")'),encoding='utf-8')

          css=Path('mesicni-mzda-z-hodinove-sazby.css')
          c=css.read_text(encoding='utf-8')
          marker='/* Gold V4 production gate hotfix 2026-09-14 */'
          if marker in c: raise SystemExit('Hotfix already present')
          rules=[
            '',marker,
            '.hm-page{--hm-muted:#526a7d}',
            '.hm-page .header-cta{color:#fff!important}',
            '.hm-page .hm-mode button:not(.is-active){color:#4b6275}',
            '.hm-page .hm-basis small{color:#506779}',
            '.hm-page .hm-private{color:#536a7d}',
            '.hm-page .hm-min-check p{color:#556b7d}',
            '.hm-page .hm-disclaimer p{color:#586f82}',
            '.hm-page .hm-tape-head b,.hm-page .hm-loss span,.hm-page .hm-shift-head b,.hm-page .hm-regime-title small,.hm-page .hm-offer-side>small{color:#566d80}',
            '.hm-page .hm-tape-legend,.hm-page .hm-shift-math span{color:#526a7d}',
            '.hm-page .hm-offer-side p{color:#586f82}',
            '.hm-page .hm-related-line a>span{color:#526a7d}',
            '.hm-page .hm-fourweeks .hm-kicker,.hm-page .hm-regime .hm-kicker,.hm-page .hm-checklist .hm-kicker,.hm-page .hm-method .hm-kicker,.hm-page .hm-related .hm-kicker{color:#236c2e}',
            '.hm-page .footer-grid a{min-height:44px;display:flex;align-items:center;margin:0}',
            '.hm-page .footer-grid .rv-social-links a{display:grid;place-items:center;width:44px;height:44px;min-height:44px}',
            '@supports (content-visibility:auto){.hm-page .hm-sensitivity,.hm-page .hm-fourweeks,.hm-page .hm-when,.hm-page .hm-paidtime,.hm-page .hm-regime,.hm-page .hm-offer,.hm-page .hm-checklist,.hm-page .hm-method,.hm-page .hm-faq,.hm-page .hm-related,.hm-page .site-footer{content-visibility:auto;contain-intrinsic-size:auto 900px}}',
            '@media(max-width:720px){.hm-page .site-header{backdrop-filter:none}}',''
          ]
          css.write_text(c+'\n'.join(rules),encoding='utf-8')

          html=Path('mesicni-mzda-z-hodinove-sazby-kalkulacka.html')
          h=html.read_text(encoding='utf-8')
          if h.count('?v=20260914-v4')!=2: raise SystemExit('Unexpected V4 asset ref count')
          html.write_text(h.replace('?v=20260914-v4','?v=20260914-v4g1'),encoding='utf-8')
          PY
          node --check mesicni-mzda-z-hodinove-sazby.js
      - name: Lighthouse verified candidate
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/rv-lh" lighthouse@13.4.1
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 1
          LH="$RUNNER_TEMP/rv-lh/node_modules/lighthouse/cli/index.js"
          URL='http://127.0.0.1:8765/mesicni-mzda-z-hodinove-sazby-kalkulacka.html'
          for n in 1 2 3; do node "$LH" "$URL" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile$n.json" --only-categories=performance,accessibility,best-practices,seo; done
          node "$LH" "$URL" --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');let bad=false,mp=[];
          for(const name of ['mobile1','mobile2','mobile3','desktop']){
            const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+name+'.json'));
            const s=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));
            const m={LCP:Math.round(x.audits['largest-contentful-paint']?.numericValue||0),CLS:x.audits['cumulative-layout-shift']?.numericValue,TBT:Math.round(x.audits['total-blocking-time']?.numericValue||0)};
            console.log(name.toUpperCase(),JSON.stringify({scores:s,metrics:m}));
            if(s.accessibility!==100||s['best-practices']!==100||s.seo!==100)bad=true;
            if(name.startsWith('mobile'))mp.push(s.performance);else if(s.performance<95)bad=true;
          }
          const sorted=[...mp].sort((a,b)=>a-b),median=sorted[1],passing=mp.filter(x=>x>=90).length;
          console.log('MOBILE_PERF_SERIES',mp,'MEDIAN',median,'PASSING',passing);
          if(median<90||passing<2)bad=true;
          if(bad){console.error('MONTHLY_GOLD_CANDIDATE_GATE_FAIL');process.exit(1)}
          console.log('MONTHLY_GOLD_CANDIDATE_GATE_PASS');
          NODE
      - name: Commit verified hotfix only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rv-monthly-green-hotfix.yml .github/workflows/rv-monthly-green-diagnose.yml
          git add mesicni-mzda-z-hodinove-sazby-kalkulacka.html mesicni-mzda-z-hodinove-sazby.css mesicni-mzda-z-hodinove-sazby.js
          git commit -m 'Fix monthly Gold accessibility and mobile rendering gate'
          git push origin HEAD:fix/monthly-gold-green
