name: Worked hours production final evidence
on:
  push:
    branches: [upgrade/odpracovane-hodiny-v7]
    paths: [.github/workflows/odpracovane-production-final.yml]
permissions:
  contents: read
jobs:
  production-final:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live Gold build
        shell: bash
        run: |
          set -euo pipefail
          URL="https://rychlevypocty.cz/kalkulacka-odpracovanych-hodin.html?rvcheck=${GITHUB_RUN_ID}"
          curl -fsSL --retry 5 --retry-delay 2 "$URL" -o "$RUNNER_TEMP/live.html"
          grep -q 'DOCHÁZKOVÁ KARTA' "$RUNNER_TEMP/live.html"
          grep -q 'MPSV ověřeno 15. 9. 2026' "$RUNNER_TEMP/live.html"
          grep -q 'odpracovane-hodiny.css?v=20260915-gold1' "$RUNNER_TEMP/live.html"
          echo 'LIVE_GOLD_BUILD_PASS'
      - name: Install Lighthouse
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/rvprod" lighthouse@13.4.1
      - name: Production Lighthouse mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          LH="$RUNNER_TEMP/rvprod/node_modules/lighthouse/cli/index.js"
          URL='https://rychlevypocty.cz/kalkulacka-odpracovanych-hodin.html'
          node "$LH" "$URL" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/mobile.json" --only-categories=performance,accessibility,best-practices,seo
          node "$LH" "$URL" --quiet --preset=desktop --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --output=json --output-path="$RUNNER_TEMP/desktop.json" --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const fs=require('fs');
          for(const n of ['mobile','desktop']){
            const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+n+'.json'));
            const s=Object.fromEntries(Object.entries(x.categories).map(([k,v])=>[k,Math.round(v.score*100)]));
            const lcp=Math.round(x.audits['largest-contentful-paint'].numericValue||0);
            const tbt=Math.round(x.audits['total-blocking-time'].numericValue||0);
            console.log(n.toUpperCase(),s,'LCP',lcp,'TBT',tbt);
            if(s.performance<95||s.accessibility<100||s['best-practices']<100||s.seo<100) process.exit(1);
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: worked-hours-production-final
          path: |
            ${{ runner.temp }}/mobile.json
            ${{ runner.temp }}/desktop.json
          retention-days: 30
