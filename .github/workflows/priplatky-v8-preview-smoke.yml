name: RV V8 - isolated live preview smoke test
on:
  push:
    branches:
      - v8/preview-priplatky-20260916
    paths:
      - '.github/workflows/priplatky-v8-preview-smoke.yml'
      - '.github/scripts/priplatky-v8-preview-smoke.cjs'
      - 'v8-priplatky-live-preview.html'
permissions:
  contents: read
jobs:
  remote-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_PATH: /tmp/rv-preview/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated headless browser
        run: |
          npm install --prefix /tmp/rv-preview playwright@1.62.1
          /tmp/rv-preview/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify actual external interactive URL and immutable assets
        run: node .github/scripts/priplatky-v8-preview-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-isolated-live-preview-evidence
          path: /tmp/*-v8-preview*.png
          if-no-files-found: warn
          retention-days: 7
