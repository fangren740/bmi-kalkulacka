name: RV V8 - Příplatky za směny QA
on:
  pull_request:
    paths:
      - 'kalkulacka-priplatku-za-smeny.html'
      - 'priplatky-smeny.js'
      - 'priplatky-smeny.css'
      - '.github/scripts/priplatky-smeny-v8-browser.cjs'
      - '.github/scripts/priplatky-smeny-v8-preview-check.cjs'
      - '.github/workflows/priplatky-smeny-v8-qa.yml'
permissions:
  contents: read
jobs:
  calculator-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RV_TARGET_BASE: http://127.0.0.1:8765
      NODE_PATH: /tmp/rv-priplatky-qa/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright
        run: |
          npm install --prefix /tmp/rv-priplatky-qa playwright@1.62.1
          /tmp/rv-priplatky-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Start isolated candidate server
        run: python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/rv-priplatky-server.log" 2>&1 &
      - name: Calculator-specific regression, mobile and branding QA
        run: node .github/scripts/priplatky-smeny-v8-browser.cjs
      - name: Diagnose external preview - not a release gate until verified
        continue-on-error: true
        run: node .github/scripts/priplatky-smeny-v8-preview-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv-priplatky-v8-visual-qa
          path: /tmp/rv-priplatky-v8
          if-no-files-found: warn
          retention-days: 14
