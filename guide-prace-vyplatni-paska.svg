<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Kontrola výplatní pásky</title>
  <desc id="desc">Moderní ilustrace výplatní pásky s položkami hrubá mzda, odvody, daň a čistá mzda.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="20" x2="650" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecfeff"/>
      <stop offset="0.54" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="card" x1="170" y1="55" x2="555" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="720" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="612" cy="82" r="58" fill="#14b8a6" opacity=".10"/>
  <circle cx="122" cy="422" r="74" fill="#2563eb" opacity=".08"/>
  <path d="M70 145 C180 84 255 120 348 78 C444 35 565 45 650 105" fill="none" stroke="#0f766e" stroke-opacity=".13" stroke-width="22" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="148" y="54" width="424" height="412" rx="28" fill="url(#card)" stroke="#dbeafe"/>
    <rect x="178" y="88" width="190" height="16" rx="8" fill="#0f172a" opacity=".88"/>
    <rect x="178" y="116" width="150" height="10" rx="5" fill="#64748b" opacity=".35"/>
    <rect x="416" y="84" width="112" height="38" rx="19" fill="#ccfbf1"/>
    <text x="472" y="109" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#0f766e" text-anchor="middle">VÝPLATA</text>

    <g transform="translate(178 156)">
      <rect width="164" height="86" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="18" y="30" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Hrubá mzda</text>
      <text x="18" y="61" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="850" fill="#0f172a">42 000 Kč</text>
    </g>
    <g transform="translate(376 156)">
      <rect width="152" height="86" rx="18" fill="#ecfdf5" stroke="#bbf7d0"/>
      <text x="18" y="30" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#166534">Čistá mzda</text>
      <text x="18" y="61" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="850" fill="#0f766e">33 030 Kč</text>
    </g>

    <g transform="translate(178 270)">
      <rect width="350" height="18" rx="9" fill="#e2e8f0"/>
      <rect width="76" height="18" rx="9" fill="#2563eb"/>
      <rect x="92" width="56" height="18" rx="9" fill="#14b8a6"/>
      <rect x="164" width="38" height="18" rx="9" fill="#f59e0b"/>
      <rect x="218" width="132" height="18" rx="9" fill="#0f766e"/>
    </g>

    <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">
      <g transform="translate(178 322)"><circle cx="8" cy="-4" r="6" fill="#2563eb"/><text x="26" y="1">sociální a nemocenské pojištění</text><text x="302" y="1" font-weight="800" fill="#0f172a" text-anchor="end">7,1 %</text></g>
      <g transform="translate(178 356)"><circle cx="8" cy="-4" r="6" fill="#14b8a6"/><text x="26" y="1">zdravotní pojištění</text><text x="302" y="1" font-weight="800" fill="#0f172a" text-anchor="end">4,5 %</text></g>
      <g transform="translate(178 390)"><circle cx="8" cy="-4" r="6" fill="#f59e0b"/><text x="26" y="1">záloha na daň po slevách</text><text x="302" y="1" font-weight="800" fill="#0f172a" text-anchor="end">kontrola</text></g>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="62" y="225" width="142" height="112" rx="24" fill="#ffffff" stroke="#ccfbf1"/>
    <circle cx="103" cy="265" r="23" fill="#ccfbf1"/>
    <path d="M93 264 l8 8 18-21" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="133" y="267" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">Sedí</text>
    <text x="133" y="292" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">smlouva · docházka</text>
    <text x="133" y="311" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">slevy · čistá mzda</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="514" y="322" width="142" height="92" rx="24" fill="#ffffff" stroke="#dbeafe"/>
    <path d="M548 371 h76" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round"/>
    <path d="M548 371 h48" stroke="#0f766e" stroke-width="9" stroke-linecap="round"/>
    <text x="585" y="352" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">Checklist</text>
    <text x="585" y="394" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">před dotazem na HR</text>
  </g>
</svg>