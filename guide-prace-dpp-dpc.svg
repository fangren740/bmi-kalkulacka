<svg width="720" height="520" viewBox="0 0 720 520" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="520" rx="40" fill="#EAF6EC"/><rect x="30" y="30" width="660" height="460" rx="34" fill="#fff" stroke="#D7E7F4"/><text x="60" y="86" fill="#245D17" font-family="Inter,Arial" font-size="18" font-weight="800">Dohody o práci</text><text x="60" y="142" fill="#081A33" font-family="Inter,Arial" font-size="52" font-weight="900">DPP nebo DPČ?</text><g><rect x="60" y="190" width="274" height="218" rx="30" fill="#EEF6FF" stroke="#D7E7F4"/><text x="90" y="240" fill="#0B5AA7" font-family="Inter,Arial" font-size="34" font-weight="900">DPP</text><text x="90" y="286" fill="#587089" font-family="Inter,Arial" font-size="18" font-weight="700">spíš krátkodobější práce</text><text x="90" y="326" fill="#587089" font-family="Inter,Arial" font-size="18" font-weight="700">hlídat limity a odvody</text><text x="90" y="366" fill="#081A33" font-family="Inter,Arial" font-size="26" font-weight="900">rychlý přivýdělek</text></g><g><rect x="386" y="190" width="274" height="218" rx="30" fill="#EAF6E7" stroke="#CBE8C2"/><text x="416" y="240" fill="#2A6D1E" font-family="Inter,Arial" font-size="34" font-weight="900">DPČ</text><text x="416" y="286" fill="#587089" font-family="Inter,Arial" font-size="18" font-weight="700">pravidelnější spolupráce</text><text x="416" y="326" fill="#587089" font-family="Inter,Arial" font-size="18" font-weight="700">řešit čistý příjem</text><text x="416" y="366" fill="#081A33" font-family="Inter,Arial" font-size="26" font-weight="900">stabilnější rozsah</text></g></svg>
