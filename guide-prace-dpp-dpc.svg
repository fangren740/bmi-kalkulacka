<svg width="720" height="520" viewBox="0 0 720 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="520" rx="40" fill="url(#bg)"/>
  <rect x="40" y="40" width="640" height="440" rx="34" fill="#FFFFFF" stroke="#D9E8F3"/>
  <rect x="72" y="74" width="160" height="34" rx="17" fill="#ECF7E8"/>
  <text x="91" y="96" fill="#2A7B1F" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Dohody o práci</text>
  <text x="72" y="154" fill="#081A33" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900">DPP nebo DPČ?</text>
  <text x="72" y="192" fill="#5A7088" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Srovnání podle typu spolupráce a příjmu</text>

  <g>
    <rect x="72" y="240" width="256" height="168" rx="28" fill="#F4F9FD" stroke="#D9E8F3"/>
    <text x="104" y="285" fill="#0B5AA7" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="900">DPP</text>
    <text x="104" y="322" fill="#5A7088" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">spíš brigáda nebo</text>
    <text x="104" y="347" fill="#5A7088" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">kratší přivýdělek</text>
    <circle cx="110" cy="381" r="6" fill="#46B23A"/>
    <text x="126" y="387" fill="#081A33" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">rychlé srovnání</text>
  </g>
  <g>
    <rect x="392" y="240" width="256" height="168" rx="28" fill="#F1FAED" stroke="#CAE6C1"/>
