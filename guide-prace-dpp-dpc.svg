    <text x="424" y="347" fill="#5A7088" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">vedlejší spolupráce</text>
    <circle cx="430" cy="381" r="6" fill="#46B23A"/>
    <text x="446" y="387" fill="#081A33" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">stabilnější režim</text>
  </g>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="520" gradientUnits="userSpaceOnUse">
