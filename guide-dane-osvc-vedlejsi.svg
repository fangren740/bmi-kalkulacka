    <text x="165" y="268" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6d5c91">daň • přehledy • zálohy</text>
    <rect x="145" y="300" width="112" height="78" rx="18" fill="#eef2ff" stroke="#c7d2fe"/>
