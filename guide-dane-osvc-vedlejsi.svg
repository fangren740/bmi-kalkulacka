    <text x="165" y="355" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="900" fill="#111827">§ 7</text>
    <rect x="280" y="300" width="115" height="78" rx="18" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="300" y="330" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#047857">Výdaje</text>
    <text x="300" y="355" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="900" fill="#111827">paušál</text>
