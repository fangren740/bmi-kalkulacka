<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">OSVČ vedlejší činnost a daně</title>
  <desc id="desc">Moderní ilustrace vedlejšího podnikání, daňového přiznání, přehledů a záloh.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="20" x2="650" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5f3ff"/><stop offset="0.55" stop-color="#ffffff"/><stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="purple" x1="160" y1="80" x2="570" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="green" x1="420" y1="120" x2="610" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#111827" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="720" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="96" cy="96" r="62" fill="#7c3aed" opacity=".10"/>
  <circle cx="630" cy="412" r="78" fill="#14b8a6" opacity=".10"/>
  <g filter="url(#shadow)">
