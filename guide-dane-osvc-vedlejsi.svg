    <rect x="145" y="146" width="250" height="12" rx="6" fill="#c4b5fd"/>
    <rect x="145" y="174" width="205" height="12" rx="6" fill="#e9d5ff"/>
    <rect x="145" y="220" width="250" height="58" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
